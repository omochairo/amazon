# GitLab CI: サイトビルド & GitLab Pages デプロイ
# GitHub Actions 02-publish.yml の移植 (GitHub アカウント凍結対応, 2026-07-07)。
# ビルドに secrets は不要 (build_post.py / build_brand_hub_stats.py /
# build_price_dashboard.py は data/ 配下の JSON からレンダリングするだけ)。
#
# 注意: hugo/config.toml の baseURL は https://navi.omcha.jp/ 固定のため、
# GitLab Pages のカスタムドメイン設定 + DNS 切替が完了するまで
# *.gitlab.io の素の URL では CSS/リンクが崩れて見える (仕様通り)。

stages:
  - generate
  - deploy
  - postdeploy

# 冗長パイプラインの自動キャンセル (2026-08-05)。
# main への push は 1 日 53 本あり、runner は NAS 1 台の concurrent=1。同じサイトを
# 1 日 53 回ビルドし直していたため、実測で作成→完了の中央値 53 分・最大 3.4 時間の
# 滞留が発生し (デプロイが 1〜2 時間遅れる)、その間 NAS が周期的に 97% CPU / 85-88℃ まで
# 上がって heartbeat の温度アラートを鳴らしていた。
#
# pages はリポジトリの状態から丸ごと生成する冪等ジョブなので、古いコミット用の
# ビルドを完走させる価値はない (次のビルドが上位互換の成果物を出す)。
#   - on_new_commit: interruptible → **新しいコミットが来たときだけ**・
#     **interruptible: true のジョブだけ**キャンセルする。
#   - schedule 起動 (invoke-jules 6h 毎) は新規コミットではないので発火しない。
#     加えて invoke-jules / fetch-data 等は interruptible を付けていない (既定 false) ため
#     二重に保護されている。記事生成が途中で殺されることはない。
# 併せて project 設定 auto_cancel_pending_pipelines も enabled にしてある
# (この keyword はプロジェクト側のマスタースイッチが前提)。
workflow:
  auto_cancel:
    on_new_commit: interruptible

# MR 検証 (旧 04-validate-article-pr.yml の移植, フェーズ3)。
# すべての MR で走る。記事 JSON の変更が無ければ vacuous success。
# スコープガード (自動マージ適格性) は旧 05 と違いここでは判定しない:
# オーケストレータが patch 抽出時に「記事 1 ファイルのみ」を強制済みで、
# 手動 MR (docs 等) を fail させると pipelines-must-succeed 設定下で merge 不能になるため。
validate-article:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -e
      base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      changed=$(git diff --name-only "$base"...HEAD)
      echo "changed files:"; echo "$changed"
      arts=$(echo "$changed" | grep -E '^data/articles/[^/]+\.json$' | grep -vE '\.(quality|enrichment|seo)\.json$' || true)
      if [ -z "$arts" ]; then echo "no article JSON changes (vacuous success)"; exit 0; fi
      pip install -r requirements.txt
      mkdir -p hugo/content/posts
      tmp=$(mktemp -d)
      for f in $arts; do
        [ -f "$f" ] || continue
        python scripts/validate_json.py --json "$f" --schema data/schema/article.schema.json
        cp "$f" "$tmp/"
      done
      python scripts/quality_gate.py --src "$tmp/" --posts hugo/content/posts/ --schema data/schema/article.schema.json --strict

# 記事生成 (旧 03-invoke-jules.yml の移植, フェーズ2)。
# schedule (6h 毎, SCHEDULE_JOB=invoke-jules) または API/web 起動の同変数指定で発火。
# repoless Jules セッション → 検証 → MR 作成まで scripts/invoke_jules_repoless.py が行う。
invoke-jules:
  stage: generate
  image: python:3.11-bookworm
  rules:
    # スケジュール多重化 (フェーズ4): project bot はスケジュール「変数」を追加
    # できない (API 403) ため、description の前方一致でジョブを振り分ける
    # (CI_PIPELINE_SCHEDULE_DESCRIPTION は GitLab 17.8+)。
    # 既存 schedule id 4326910 の description は "invoke-jules (記事生成 6h毎)"。
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^invoke-jules/'
    - if: '$SCHEDULE_JOB == "invoke-jules"'
  timeout: 75 minutes
  before_script:
    - pip install -r requirements.txt
    # hugo/ は gitignore 配下で checkout に posts が無い。quality_gate の --posts 用に空で用意
    - mkdir -p hugo/content/posts
  script:
    - python scripts/invoke_jules_repoless.py

# ---- データ更新系 (フェーズ4, 2026-07-07) --------------------------------
# 旧 GitHub Actions 01-fetch / 07-rakuten / 34-third-party の移植。
# いずれも「fetch → git add → branch push → MR → MWPS」で main に乗せる
# (scripts/create_data_mr.py)。secrets 未設定の step は skip して安全に空振り。
# 必要な CI/CD 変数 (旧 GitHub Secrets 対応表):
#   fetch-data     : AMAZON_CREATORS_APPLICATION_ID / AMAZON_CREATORS_CREDENTIAL_ID /
#                    AMAZON_CREATORS_CREDENTIAL_SECRET / AMAZON_PARTNER_TAG /
#                    RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_AFFILIATE_ID /
#                    YOUTUBE_API_KEY(2-5) / YAHOO_CLIENT_ID / VALUECOMMERCE_SID /
#                    VALUECOMMERCE_PID / GOOGLEBOOKS_API_KEY / OMCHA_API_KEY
#   rakuten-ranking: RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_AFFILIATE_ID
#   third-party    : TAVILY_API_KEY

# 日次データ更新 (旧 01-fetch-products.yml)。schedule 2 本 (朝/夕, 1h オフセットで
# invoke-jules の 6h グリッドと衝突させない)。
fetch-data:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^fetch-data/'
    - if: '$SCHEDULE_JOB == "fetch-data"'
  # E2E 実測 (2026-07-07): fetch_amazon 18分 + cross_search が未マッチ対象を
  # 毎回再検索するため 60 分では不足。TPS=1 sleep 込みで余裕を持たせる
  timeout: 180 minutes
  variables:
    GIT_DEPTH: "0"
  before_script:
    - pip install -r requirements.txt
  script:
    - sh scripts/ci_fetch_data.sh

# 週次楽天ランキング (旧 07-rakuten-ranking.yml)。火曜 06:00 JST = 月曜 21:00 UTC。
# hugo/data/ranking/ は gitignore 配下 → create_data_mr が git add -f で stage する。
rakuten-ranking:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^rakuten-ranking/'
    - if: '$SCHEDULE_JOB == "rakuten-ranking"'
  timeout: 30 minutes
  variables:
    GIT_DEPTH: "0"
  before_script:
    - pip install -r requirements.txt
  script:
    - python scripts/fetch_rakuten.py --out data/raw/
    - >
      python scripts/create_data_mr.py
      --prefix rakuten-ranking
      --title "data: weekly rakuten ranking update"
      --body "Automated weekly Rakuten ranking refresh (旧 07-rakuten-ranking.yml の GitLab 移植). /ranking/ ページ用 hugo/data/ranking/weekly.json と signal_detector 用 data/raw/rakuten_ranking.json を更新。"
      --paths hugo/data/ranking/weekly.json hugo/data/ranking/_match_manifest.json data/raw/rakuten_ranking.json data/raw/_rakuten_ranking_manifest.json

# 第三者ソース pre-fetch (旧 34-third-party-sources.yml, #1600 Phase 2)。
# 毎日 21:30 UTC (06:30 JST)。TAVILY_API_KEY 未設定なら script が inert に no-op。
third-party-sources:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^third-party-sources/'
    - if: '$SCHEDULE_JOB == "third-party-sources"'
  timeout: 30 minutes
  variables:
    GIT_DEPTH: "0"
  before_script:
    - pip install -r requirements.txt
  script:
    # レーン1: 新規候補 (まだ記事になっていない ASIN)。
    - python scripts/fetch_third_party_sources.py --pool --bands zero,thin --max-queries 30
    # レーン2: 既存記事 (リライト対象)。母集合を GSC 需要へ差し替える (brain#13 2-3)。
    # 枠は別に持つ。共有すると母集合の大きい既存記事が新規候補レーンを飢えさせる。
    - python scripts/fetch_third_party_sources.py --from-gsc --max-age-days 90 --max-queries 20
    - >
      python scripts/create_data_mr.py
      --prefix third-party-sources
      --title "data: third-party source pre-fetch (#1600)"
      --body "Automated #1600 Phase 2 pre-fetch (旧 34-third-party-sources.yml の GitLab 移植). data/raw/per_asin/**/third_party_sources.json のみの更新。"
      --paths data/raw/per_asin

pages:
  stage: deploy
  image: python:3.11-bookworm
  # 新しいコミットが来たら、走行中/待機中の古い pages ビルドは捨ててよい
  # (成果物は git の状態から丸ごと再生成されるので、新しい方が常に上位互換)。
  # 上の workflow.auto_cancel と対で効く。詳細はそちらのコメント参照。
  interruptible: true
  # **実行先は K8 (Ryzen 7 8845HS)。ここに tags を書かないのは意図的**
  # (2026-08-05・責務分掌: NAS=I/O と常時稼働 / K8=計算 → omochairo/amazon#4528)。
  # どちらの箱に流すかは runner 側の `run_untagged` フラグ 1 つで決めており、
  # CI ファイルを触らずに切り戻せるようにしてある。
  #   K8 が止まって配信を戻したいとき:
  #     glab api --method PUT "runners/54145618?run_untagged=true"   # NAS runner を復帰
  #   特定ジョブだけ NAS に固定したいとき: そのジョブに tags: [omocha-docker]
  # NAS で回していた頃の実測は 1 回 13.1 分 (build_post 301s / hugo 159s /
  # brotli 174s / pip 71s / artifacts 63s)。スループット比は K8 が 4.3 倍。
  rules:
    # push 起動のみ (schedule 起動の invoke-jules と分離する, 設計 H8)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  variables:
    # PaperMod テーマは submodule (public repo) なので recursive 取得が必須
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: "0"
    HUGO_VERSION: "0.146.0"
  before_script:
    # OG 画像合成 (build_og_image.py) に CJK フォントが必要。無いと Amazon 画像 URL への fallback になる
    - apt-get update -y && apt-get install -y --no-install-recommends fonts-noto-cjk curl brotli
    - curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
    - hugo version
    - pip install -r requirements.txt
  script:
    - python scripts/build_post.py
    - python scripts/build_brand_hub_stats.py
    - python scripts/build_price_dashboard.py
    # #5225: 全ページのカードに出す「Amazon価格の推移」チャート (ASIN キーの辞書)。
    # 落ちても partial 側が fail-soft でチャートを出さないだけなのでページは焼ける。
    - python scripts/build_price_sparks.py
    - python scripts/build_discounts.py
    - python scripts/build_age_concerns.py
    # #4007: /deals/ /cospa/ とテーマ/年齢 hub もビルド時派生にする。従来は
    # GitHub 側 09-feature-lists.yml の cron (deals=週次 / cospa=月次) が commit した
    # hugo/data/features/*.json を配信ビルドがそのまま使っており、入力データ
    # (per_asin 中央値2日 / price_watch 0.6日) より**ページの方が古い**状態だった。
    # 両方あわせて実測 3.4 秒・外部 API 呼び出しゼロなので毎デプロイ回す。
    # commit 済み JSON は残してあるので、この 2 step が落ちても直近 commit 版で
    # fail-soft する (git checkout 時点の features/*.json がそのまま使われる)。
    - python scripts/build_feature_lists.py --top-n 20
    - python scripts/build_category_hubs.py --top-n 24
    - cd hugo && hugo --minify --buildFuture --destination ../public && cd ..
    # omcha-ops#19 P1 catch 層: 配信物の Amazon リンクが全て SSOT の
    # トラッキング ID を持つことを配信前に確認する。prevent 層
    # (build_post.py の _force_amazon_partner_tag / partials/amazon_affiliate_url.html)
    # を通っていれば絶対に鳴らないので、鳴ったら新しい出力経路が増えている。
    # 収益ゼロのリンクを焼くくらいなら配信を止める方が軽い。
    - python scripts/check_affiliate_tags.py --root public
    # #2817 Phase 3: 旧 JP タグ/ブランド URL からの 301 リダイレクト。
    # public/sitemap.xml (直前の hugo build 産物) を真実源に redirect ルールを
    # 生成し、Hugo の static コピーを経由せず public/_redirects に直接書き出す
    # (二度目の hugo build は不要)。
    # #6205 T5: 同じルールを nginx の map 形式でも出す。map はリリースに同梱され、
    # NAS オリジンの nginx が current/redirects.map として include する。
    # _redirects は GitLab Pages (待機系) 用なので、両方出し続ける。
    - python scripts/generate_term_redirects.py --sitemap public/sitemap.xml --format both --out public/_redirects --out-map public/redirects.map
    # #6205 T9: 外形監視が「いつの・どのコミットが配信されているか」を見る的。
    # 監視 51 は sitemap の lastmod を見ていたため 19 時間の停止を検知できなかった。
    - printf '{"sha":"%s","built_at":"%s","ref":"%s"}' "$CI_COMMIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$CI_COMMIT_REF_NAME" > public/build.json
    # #6415: 待機系 GitLab Pages の 1 GiB 上限を監視するための計測。
    #
    # **展開後のバイト数でなければ意味がない。** 上限は展開後に効くのに、
    # jobs API から取れる artifacts (archive) は zip 圧縮後で、2026-09-06 実測では
    # 展開 665MB に対し archive 220MB と 3 倍違う。Pages API の deployments は
    # サイズを持たない。そこでここで `du -sb` して 1 行ログに出し、GitHub 側の
    # 54-pages-size-monitor.yml (scripts/check_pages_size.py) がこの行を読む。
    #
    # **ここでは落とさない。** 落とすと待機系の更新が止まり、いざ NAS が倒れた
    # ときにより古い配信物しか残らない (#6415 の設計判断)。判定と起票は GitHub 側。
    - |
      PAGES_ARTIFACT_BYTES=$(du -sb public | cut -f1)
      echo "PAGES_ARTIFACT_BYTES=${PAGES_ARTIFACT_BYTES}"
      awk -v b="$PAGES_ARTIFACT_BYTES" 'BEGIN{printf "pages artifact: %.1f MiB (%.1f%% of the 1 GiB limit)\n", b/1048576, b/1073741824*100}'
    # #3055 E1 の事前圧縮 (.gz/.br 併置) は 2026-08-29 に撤去した。
    #
    # 理由: GitLab Pages のデプロイが「artifacts for pages are too large:
    # 1059523450」で落ち、**本番が約 9 時間凍った**。テキストを .gz と .br の
    # 両方に複製していたため、配信物の実サイズが上限 (約 1.0 GiB) を超えていた。
    # 実測 (2026-08-29 の配信物 949 MB、gzip -9 = 0.214 / brotli q10 = 0.164):
    #   gzip + brotli 1.187 GB  ← 上限超過
    #   brotli のみ   1.016 GB  ← **これでもまだ超過**
    #   事前圧縮なし  0.884 GB  ← クリア
    # brotli だけに減らしても足りないので、事前圧縮そのものを外すしかない。
    #
    # 読者への影響が小さいと判断した根拠: navi.omcha.jp は Cloudflare の
    # プロキシ配下 (orange cloud) で、エッジがテキストを brotli/gzip で圧縮して
    # 返す。オリジンで圧縮済みファイルを併置する必要は無くなっている
    # (#3055 E1 を入れた時点ではプロキシ化前だった)。
    #
    # 副次的な効果として、amazon-home-ops#65 で問題になった「圧縮フェーズが
    # ビルド中で最も熱く、K8 の Tctl が 93℃ に張り付いてファンが唸る」も
    # 一緒に消える (-P2 に落として凌いでいた ~180 秒のフェーズごと無くなる)。
    #
    # **これは応急処置で、余裕は 99 MB しかない。** 直近の成長ペース (10 日で
    # 約 12%) だと 3〜4 週間でまた上限に当たる。恒久対応は配信物から
    # noindex の tag ページ (7,316 枚 / 299 MB) を外すこと。
  artifacts:
    paths:
      - public
    # **保管を 1 日で切る (#6205 T8)。** この artifact は 1 回 555MB あり、main への
    # push は 1 日 50 本前後なので約 27GB/日 が GitLab に積まれ続けていた
    # (2026-08-29 実測で job_artifacts_size = 463GB)。
    # 用途は 2 つとも短命:
    #   - GitLab Pages への配信 (待機系。ジョブ成功直後に取り込まれる)
    #   - 同一パイプライン内の deploy-nas / cf-purge が受け取る
    # 過去の artifact を後から取り出す運用は無い。
    expire_in: 1 day

# #3059 Day2: Cloudflare エッジキャッシュの purge。
# navi.omcha.jp プロキシ化 + Cache Rule (Edge TTL 1h) 稼働後、デプロイ反映を即時化する。
# - postdeploy ステージに置く理由: gitlab.com では pages ジョブ成功後に特殊ジョブ
#   pages:deploy (deploy ステージ) が実際の配信反映を行う。purge を GitHub 側
#   40-mirror-to-gitlab.yml に置くと「push 直後・ビルド完了前」に走ってしまい
#   古いコンテンツを再キャッシュするため、配信反映後のここが正位置。
# - CF_ZONE_ID / CF_PURGE_TOKEN (Zone.Cache Purge 権限のみ) が CI/CD 変数に
#   未設定の間はジョブ自体が生成されない (プロキシ化前は no-op)。
# - Free プランは purge_everything か URL 個別指定のみ (hostname/prefix purge は
#   Enterprise)。root omcha.jp は DNS only でエッジキャッシュを持たないため
#   zone 全体 purge でも実害なし。
#
# #5260: purge の前に「参照アセットがオリジンから返る」ことを確認する。
#   purge は全クライアントに新しい HTML を配る操作なので、ファイル入れ替えが
#   終わる前に撃つと、まだ存在しない指紋付き CSS を一斉に取りに行かせることになる。
#   /assets/** の 404 は長期キャッシュされうる (2026-08-15 実測: max-age=31536000) ため、
#   その一瞬が読者のブラウザに焼き付く。確認できないまま時間切れになったら
#   purge せずに落とす (古い HTML がエッジに残る方が、無スタイル表示より軽い)。
cf-purge:
  stage: postdeploy
  image: curlimages/curl:latest
  # pages ジョブの public/ を受け取る (参照アセットの真実源は生成物側)。
  dependencies:
    - pages
  # **NAS への切替が終わってから purge する (#6205 T8)。** 2026-08-30 に本番の
  # 配信元が NAS になったので、purge の対象オリジンは deploy-nas が置いたもの。
  # 同じ postdeploy ステージに居ると並行して走るため、明示的に順序を付ける。
  # (before_script のアセット待ちが最後の砦だが、そこに頼らない)
  needs:
    - pages
    - deploy-nas
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CF_ZONE_ID && $CF_PURGE_TOKEN'
  before_script:
    - sh scripts/ci_wait_for_assets.sh public/index.html https://navi.omcha.jp
  script:
    - |
      curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
        -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
        -H "Content-Type: application/json" \
        --data '{"purge_everything":true}'

# #6205 T6: 配信物を NAS のオリジンへ置く。
#
# **この時点では DNS はまだ GitLab Pages を向いている。** つまりこのジョブは
# 「本番と同じ内容を NAS にも置く」だけで、読者には影響しない。切替 (T8) は
# DNS 1 行の変更で行い、その時点でこのジョブが本番配信になる。
#
# 設計の要点 (詳細は omochairo/amazon#6205):
# - 鍵は NAS 側で forced command (deploy-shell) に縛られており、
#   `rsync --server …` と `switch <sha>` の 2 つしか実行できない
# - --checksum: hugo は毎ビルドで全ファイルを書き直すので mtime は当てにならない。
#   これが無いと差分ゼロでも毎回 600MB 超を送ることになる
# - --link-dest=/current: 同一内容をハードリンクで共有する。**restricted root
#   起点の絶対パスで書く**。rrsync は `..` を含む --link-dest を拒否する
# - 切替は NAS 側の navi-switch が健全性検査 (index.html / build.json /
#   redirects.map の存在 + 空き容量) を通してから symlink を差し替える
# - ロールバックは `switch <古い sha>` の 1 コマンド。CI を通さない
#
# 変数 (すべて protected。**このリポジトリは public なので値をここに書かない**):
#   NAS_DEPLOY_KEY (file) / NAS_HOST / NAS_SSH_PORT / NAS_HOST_KEY
deploy-nas:
  stage: postdeploy
  image: alpine:3.20
  # pages の public/ をそのまま置く (再ビルドしない = 内容が確実に一致する)。
  dependencies:
    - pages
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $NAS_DEPLOY_KEY && $NAS_HOST'
  before_script:
    - apk add --no-cache rsync openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # **鍵は必ず正規化してから置く。** file 型 CI 変数は登録の仕方で末尾改行が
    # 落ちたり CRLF が混ざったりする (2026-08-30 に実際に踏んだ)。そのときの
    # 症状は `Load key: error in libcrypto` -> `Permission denied (publickey)` で、
    # **鍵そのものが間違っているように見える**。awk 1 が「厳密に 1 個の末尾改行」を
    # 保証し、tr が CR を落とす。
    - awk 1 "$NAS_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/nas_deploy_key
    - chmod 600 ~/.ssh/nas_deploy_key
    # host 鍵はピン留めする (StrictHostKeyChecking=no にしない)。
    - printf '%s\n' "$NAS_HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
  script:
    # navi-switch 側でも検査するが、送る前に落とせるものはここで落とす。
    - test -s public/index.html
    - test -s public/build.json
    - test -f public/redirects.map
    - export SSHOPT="ssh -p ${NAS_SSH_PORT:-2222} -i $HOME/.ssh/nas_deploy_key -o BatchMode=yes -o ConnectTimeout=15"
    # **-t を付けない (mtime を保存しない)。** hugo は毎ビルドで全ファイルを
    # 書き直すので mtime は必ず変わる。-t を付けると rsync は「保存する属性が
    # 一致しない」と見なして --link-dest からハードリンクせず実体をコピーする。
    # 2026-08-30 の実測: 内容が完全に同一の 2 世代で共有が 19,562 件中 10 件しか
    # 効かず、1 世代あたり 693MB を毎回転送・毎回書き込んでいた。
    # 切り分け (同一内容・mtime だけ違う 2 ファイルで再現):
    #   -rlptD --checksum --link-dest -> links=1 (コピーされる)
    #   -rlpD  --checksum --link-dest -> links=2 (共有される)
    # 内容の比較は --checksum が担うので、mtime を捨てても再転送は増えない。
    - rsync -rlpD --delete --checksum --safe-links --link-dest=/current -e "$SSHOPT" public/ "deploy@${NAS_HOST}:releases/${CI_COMMIT_SHA}/"
    - $SSHOPT "deploy@${NAS_HOST}" "switch ${CI_COMMIT_SHA}"
