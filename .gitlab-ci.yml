# GitLab CI: サイトビルド & GitLab Pages デプロイ
# GitHub Actions 02-publish.yml の移植 (GitHub アカウント凍結対応, 2026-07-07)。
# ビルドに secrets は不要 (build_post.py / build_brand_hub_stats.py は
# data/ 配下の JSON からレンダリングするだけ)。
#
# 注意: hugo/config.toml の baseURL は https://navi.omcha.jp/ 固定のため、
# GitLab Pages のカスタムドメイン設定 + DNS 切替が完了するまで
# *.gitlab.io の素の URL では CSS/リンクが崩れて見える (仕様通り)。

stages:
  - generate
  - deploy

# MR 検証 (旧 04-validate-article-pr.yml の移植, フェーズ3)。
# すべての MR で走る。記事 JSON の変更が無ければ vacuous success。
# スコープガード (自動マージ適格性) は旧 05 と違いここでは判定しない:
# オーケストレータが patch 抽出時に「記事 1 ファイルのみ」を強制済みで、
# 手動 MR (docs 等) を fail させると pipelines-must-succeed 設定下で merge 不能になるため。
validate-article:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -e
      base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      changed=$(git diff --name-only "$base"...HEAD)
      echo "changed files:"; echo "$changed"
      arts=$(echo "$changed" | grep -E '^data/articles/[^/]+\.json$' | grep -vE '\.(quality|enrichment|seo)\.json$' || true)
      if [ -z "$arts" ]; then echo "no article JSON changes (vacuous success)"; exit 0; fi
      pip install -r requirements.txt
      mkdir -p hugo/content/posts
      tmp=$(mktemp -d)
      for f in $arts; do
        [ -f "$f" ] || continue
        python scripts/validate_json.py --json "$f" --schema data/schema/article.schema.json
        cp "$f" "$tmp/"
      done
      python scripts/quality_gate.py --src "$tmp/" --posts hugo/content/posts/ --schema data/schema/article.schema.json --strict

# 記事生成 (旧 03-invoke-jules.yml の移植, フェーズ2)。
# schedule (6h 毎, SCHEDULE_JOB=invoke-jules) または API/web 起動の同変数指定で発火。
# repoless Jules セッション → 検証 → MR 作成まで scripts/invoke_jules_repoless.py が行う。
invoke-jules:
  stage: generate
  image: python:3.11-bookworm
  rules:
    # schedule はこの 1 本のみ (id 4326910)。project bot はスケジュール変数を追加
    # できない (API 403) ため、source==schedule で発火させる。フェーズ3 で
    # lock-cleanup schedule を足すときに SCHEDULE_JOB 変数方式へ再設計する。
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$SCHEDULE_JOB == "invoke-jules"'
  timeout: 75 minutes
  before_script:
    - pip install -r requirements.txt
    # hugo/ は gitignore 配下で checkout に posts が無い。quality_gate の --posts 用に空で用意
    - mkdir -p hugo/content/posts
  script:
    - python scripts/invoke_jules_repoless.py

pages:
  stage: deploy
  image: python:3.11-bookworm
  rules:
    # push 起動のみ (schedule 起動の invoke-jules と分離する, 設計 H8)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  variables:
    # PaperMod テーマは submodule (public repo) なので recursive 取得が必須
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: "0"
    HUGO_VERSION: "0.146.0"
  before_script:
    # OG 画像合成 (build_og_image.py) に CJK フォントが必要。無いと Amazon 画像 URL への fallback になる
    - apt-get update -y && apt-get install -y --no-install-recommends fonts-noto-cjk curl
    - curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
    - hugo version
    - pip install -r requirements.txt
  script:
    - python scripts/build_post.py
    - python scripts/build_brand_hub_stats.py
    - cd hugo && hugo --minify --buildFuture --destination ../public
  artifacts:
    paths:
      - public
