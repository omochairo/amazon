# GitLab CI: サイトビルド & GitLab Pages デプロイ
# GitHub Actions 02-publish.yml の移植 (GitHub アカウント凍結対応, 2026-07-07)。
# ビルドに secrets は不要 (build_post.py / build_brand_hub_stats.py /
# build_price_dashboard.py は data/ 配下の JSON からレンダリングするだけ)。
#
# 注意: hugo/config.toml の baseURL は https://navi.omcha.jp/ 固定のため、
# GitLab Pages のカスタムドメイン設定 + DNS 切替が完了するまで
# *.gitlab.io の素の URL では CSS/リンクが崩れて見える (仕様通り)。

stages:
  - generate
  - deploy
  - postdeploy

# MR 検証 (旧 04-validate-article-pr.yml の移植, フェーズ3)。
# すべての MR で走る。記事 JSON の変更が無ければ vacuous success。
# スコープガード (自動マージ適格性) は旧 05 と違いここでは判定しない:
# オーケストレータが patch 抽出時に「記事 1 ファイルのみ」を強制済みで、
# 手動 MR (docs 等) を fail させると pipelines-must-succeed 設定下で merge 不能になるため。
validate-article:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -e
      base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      changed=$(git diff --name-only "$base"...HEAD)
      echo "changed files:"; echo "$changed"
      arts=$(echo "$changed" | grep -E '^data/articles/[^/]+\.json$' | grep -vE '\.(quality|enrichment|seo)\.json$' || true)
      if [ -z "$arts" ]; then echo "no article JSON changes (vacuous success)"; exit 0; fi
      pip install -r requirements.txt
      mkdir -p hugo/content/posts
      tmp=$(mktemp -d)
      for f in $arts; do
        [ -f "$f" ] || continue
        python scripts/validate_json.py --json "$f" --schema data/schema/article.schema.json
        cp "$f" "$tmp/"
      done
      python scripts/quality_gate.py --src "$tmp/" --posts hugo/content/posts/ --schema data/schema/article.schema.json --strict

# 記事生成 (旧 03-invoke-jules.yml の移植, フェーズ2)。
# schedule (6h 毎, SCHEDULE_JOB=invoke-jules) または API/web 起動の同変数指定で発火。
# repoless Jules セッション → 検証 → MR 作成まで scripts/invoke_jules_repoless.py が行う。
invoke-jules:
  stage: generate
  image: python:3.11-bookworm
  rules:
    # スケジュール多重化 (フェーズ4): project bot はスケジュール「変数」を追加
    # できない (API 403) ため、description の前方一致でジョブを振り分ける
    # (CI_PIPELINE_SCHEDULE_DESCRIPTION は GitLab 17.8+)。
    # 既存 schedule id 4326910 の description は "invoke-jules (記事生成 6h毎)"。
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^invoke-jules/'
    - if: '$SCHEDULE_JOB == "invoke-jules"'
  timeout: 75 minutes
  before_script:
    - pip install -r requirements.txt
    # hugo/ は gitignore 配下で checkout に posts が無い。quality_gate の --posts 用に空で用意
    - mkdir -p hugo/content/posts
  script:
    - python scripts/invoke_jules_repoless.py

# ---- データ更新系 (フェーズ4, 2026-07-07) --------------------------------
# 旧 GitHub Actions 01-fetch / 07-rakuten / 34-third-party の移植。
# いずれも「fetch → git add → branch push → MR → MWPS」で main に乗せる
# (scripts/create_data_mr.py)。secrets 未設定の step は skip して安全に空振り。
# 必要な CI/CD 変数 (旧 GitHub Secrets 対応表):
#   fetch-data     : AMAZON_CREATORS_APPLICATION_ID / AMAZON_CREATORS_CREDENTIAL_ID /
#                    AMAZON_CREATORS_CREDENTIAL_SECRET / AMAZON_PARTNER_TAG /
#                    RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_AFFILIATE_ID /
#                    YOUTUBE_API_KEY(2-5) / YAHOO_CLIENT_ID / VALUECOMMERCE_SID /
#                    VALUECOMMERCE_PID / GOOGLEBOOKS_API_KEY / OMCHA_API_KEY
#   rakuten-ranking: RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY / RAKUTEN_AFFILIATE_ID
#   third-party    : TAVILY_API_KEY

# 日次データ更新 (旧 01-fetch-products.yml)。schedule 2 本 (朝/夕, 1h オフセットで
# invoke-jules の 6h グリッドと衝突させない)。
fetch-data:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^fetch-data/'
    - if: '$SCHEDULE_JOB == "fetch-data"'
  # E2E 実測 (2026-07-07): fetch_amazon 18分 + cross_search が未マッチ対象を
  # 毎回再検索するため 60 分では不足。TPS=1 sleep 込みで余裕を持たせる
  timeout: 180 minutes
  variables:
    GIT_DEPTH: "0"
  before_script:
    - pip install -r requirements.txt
  script:
    - sh scripts/ci_fetch_data.sh

# 週次楽天ランキング (旧 07-rakuten-ranking.yml)。火曜 06:00 JST = 月曜 21:00 UTC。
# hugo/data/ranking/ は gitignore 配下 → create_data_mr が git add -f で stage する。
rakuten-ranking:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^rakuten-ranking/'
    - if: '$SCHEDULE_JOB == "rakuten-ranking"'
  timeout: 30 minutes
  variables:
    GIT_DEPTH: "0"
  before_script:
    - pip install -r requirements.txt
  script:
    - python scripts/fetch_rakuten.py --out data/raw/
    - >
      python scripts/create_data_mr.py
      --prefix rakuten-ranking
      --title "data: weekly rakuten ranking update"
      --body "Automated weekly Rakuten ranking refresh (旧 07-rakuten-ranking.yml の GitLab 移植). /ranking/ ページ用 hugo/data/ranking/weekly.json と signal_detector 用 data/raw/rakuten_ranking.json を更新。"
      --paths hugo/data/ranking/weekly.json hugo/data/ranking/_match_manifest.json data/raw/rakuten_ranking.json data/raw/_rakuten_ranking_manifest.json

# 第三者ソース pre-fetch (旧 34-third-party-sources.yml, #1600 Phase 2)。
# 毎日 21:30 UTC (06:30 JST)。TAVILY_API_KEY 未設定なら script が inert に no-op。
third-party-sources:
  stage: generate
  image: python:3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^third-party-sources/'
    - if: '$SCHEDULE_JOB == "third-party-sources"'
  timeout: 30 minutes
  variables:
    GIT_DEPTH: "0"
  before_script:
    - pip install -r requirements.txt
  script:
    - python scripts/fetch_third_party_sources.py --pool --bands zero,thin --max-queries 30
    - >
      python scripts/create_data_mr.py
      --prefix third-party-sources
      --title "data: third-party source pre-fetch (#1600)"
      --body "Automated #1600 Phase 2 pre-fetch (旧 34-third-party-sources.yml の GitLab 移植). data/raw/per_asin/**/third_party_sources.json のみの更新。"
      --paths data/raw/per_asin

pages:
  stage: deploy
  image: python:3.11-bookworm
  rules:
    # push 起動のみ (schedule 起動の invoke-jules と分離する, 設計 H8)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  variables:
    # PaperMod テーマは submodule (public repo) なので recursive 取得が必須
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: "0"
    HUGO_VERSION: "0.146.0"
  before_script:
    # OG 画像合成 (build_og_image.py) に CJK フォントが必要。無いと Amazon 画像 URL への fallback になる
    - apt-get update -y && apt-get install -y --no-install-recommends fonts-noto-cjk curl brotli
    - curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
    - hugo version
    - pip install -r requirements.txt
  script:
    - python scripts/build_post.py
    - python scripts/build_brand_hub_stats.py
    - python scripts/build_price_dashboard.py
    - python scripts/build_discounts.py
    - python scripts/build_age_concerns.py
    - cd hugo && hugo --minify --buildFuture --destination ../public && cd ..
    # #2817 Phase 3: 旧 JP タグ/ブランド URL からの 301 リダイレクト。
    # public/sitemap.xml (直前の hugo build 産物) を真実源に redirect ルールを
    # 生成し、Hugo の static コピーを経由せず public/_redirects に直接書き出す
    # (二度目の hugo build は不要)。
    - python scripts/generate_term_redirects.py --sitemap public/sitemap.xml --out public/_redirects
    # #3055 E1: GitLab Pages は .gz/.br 併置で自動圧縮配信する。テキスト系を precompress
    - find public -type f -regextype posix-extended -iregex '.*\.(html|css|js|json|xml|svg|txt|webmanifest)$' -print0 | xargs -0 -r -n1 -P4 gzip -kf9
    - find public -type f -regextype posix-extended -iregex '.*\.(html|css|js|json|xml|svg|txt|webmanifest)$' -print0 | xargs -0 -r -n1 -P4 brotli -f -q 10
  artifacts:
    paths:
      - public

# #3059 Day2: Cloudflare エッジキャッシュの purge。
# navi.omcha.jp プロキシ化 + Cache Rule (Edge TTL 1h) 稼働後、デプロイ反映を即時化する。
# - postdeploy ステージに置く理由: gitlab.com では pages ジョブ成功後に特殊ジョブ
#   pages:deploy (deploy ステージ) が実際の配信反映を行う。purge を GitHub 側
#   40-mirror-to-gitlab.yml に置くと「push 直後・ビルド完了前」に走ってしまい
#   古いコンテンツを再キャッシュするため、配信反映後のここが正位置。
# - CF_ZONE_ID / CF_PURGE_TOKEN (Zone.Cache Purge 権限のみ) が CI/CD 変数に
#   未設定の間はジョブ自体が生成されない (プロキシ化前は no-op)。
# - Free プランは purge_everything か URL 個別指定のみ (hostname/prefix purge は
#   Enterprise)。root omcha.jp は DNS only でエッジキャッシュを持たないため
#   zone 全体 purge でも実害なし。
cf-purge:
  stage: postdeploy
  image: curlimages/curl:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CF_ZONE_ID && $CF_PURGE_TOKEN'
  script:
    - |
      curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
        -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
        -H "Content-Type: application/json" \
        --data '{"purge_everything":true}'
