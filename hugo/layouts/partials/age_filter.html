<div class="age-filter-container" id="age-filter-container">
  <div class="age-filter-header">
    <span class="age-filter-title">👶 対象年齢で絞り込む</span>
    
    <div class="age-filter-toggle-container">
      <div class="age-filter-toggle-switch" role="radiogroup" aria-label="年齢絞り込みモード">
        <button type="button" class="age-filter-toggle-btn active" id="age-toggle-match" data-mode="match" aria-checked="true" role="radio">
          ベストマッチ
        </button>
        <button type="button" class="age-filter-toggle-btn" id="age-toggle-all" data-mode="all" aria-checked="false" role="radio">
          遊べるおもちゃ全部
        </button>
      </div>
    </div>
    
    <button class="age-filter-clear-btn" id="age-filter-clear" style="display: none;" aria-label="年齢フィルターをクリアする">フィルター解除</button>
  </div>
  
  <div class="age-filter-stages">
    <!-- 乳児 (0歳) -->
    <div class="age-filter-stage" data-stage="baby" data-min="0" data-max="11">
      <button class="age-filter-stage-trigger" aria-expanded="false" aria-controls="stage-content-baby" type="button">
        <span class="stage-name">乳児 (0歳・月齢)</span>
        <span class="stage-arrow" aria-hidden="true">▼</span>
      </button>
      <div id="stage-content-baby" class="age-filter-stage-content" role="region" aria-label="乳児向け月齢選択">
        <div class="age-filter-stage-content-inner">
          <button class="age-btn" data-age="0">新生児〜 (0ヶ月〜)</button>
          <button class="age-btn" data-age="3">3ヶ月〜 (ねんね期)</button>
          <button class="age-btn" data-age="6">6ヶ月〜 (お座り期)</button>
          <button class="age-btn" data-age="10">10ヶ月〜 (はいはい期)</button>
        </div>
      </div>
    </div>

    <!-- 幼児 (1〜2歳) -->
    <div class="age-filter-stage" data-stage="toddler" data-min="12" data-max="35">
      <button class="age-filter-stage-trigger" aria-expanded="false" aria-controls="stage-content-toddler" type="button">
        <span class="stage-name">幼児 (1〜2歳)</span>
        <span class="stage-arrow" aria-hidden="true">▼</span>
      </button>
      <div id="stage-content-toddler" class="age-filter-stage-content" role="region" aria-label="幼児向け年齢選択">
        <div class="age-filter-stage-content-inner">
          <button class="age-btn" data-age="12">1歳〜</button>
          <button class="age-btn" data-age="18">1.5歳〜</button>
          <button class="age-btn" data-age="24">2歳〜</button>
        </div>
      </div>
    </div>

    <!-- 園児 (3〜5歳) -->
    <div class="age-filter-stage" data-stage="preschool" data-min="36" data-max="71">
      <button class="age-filter-stage-trigger" aria-expanded="false" aria-controls="stage-content-preschool" type="button">
        <span class="stage-name">園児 (3〜5歳)</span>
        <span class="stage-arrow" aria-hidden="true">▼</span>
      </button>
      <div id="stage-content-preschool" class="age-filter-stage-content" role="region" aria-label="園児向け年齢選択">
        <div class="age-filter-stage-content-inner">
          <button class="age-btn" data-age="36">3歳〜 (年少前後)</button>
          <button class="age-btn" data-age="48">4歳〜 (年中前後)</button>
          <button class="age-btn" data-age="60">5歳〜 (年長前後)</button>
        </div>
      </div>
    </div>

    <!-- 小学生 (6〜12歳) -->
    <div class="age-filter-stage" data-stage="school" data-min="72" data-max="143">
      <button class="age-filter-stage-trigger" aria-expanded="false" aria-controls="stage-content-school" type="button">
        <span class="stage-name">小学生 (6〜12歳)</span>
        <span class="stage-arrow" aria-hidden="true">▼</span>
      </button>
      <div id="stage-content-school" class="age-filter-stage-content" role="region" aria-label="小学生向け年齢選択">
        <div class="age-filter-stage-content-inner">
          <button class="age-btn" data-age="72">6歳〜 (小学校入学前後)</button>
          <button class="age-btn" data-age="84">7〜8歳〜 (低・中学年)</button>
          <button class="age-btn" data-age="108">9〜10歳〜 (中・高学年)</button>
        </div>
      </div>
    </div>

    <!-- 高学年・中学生以上 -->
    <div class="age-filter-stage" data-stage="senior" data-min="144" data-max="999">
      <button class="age-filter-stage-trigger" aria-expanded="false" aria-controls="stage-content-senior" type="button">
        <span class="stage-name">高学年・中学生以上 (12歳〜)</span>
        <span class="stage-arrow" aria-hidden="true">▼</span>
      </button>
      <div id="stage-content-senior" class="age-filter-stage-content" role="region" aria-label="高学年・中学生以上向け年齢選択">
        <div class="age-filter-stage-content-inner">
          <button class="age-btn" data-age="144">12歳〜 (中学生前後)</button>
          <button class="age-btn" data-age="180">15歳〜 (高校生・大人向け)</button>
        </div>
      </div>
    </div>
  </div>
</div>
