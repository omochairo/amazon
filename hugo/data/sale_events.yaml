# セール期間の告知 (#9449)。ここに 1 件書くと、期間中だけ全ページのヘッダー下に
# 告知帯が出て、終わると再ビルド無しで消える (partials/sale_notice.html +
# assets/js/sale_notice.js が閲覧時刻で判定する)。
#
# 書き方:
#   - shop はどのモールのセールか (amazon / rakuten / yahoo)。navi の告知帯と、
#     omcha-ops が omcha.jp・home.omcha.jp に送る段階の両方がこれで出し分ける。
#     このファイルは両サイトのセール日程の正本 (omcha-ops は public の main を読む)
#   - url は帯の文言を押したときの行き先 (そのモールのセールページ。アフィリエイトの
#     パラメータは付けない。partials/sale_event_url.html がモールごとに付ける)。
#     Amazon はおもちゃのセール品の絞り込み (omcha-ops で 2026-10-22 に実物を確認した形)、
#     楽天・Yahoo は公式のセールページ。ホストはモールに合わせる (test_sale_events.py)
#   - id は「<data/sale_calendar.yaml の id>-<開始年>」(例: prime-kanshasai-2026)。
#     毎年来るセールの登録忘れを知らせる scripts/sale_calendar_reminder.py が、
#     この id で登録済みかを判定する。カレンダーに無い単発のセールは自由に付けてよい
#   - start / end は必ずクォートし、+09:00 を付ける (JST)。end は「23:59 まで」なら 23:59:59
#   - phases は時系列順。重ねない
#   - headline は「開催中」の前に出る名前。label は前の区分から「◯◯は M/D H:MM から」と
#     予告するときの呼び名
#   - source / verified_on は確認元と確認日。公式の告知を見てから書く
#   - notes は期間を通して出す補足。個別の商品が値引きされているとは書かない (#6285)
#
# 検証: scripts/tests/test_sale_events.py
- id: prime-kanshasai-2026
  shop: amazon
  url: "https://www.amazon.co.jp/s?rh=n%3A13299531%2Cp_n_deal_type%3A10343614051"
  name: Amazon プライム感謝祭
  source: Amazon.co.jp のプライム感謝祭 告知ページ
  verified_on: 2026-10-13
  notes:
    - プライム会員限定
    - ポイントアップは要エントリー（期間中に合計1万円以上の買い物が対象）
  phases:
    - label: 先行セール
      headline: Amazon プライム感謝祭 先行セール
      start: "2026-10-13T00:00:00+09:00"
      end: "2026-10-15T23:59:59+09:00"
    - label: 本番
      headline: Amazon プライム感謝祭
      start: "2026-10-16T00:00:00+09:00"
      end: "2026-10-19T23:59:59+09:00"
