baseURL = 'https://navi.omcha.jp/'
languageCode = 'ja-jp'
title = 'おもちゃいろ 比較ナビ｜知育玩具スコア＆最安値チェッカー'
theme = 'PaperMod'
contentDir = 'content'
canonifyURLs = false
relativeURLs = false

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "知育玩具をスコアと価格で比較。Amazon・楽天・Yahoo!の3サイト価格を横断。元ソニーエンジニア×医療従事者のおもちゃいろのパパママが、20〜40代ファミリーの『今いちばんお得な買い方』を毎日更新します。"
  author = "おもちゃロボ 🤖"
  images = ["og-image.jpg"]
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  disableSpecial1stPost = false
  hidemeta = false
  comments = false
  # 見出し末尾に表示される # アンカーリンクを非表示
  disableAnchoredHeadings = true

  # カスタムホームレイアウト用のヒーロー設定 (homeInfoParams は使わずに layouts/index.html で描画)
  [params.hero]
    Title = "おもちゃいろ 比較ナビ"
    Subtitle = "スコアで選ぶ・3サイトで比べる知育玩具比較ナビ"
    Lead = "元ソニーエンジニア × 医療従事者の夫婦が運営する [おもちゃいろ](https://omcha.jp/) のパパママが、AI と一緒に毎日更新。20〜40代ファミリーの『失敗しない知育玩具選び』をサポートします。"

  [[params.socialIcons]]
    name = "globe"
    url = "https://omcha.jp/"
    title = "おもちゃいろ公式ブログ"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/omochairo"
    title = "GitHub"

  [params.cover]
    linkFullImages = true
    responsiveImages = true

  [params.label]
    text = "おもちゃいろ 比較ナビ"

  [params.assets]
    favicon = "🏆"

  # 検索機能
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# Markdown表示設定
[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

# タクソノミー (デフォルトの tags/categories に brands を追加)
[taxonomies]
  tag = "tags"
  category = "categories"
  brand = "brands"

# 出力フォーマット（検索用JSON）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ナビゲーションメニュー
[menu]
  [[menu.main]]
    name = "🏠 ホーム"
    url = "./"
    weight = 1
  [[menu.main]]
    name = "🧸 おもちゃ診断"
    url = "diagnosis/"
    weight = 2
  [[menu.main]]
    name = "🔥 楽天ランキング"
    url = "ranking/"
    weight = 3
  [[menu.main]]
    name = "💎 コスパ最強"
    url = "cospa/"
    weight = 4
  [[menu.main]]
    name = "🏷️ おトク特集"
    url = "deals/"
    weight = 5
  [[menu.main]]
    name = "🏢 メーカー別"
    url = "brands/"
    weight = 6
  [[menu.main]]
    name = "🔍 検索"
    url = "search/"
    weight = 7
  [[menu.main]]
    name = "📚 記事一覧"
    url = "posts/"
    weight = 8
