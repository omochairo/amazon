baseURL = 'https://navi.omcha.jp/'
languageCode = 'ja-jp'
title = 'おもちゃいろ 比較ナビ｜知育玩具スコア＆最安値チェッカー'
theme = 'PaperMod'
contentDir = 'content'
canonifyURLs = false
relativeURLs = false

# Issue #1263 ①: robots.txt を Hugo が自動生成 (sitemap 位置を含む)
enableRobotsTXT = true

# Issue #1263 ②: 価格・記事が日次更新される動的サイトのため changefreq=daily を明示
[sitemap]
  changefreq = 'daily'
  filename   = 'sitemap.xml'
  priority   = 0.5

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "知育玩具をスコアと価格で比較。Amazon・楽天・Yahoo!の3サイト価格を横断。元ソニーエンジニア×医療従事者のおもちゃいろのパパママが、20〜40代ファミリーの『今いちばんお得な買い方』を毎日更新します。"
  author = "おもちゃロボ 🤖"
  # Global OGP image for social previews (Issue #605)
  images = ["og-image.jpg"]
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  disableSpecial1stPost = false
  hidemeta = false
  comments = false
  # 見出し末尾に表示される # アンカーリンクを非表示
  disableAnchoredHeadings = true

  # カスタムホームレイアウト用のヒーロー設定 (homeInfoParams は使わずに layouts/index.html で描画)
  [params.hero]
    Title = "おもちゃいろ 比較ナビ"
    Subtitle = "スコアで選ぶ・3サイトで比べる知育玩具比較ナビ"
    Lead = "元ソニーエンジニア × 医療従事者の夫婦が運営する [おもちゃいろ](https://omcha.jp/) のパパママが、AI と一緒に毎日更新。20〜40代ファミリーの『失敗しない知育玩具選び』をサポートします。"

  [[params.socialIcons]]
    name = "globe"
    url = "https://omcha.jp/"
    title = "おもちゃいろ公式ブログ"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/omochairo"
    title = "GitHub"

  [params.cover]
    linkFullImages = true
    responsiveImages = true

  [params.label]
    text = "おもちゃいろ 比較ナビ"

  # Issue #1263 ⑤: E-E-A-T 強化 — PaperMod 標準 schema_json.html が IsHome で出力する
  # Organization JSON-LD の publisherType / sameAs / image を明示。
  # sameAs は omcha.jp 本家 JSON-LD と統一 (ブランド整合)。
  [params.schema]
    publisherType = "Organization"
    sameAs = [
      "https://omcha.jp/",
      "https://home.omcha.jp",
      "https://lit.link/omochairo",
      "https://linktr.ee/omochairo",
      "https://bio.site/omochairo",
      "https://potofu.me/omochairo",
      "https://gravatar.com/omochairo",
      "https://about.me/omochairo",
      "https://omochairo.github.io",
      "https://github.com/omochairo",
      "https://omocha.gitlab.io",
      "https://qiita.com/omochairo",
      "https://zenn.dev/omochairo",
      "https://medium.com/@omochairo",
      "https://omocha.pages.dev",
      "https://omocha.netlify.app",
      "https://omochairo.vercel.app",
      "https://omochairo.web.app",
      "https://www.npmjs.com/package/omochairo-config",
      "https://omochairo.connpass.com/",
      "https://omochairo.peatix.com",
      "https://www.producthunt.com/@omochairo",
      "https://sites.google.com/view/omocha",
      "https://www.behance.net/omochairo",
      "https://www.figma.com/@omocha",
      "https://note.com/omchairo",
      "https://speakerdeck.com/omochairo",
      "https://www.docswell.com/user/omochairo",
      "https://podcasts.apple.com/us/podcast/id1859409617",
      "https://open.spotify.com/show/2BSSc6QJwHYUKebyj3dE32",
      "https://music.amazon.co.jp/podcasts/f3f1e848-e4db-489e-bcdf-54fa856064ff",
      "https://www.youtube.com/@omochairo",
      "https://room.rakuten.co.jp/omochairo/items",
      "https://suzuri.jp/omochairo",
      "https://store.line.me/stickershop/author/5800729/ja",
      "https://ko-fi.com/omochairo",
      "https://peing.net/ja/omochairo",
      "https://marshmallow-qa.com/m0103ay8xfqm9ue",
      "https://dic.nicovideo.jp/u/444102",
      "https://x.com/omochairo",
      "https://www.instagram.com/omochairo",
      "https://www.facebook.com/p/-61572511841648/",
      "https://bsky.app/profile/omochairo.bsky.social",
      "https://jp.pinterest.com/omochairo/",
    ]

  # Issue #1263 ⑤: 著者プロフィール (E-E-A-T)。extend_head.html の Person/Organization
  # JSON-LD で worksFor / jobTitle / description に展開する。
  [params.authorProfile]
    organizationName = "おもちゃいろ運営局（元ソニー技術者×医療従事者）"
    organizationLogo = "https://omcha.jp/wp-content/uploads/2025/09/image-52.png"
    organizationUrl  = "https://omcha.jp"
    founderName      = "IroPapa & IroMama"
    founderJobTitle  = "元ソニー技術者 × 医療従事者"
    description      = "20〜40代ファミリーの『失敗しない知育玩具選び』をサポートする、元ソニー技術者と医療従事者の夫婦運営メディア。"

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    # Issue #1263 ③/⑥: PWA / Android スプラッシュと統一する dark UI 色
    theme_color = "#2e2e33"
    msapplication_TileColor = "#2e2e33"
    disableFingerprinting = false

  # 検索機能
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# Markdown表示設定
[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

# タクソノミー (デフォルトの tags/categories に brands を追加)
[taxonomies]
  tag = "tags"
  category = "categories"
  brand = "brands"

# 出力フォーマット（検索用JSON）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ナビゲーションメニュー
[menu]
  [[menu.main]]
    name = "🏠 ホーム"
    url = "./"
    weight = 1
  [[menu.main]]
    name = "🧸 おもちゃ診断"
    url = "diagnosis/"
    weight = 2
  [[menu.main]]
    name = "🔥 楽天ランキング"
    url = "ranking/"
    weight = 3
  [[menu.main]]
    name = "💎 コスパ最強"
    url = "cospa/"
    weight = 4
  [[menu.main]]
    name = "🏷️ おトク特集"
    url = "deals/"
    weight = 5
  [[menu.main]]
    name = "🏢 メーカー別"
    url = "brands/"
    weight = 6
  [[menu.main]]
    name = "🔍 検索"
    url = "search/"
    weight = 7
  [[menu.main]]
    name = "📚 記事一覧"
    url = "posts/"
    weight = 8
