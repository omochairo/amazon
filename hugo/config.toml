baseURL = 'https://navi.omcha.jp/'
languageCode = 'ja-JP'
# Issue #1297 follow-up: PaperMod baseof.html は {{ site.Language }} (= Lang) を
# <html lang="..."> に注入する。languageCode は RSS 専用なので defaultContentLanguage
# を明示しないと Lang が "en" デフォルトに落ち、全ページが <html lang=en> + hreflang=en
# として配信される (Google 言語認識・Screen reader・翻訳機能に悪影響)。
# Issue #5084: 上記コメントは不正確 — PaperMod の templates/opengraph.html は
# og:locale にも `replace (site.Language.LanguageCode) "-" "_"` の結果をそのまま使う。
# RSS/og:locale とも大文字小文字が意味を持つ (xx_XX 形式) ので 'ja-JP' と大文字国コードで
# 書く。小文字のままだと og:locale が仕様外の "ja_jp" になる。
defaultContentLanguage = "ja"
title = 'おもちゃいろ 比較ナビ｜知育玩具スコア＆最安値チェッカー'
theme = 'PaperMod'
contentDir = 'content'
canonifyURLs = false
relativeURLs = false

# Issue #1263 ①: robots.txt を Hugo が自動生成 (sitemap 位置を含む)
enableRobotsTXT = true

# Issue #1263 ②: 価格・記事が日次更新される動的サイトのため changefreq=daily を明示
[sitemap]
  changefreq = 'daily'
  filename   = 'sitemap.xml'
  priority   = 0.5

[pagination]
  # Issue #5343: クロールバジェット集中。pagerSize は「1ページあたりの重さ」と
  # 「page/N URL の枚数」のトレードオフで、URL 枚数は記事数 / pagerSize に比例する。
  # 10 のとき、クロール到達可能な noindex URL 897 本のうち 839 本 (94%) が
  # page/N だった (実測)。24 にすると 839 -> 299 本 (-64%)。
  # 併せて、一覧 1 ページ目から直接リンクされる商品が 10 -> 24 件に増えるので、
  # 深い位置の商品への内部リンクも太くなる (page/N を消すのではなく減らす理由)。
  # 代償は一覧ページの HTML が 98KB -> 150KB (実測、gzip 前。カード 1 枚 3.7KB)。
  # 画像は lazy-load なので LCP には乗らない。CWV が悪化するようならまずここを戻す。
  pagerSize = 24

[params]
  env = "production"
  # #5343 follow-up: term 一覧 (/tags/<t>/ /brands/<b>/) の掲載件数の上限。
  # pagerSize と対で効く運用ノブなので隣に置いてある。24 x 10 ページ ぶん。
  # pagerSize が全ページに一律に効くのに対し、こちらは「記事数の多い term だけが
  # noindex な page/N の長い尾を引く」のを潰す。実測 (2026-08-17) では到達 noindex
  # 284 本が全てページネーションで、tags 168 のうち 123 本が「知育玩具」(全記事の
  # 77.7%) と「プレゼント」(64.9%) の 2 タグ由来だった。
  # 240 は「brands を 1 本も削らない」値。最大の takara-tomy が 8 ページなので、
  # ブランドハブは全カタログを従来どおり出したまま tags の尾だけが切れる。
  # 下げるほど page/N は減るが、term ページから直接リンクされる商品も減る。
  # 0 を入れると上限なし (従来の挙動) に戻る。詳細は _default/term.html のコメント。
  termListMaxItems = 240
  # SEO: 一覧ページ用の <title> サイト名サフィックス短縮版 (#5083 項目1 の続き)。
  # 商品ページ用の productTitleSuffix ("比較ナビ") とは別に、ブランド名を残したい
  # ハブ/一覧ページ向けの中間の長さ。front matter に title_suffix_short: true を
  # 置いたページだけが使う (head.html)。オプトイン方式なので、#5083 で「フルネーム
  # 維持」と決めた一覧ページ群の挙動はフラグを立てない限り変わらない。
  # schema_json.html / OGP の site.Title は変更しない (ブランド表記の一貫性)。
  brandShort = "おもちゃいろ比較ナビ"
  # #3055 E4-B: Cloudflare Web Analytics (RUM) のサイトトークン。
  # CF ダッシュボード > Web Analytics でトークン発行後にコメントを外す。
  # 未設定の間は extend_head.html がビーコンを一切出力しない。
  cloudflareWebAnalyticsToken = "47dacb58fdef45b49a677dbf77a98790"
  # #5087: Amazon アフィリエイト・トラッキング ID の SSOT (Hugo テンプレ側)。
  # ranking.html / mobile_sticky_cta.html はここを参照する (直書き禁止)。
  # Python 側の SSOT は AMAZON_PARTNER_TAG secret (scripts/fetch_amazon.py 参照)。
  amazonPartnerTag = "chk01-22"
  description = "知育玩具をスコアと価格で比較。Amazon・楽天・Yahoo!の3サイト価格を横断。元ソニーエンジニア×医療従事者のおもちゃいろのパパママが、20〜40代ファミリーの『今いちばんお得な買い方』を毎日更新します。"
  author = "おもちゃロボ 🤖"
  # Global OGP image for social previews (Issue #605)
  images = ["og-image.jpg"]
  defaultTheme = "auto"
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = true
  disableSpecial1stPost = false
  hidemeta = false
  comments = false
  # 見出し末尾に表示される # アンカーリンクを非表示
  disableAnchoredHeadings = true

  # Issue #5083 項目1: 商品ページ(記事ページ)の <title> サイト名サフィックス短縮版。
  # 日本語 SERP のタイトル表示は全角30〜35文字程度で切れ、フルサフィックス(31文字)は
  # 表示されずブランディングに寄与しない。商品ページ (hugo/layouts/partials/head.html
  # で .Section "posts" 判定) のみこちらを使う。トップ・一覧・タグ・ブランド等は
  # site.Title (フルネーム) のまま維持する。
  productTitleSuffix = "比較ナビ"

  # カスタムホームレイアウト用のヒーロー設定 (homeInfoParams は使わずに layouts/index.html で描画)
  [params.hero]
    Title = "おもちゃいろ 比較ナビ"
    Subtitle = "スコアで選ぶ・3サイトで比べる知育玩具比較ナビ"
    Lead = "元ソニーエンジニア × 医療従事者の夫婦が運営する [おもちゃいろ](https://omcha.jp/) のパパママが、AI と一緒に毎日更新。20〜40代ファミリーの『失敗しない知育玩具選び』をサポートします。"

  [[params.socialIcons]]
    name = "globe"
    url = "https://omcha.jp/"
    title = "おもちゃいろ公式ブログ"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/omochairo"
    title = "GitHub"

  [params.cover]
    linkFullImages = true
    responsiveImages = true

  [params.label]
    text = "おもちゃいろ 比較ナビ"

  # Issue #1263 ⑤: E-E-A-T 強化 — PaperMod 標準 schema_json.html が IsHome で出力する
  # Organization JSON-LD の publisherType / sameAs / image を明示。
  # sameAs は omcha.jp 本家 JSON-LD と統一 (ブランド整合)。
  [params.schema]
    publisherType = "Organization"
    sameAs = [
      "https://omcha.jp/",
      "https://home.omcha.jp",
      "https://lit.link/omochairo",
      "https://linktr.ee/omochairo",
      "https://bio.site/omochairo",
      "https://potofu.me/omochairo",
      "https://gravatar.com/omochairo",
      "https://about.me/omochairo",
      "https://omochairo.github.io",
      "https://github.com/omochairo",
      "https://omocha.gitlab.io",
      "https://qiita.com/omochairo",
      "https://zenn.dev/omochairo",
      "https://medium.com/@omochairo",
      "https://omocha.pages.dev",
      "https://omocha.netlify.app",
      "https://omochairo.vercel.app",
      "https://omochairo.web.app",
      "https://www.npmjs.com/package/omochairo-config",
      "https://omochairo.connpass.com/",
      "https://omochairo.peatix.com",
      "https://www.producthunt.com/@omochairo",
      "https://sites.google.com/view/omocha",
      "https://www.behance.net/omochairo",
      "https://www.figma.com/@omocha",
      "https://note.com/omchairo",
      "https://speakerdeck.com/omochairo",
      "https://www.docswell.com/user/omochairo",
      "https://podcasts.apple.com/us/podcast/id1859409617",
      "https://open.spotify.com/show/2BSSc6QJwHYUKebyj3dE32",
      "https://music.amazon.co.jp/podcasts/f3f1e848-e4db-489e-bcdf-54fa856064ff",
      "https://www.youtube.com/@omochairo",
      "https://room.rakuten.co.jp/omochairo/items",
      "https://suzuri.jp/omochairo",
      "https://store.line.me/stickershop/author/5800729/ja",
      "https://ko-fi.com/omochairo",
      "https://peing.net/ja/omochairo",
      "https://marshmallow-qa.com/m0103ay8xfqm9ue",
      "https://dic.nicovideo.jp/u/444102",
      "https://x.com/omochairo",
      "https://www.instagram.com/omochairo",
      "https://www.facebook.com/p/-61572511841648/",
      "https://bsky.app/profile/omochairo.bsky.social",
      "https://jp.pinterest.com/omochairo/",
    ]

  # Issue #1263 ⑤: 著者プロフィール (E-E-A-T)。extend_head.html の Person/Organization
  # JSON-LD で worksFor / jobTitle / description に展開する。
  [params.authorProfile]
    organizationName = "おもちゃいろ運営局（元ソニー技術者×医療従事者）"
    organizationLogo = "https://omcha.jp/wp-content/uploads/2025/09/image-52.png"
    organizationUrl  = "https://omcha.jp"
    # Legacy single-founder fields (#1263 で導入)。複数 founder 化後も互換のため残置。
    # extend_head.html は新規の founders 配列があれば優先採用する。
    founderName      = "IroPapa & IroMama"
    founderJobTitle  = "元ソニー技術者 × 医療従事者"
    description      = "20〜40代ファミリーの『失敗しない知育玩具選び』をサポートする、元ソニー技術者と医療従事者の夫婦運営メディア。"
    # Issue #1301 B4: founder を 2 人の Person に分割。/author/<slug>/ ページに対応する
    # Person JSON-LD と @id で連携 (Hugo .Params がキーを小文字化するため key は小文字)。
    founders = [
      { name = "いろパパ", jobtitle = "元ソニー IT エンジニア / おもちゃ研究家", url = "/author/iropapa/", image = "https://omcha.jp/wp-content/uploads/2025/04/c22cd52e63323cfe98c0cb54c211d308.jpg" },
      { name = "いろママ", jobtitle = "栄養士 / 臨床検査技師", url = "/author/iromama/", image = "https://omcha.jp/wp-content/uploads/2025/04/a5b0c622e23a862ce050186e940695a1.jpg" },
    ]

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    # Issue #1263 ③/⑥: PWA / Android スプラッシュと統一する dark UI 色
    theme_color = "#2e2e33"
    msapplication_TileColor = "#2e2e33"
    disableFingerprinting = false

  # 検索機能
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    # #3055 follow-up: threshold 0.4 / minMatchCharLength 0 は緩すぎ、意味のない文字列
    # (例「テストテス」) が content 全文のあいまい一致で 23 件ヒットしていた。
    # 実データ 1478 件で検証: 0.3 + 2 文字下限にするとゴミ一致は 0 件、正当な
    # クエリ (レゴ/くもん/トミカ 等) はトップ結果を維持したまま弱い一致だけ除去。
    threshold = 0.3
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

# Markdown表示設定
[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

# タクソノミー (デフォルトの tags/categories に brands を追加)
[taxonomies]
  tag = "tags"
  category = "categories"
  brand = "brands"

# 出力フォーマット（検索用JSON）
[outputs]
  home = ["HTML", "RSS", "JSON", "SearchIndex"]

# #3055 E1: index.json (44.6MB) を軽量カタログと検索専用 /search.json に分離するための
# custom output format。fastsearch/diagnosis はこちらを fetch する
[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search"
    isPlainText = true
    notAlternative = true

