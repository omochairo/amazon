# data/brand_taxonomy.yaml
# ブランド正規化マスター (Phase 1, toy.md 統合版)
#
# tier:
#   S = 国内最大手 + 国際トップ          (スコア寄与最大)
#   A = 国内中堅 + 海外有名               (高)
#   B = 国内小ブランド + 海外特定ジャンル (中)
#   C = 地方問屋 / 特定卸 / 100均系 (ST有) (中低)
#   D = ノーブランド / 中華新興 / 不明     (低)
#
# exclude_from_taxonomy: true なら Hugo /brands/ ページから除外
# safety_default: 通常付与される安全認証
# region: 製造元主拠点 (ISO 国コード or 地域)
#
# 編集ルール:
#   - canonical はユーザー検索で表示される正式名 (Hugo /brands/<canonical>/)
#   - aliases に括弧形 (例: "タカラトミー(TAKARA TOMY)") を含めること
#   - 表記ゆれは aliases に足すだけで正規化される
#   - データソース: toy.md (200+ JP/海外ブランド) + 既存記事の中華系/暫定 C

