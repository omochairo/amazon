  # parenting — 育児の悩み・知識。商品が主役でない (記事型)
  # ------------------------------------------------------------------
  parenting:
    label: 育児の悩み・知識 (非商品)
    # 注意: 「後悔」「いつまで」「知恵袋」「体に悪い」のような**修飾語**をここに
    # 置いてはいけない。トピックではなく検索意図のサフィックスなので、語彙に無い
    # 商品名 (例「エンジェルサウンズ 後悔」= 胎児心音計、「ネオママイズム いつまで」
    # = 育児用品) を parenting に誤分類し、**未知商品が可視化されなくなる**。
    # 修飾語を外すと未知は unclassified に落ちる。それが正しい (未知を pass に
    # 潰さない)。2026-08-10 に実データで踏んで削除した。
