# ====================================================================
# excluded_keywords — 需要はあるが Amazon に商品が無く、記事化しても
# 商品ページにならないもの。理由を必ず書く (握り潰さないため)。
# ====================================================================
excluded_keywords:
  - keyword: メロジョイ
    aliases: [メロンジョイ, メロン ジョイ, mellojoy, ソフミ メロジョイ]
    reason: >-
      Amazon で販売されていない (owner 確認 2026-08-10)。WP 需要は約 110,000 imp と
      最大クラスタだが、navi の記事型は Amazon 商品ページなので受け皿が無い。
      需要クエリ側にも「メロジョイ 偽物」「メルカリ」が並んでおり流通が Amazon 外。
      SearchItems に投げても 0 件で API 呼び出しを捨てるだけなので事前に除外する。
  - keyword: おもちゃのバンバン
    aliases: [おもちゃのbanban, おもちゃ屋バンバン, バンバン おもちゃ屋, ハローマック バンバン, おもちゃのバンバン 高槻]
    reason: >-
      実店舗の玩具店の店名 (WP 需要 約 11,400 imp)。検索意図は店舗の場所・営業状況で
      あって商品ではないため、Amazon の商品ページでは受けられない。
  - keyword: おもちゃ屋さんの倉庫
    aliases: [おもちゃ屋さんの倉庫オンライン]
    reason: >-
      実店舗チェーンの店名 (WP 需要 約 1,900 imp)。上と同じ理由で商品ページにならない。
