# data/demand_topic_terms.yaml
#
# 需要クエリのトピック分類語彙 (#2686 / #3332 N2)。
# scripts/classify_demand_topics.py が読む。
#
# 目的:
#   omcha.jp (WP 本家) の GSC 実需要を navi (知育玩具メディア) が受けられるかで
#   仕分ける。「navi の対象範囲をどこまでにするか」は未決 (owner 判断待ち) なので、
#   本ファイルは**判断を下さず、判断に必要な件数と impressions を出すための分類**
#   に徹する。ラベルを付けること自体が方針決定にならないよう、bucket は
#   「navi のコアか / 隣接か / 明らかに違うか」の 3 段 + 未分類にしてある。
#
# 判定順序 (scripts 側で固定):
#   out_of_scope → toy → baby_goods → parenting → unclassified
#   toy を baby_goods より先に見るのは「赤ちゃん ハンドスピナー おすすめ」のように
#   両方の語を含むクエリを玩具側に倒すため (navi のコアは玩具)。
#   out_of_scope を最優先にするのは mbti 等が他語と同居しても対象外だから。
#
# 編集ルール:
#   - 語は部分一致 (正規化後の小文字・NFKC)。表記ゆれは並べて足す
#   - 1 語追加するたびに classify_demand_topics.py を回し、unclassified の
#     減り方と各 bucket の impressions の動きを確認すること
version: 1
updated: "2026-08-10"

