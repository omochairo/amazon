# ====================================================================
# search_modifiers — 需要クエリを Amazon SearchItems の検索語に変換するとき
# 落とす修飾語 (scripts/build_demand_keywords.py が読む)。
#
# 需要クエリは情報型 (「スクイーズ どこで買える」「トミカ 収納 100均」) で、
# そのまま SearchItems に投げても商品が返らない。商品の実体を指す語だけ残す。
#
# 注意: 商品カテゴリを表す語を入れないこと。「トミカ 収納」の「収納」は
# 収納ケースという実在の商品カテゴリなので残す (落とすとミニカー本体が返り、
# 検索意図と違う商品を拾う)。ここに入れてよいのは
# 「買い方・評判・出来事・販売店」を表す語だけ。
# ====================================================================
search_modifiers:
  # 買える場所・買い方
  - どこで買える
  - どこで 買える
  - どこに売ってる
