# data/demand_query_rules.yaml
#
# Ubersuggest CSV (競合おもちゃサイトの検索語エクスポート) の語彙ゲートルール
# (#2686 PR-C)。scripts/ingest_ubersuggest.py が読む。
#
# data/demand_topic_terms.yaml と同じ流儀でハードコードせず YAML に外出しする。
# 2 階層に分ける。混同しないこと:
#
#   subject_exclusions — 主題そのものが商品でない語。**語ごと落とす**
#     (例:「アンパンマン キャラクター一覧」→主題が図鑑・一覧記事であって
#     商品ではないので落とす)
#
#   trailing_modifiers — 主題は商品で、末尾の修飾語だけ非商品。**落とさず
#     末尾だけ剥いで残す**
#     (例:「ストライダー 後悔」→ストライダーは商品なので「後悔」だけ剥いで
#     「ストライダー」を残す)
#
# 「口コミ」は商品ページで受けられるので trailing_modifiers 側 (剥いで残す)。
# 「キャラクター一覧」は主題が商品でないので subject_exclusions 側 (剥いでも
# 意味がない、語ごと落とす)。
#
# マッチングモード (カテゴリごとに指定):
#   contains — 空白除去キーのどこかに部分一致すれば該当
#   suffix   — 空白除去キーの**末尾**に一致すれば該当
#
# L1 の誤りは非対称 (2026-08-10 owner レビューで確定): 誤除外 (本当は商品なのに
# subject_exclusions で落とす) は L2 実査で回復できない — 二度と候補に上がらず、
# しかも記録が dropped_subject に埋もれて気付けない。一方誤通過 (非商品を残す)
# は L2 実査 (Amazon SearchItems + genre_gate.py) で落とせる。したがって
# **subject_exclusions は保守的 (緩め) に倒す**。判断に迷う語・短い断片トークンで
# 無関係な語を巻き込みうる語は入れず、L2 に送る。
#
# 実例 (matched_terms 全件レビューで発覚、2026-08-10):
#   - 「図鑑」を character_list に入れていたら「アンパンマンことば図鑑プレミアム」
#     「英語ことば図鑑5000」という**実在商品**を誤除外していた。ずかん/図鑑は
#     navi の主力商品カテゴリ (data/demand_keywords.json の「はじめてずかん1000」
#     参照) なので token として置いてはいけない。
#   - facility の「ランド」「パーク」は断片トークンで、「ランドセルリメイク後悔」
#     「アクタスランドセル」(ランドセル=商品) や「ペーパークラフト作り方」
#     (ペー**パーク**ラフト) を誤爆させていた。施設は具体名 (レゴランド等) で
#     指定し、断片トークンを置かない。
#   - education_service の「幼稚園」「保育園」は「保育園 シール貼り」
#     「カレンダー保育園」のような玩具・知育商品の需要語を巻き込んでいた。
#     制度クエリ (「保育園無償化 ずるい」等) は L2 で落ちるので、ここでは削除する。
#
# 実測 (2026-08-10, ユニーク2,532語に対して。上記修正後):
#   subject_exclusions 合計: 約590語 / Volume 約1,696,260
#   trailing_modifiers 該当: 約64語 (剥いで残す)
#
# ----------------------------------------------------------------------------
# excluded_sites (#2686 PR-D, 2026-08-10 追加)
# ----------------------------------------------------------------------------
# owner が新たに9サイト分の CSV を投入し、サイト別の質を実測した結果、
# p-bandai.jp / bandai-hobby.net の2サイトを owner 判断で除外した。
#
# 実測 (2026-08-10):
#   | サイト | 語数 | おもちゃ関連率 | 店舗ナビ率 |
#   |---|---:|---:|---:|
#   | p-bandai.jp | 1,503 | 9% | 3% |
#   | bandai-hobby.net | 1,493 | 3% | 0% |
# 上位語は「鬼滅の刃」「仮面ライダー」「ガンプラ」「ガシャポン」「ジョジョ」
# 「ワンピースカード」「プラモデル」等の大人向けキャラクターグッズ・プラモデル
# であり、知育玩具メディア navi の対象外。しかも Volume が突出して大きいため、
# Volume 上位100語のうち64語をバンダイ系が占め、トイザらス/タカラトミーの
# 良質な語 (知育玩具・ベビー用品) を押し出す実害がある。
#
# 1つの語が複数サイトに出ることがある (例:「ガンプラ」は bandai-hobby と
# p-bandai の両方、「ベイブレードx」は takaratomymall と toysrus の両方)。
# **除外サイト由来の出典だけを落とし、採用サイトにも出ている語は残す**
# (ingest_ubersuggest.py 側で site 単位フィルタしてから重複排除する)。
# CSV ファイル自体は owner の資産なので削除しない。
# ============================================================================
excluded_sites:
  p-bandai.jp:
    reason: >-
      大人向けキャラクターグッズ・プラモデル中心 (おもちゃ関連率9%)。
      Volume上位100語中64語をバンダイ系 (p-bandai.jp + bandai-hobby.net) が
      占め、良質な語を押し出す実害があるため owner 判断で除外 (2026-08-10)。
  bandai-hobby.net:
    reason: >-
      大人向けキャラクターグッズ・プラモデル中心 (おもちゃ関連率3%)。
      Volume上位100語中64語をバンダイ系 (p-bandai.jp + bandai-hobby.net) が
      占め、良質な語を押し出す実害があるため owner 判断で除外 (2026-08-10)。

# ============================================================================
# subject_exclusions — 主題が商品でないので語ごと落とす
# ============================================================================
subject_exclusions:
  character_list:
    label: キャラ一覧・図鑑
    # 「図鑑」は 2026-08-10 に削除した。ずかん/図鑑は navi の主力商品カテゴリで
    # あり (data/demand_keywords.json の「はじめてずかん1000」参照)、
    # 「アンパンマンことば図鑑プレミアム」「英語ことば図鑑5000」という実在商品を
    # 誤除外していた。「ポケモン 図鑑番号」のような真の非商品情報クエリは
    # L2 実査で落とす (誤除外は回復不能・誤通過は L2 で回収可能という非対称性)。
    contains:
      - キャラクター
      - キャラ一覧
      - 一覧
      - 歴代
      - 名前の意味
      - 由来

  diy:
    label: 作り方・DIY
    contains:
      - 折り紙
      - おりがみ
      - 作り方
      - 手作り
      - 型紙
      - レシピ
      - ぬりえ
      - 塗り絵

  game_guide:
    label: 攻略・ゲーム
    contains:
      - 攻略
      - 裏技
      - チート
      - 進化図
      - 育て方
      - 遊び方
      - ルール

  free_content:
    label: 無料コンテンツ
    contains:
      - 無料
      - フリー
      - ダウンロード
      - 印刷
      - pdf
      - アプリ
      - サイト
      - 動画
      - youtube
      - タイピング

  facility:
    label: 施設・地名
    # 「ランド」「パーク」は断片トークンなので 2026-08-10 に削除した。
    # 「ランドセルリメイク後悔」「アクタスランドセル」(ランドセル=商品カテゴリ
    # そのもの) や「ペーパークラフト作り方」(ペー**パーク**ラフト) を誤爆させて
    # いた。施設は具体名で指定する (断片トークンを置かない)。
    contains:
      - ミュージアム
      - 美術館
      - 博物館
      - 水族館
      - 動物園
      - 公園
      - レゴランド
      - ディズニーランド
      - キッザニア
      - テーマパーク
      - アンパンマンパーク
      - としまえん
      - ベビーパーク
      - イベント
      - チケット
      - 営業
      - 駐車場
      - アクセス
      # #2686 PR-D (2026-08-10) 追加。ボーネルンド由来の屋内遊び場・公園クエリ。
      # いずれも具体施設名 (断片トークンではない) なので保守的原則に反しない。
      - デンパーク
      - 泉南ロングパーク
      - ペップキッズこおりやま
      - ペップキッズ郡山
      - 川口ハイウェイオアシス
      - 南港atc
      - ひみっこぱーく
      - シリウス大和
      - あがりーな
      # 「砂場」「パルクール」は追加しなかった (2026-08-10 検討・実データ確認済)。
      # 「砂場」は実データに「アンパンマン 砂場 セット」「アンパンマン砂場
      # セット」という実在商品があり、facility に入れると図鑑/ランドセルと
      # 同種の誤除外になる (誤除外は L2 で回復不能)。「パルクール」は実データ
      # では「パルクール教室」「パルクール公園」「パルクール東京」のみで
      # 商品語の共起は確認できなかったが、パルクール遊具という実在商品カテゴリ
      # が存在しうるため、確証が無い状態で断定的に落とすリスクを避け、
      # どちらも L2 実査 (Amazon SearchItems + genre_gate) の判断に送る。

  education_service:
    label: 教育役務
    # 「幼稚園」「保育園」は 2026-08-10 に削除した。「保育園 シール貼り」
    # 「カレンダー保育園」のような玩具・知育商品の需要語を巻き込んでいた。
    # 「保育園無償化 ずるい」のような制度クエリは L2 実査で落とす。
    contains:
      - 教室
      - 通信教育
      - 習い事
      - 小学校
      - 受験
      - 検定

  definition:
    label: とは系定義
    suffix:
      - とは
      - 意味

  store_navigational:
    label: 店舗ナビゲーショナル
    # #2686 PR-D (2026-08-10) 追加。トイザらス由来の32% (462語) がこれに当たる。
    # 実データ (data/demand/ubersuggest/) に出ている語を根拠に列挙した (981語が
    # 該当・詳細は PR 本文参照)。サイト名/店舗運営語で、店舗の存在を求める
    # クエリであり商品ページでは受けられない (「トイザらス クーポン」
    # 「ボーネルンド 店舗」「トイザらス営業時間」等)。
    #
    # L1 は保守的に倒す原則 (#4892) を守り、実データで断片トークンの誤爆が
    # 無いことを確認済み (「ランド」が「ランドセル」を誤爆した前例があるため)。
    # ここに列挙した語はいずれも短い断片ではなくサイト名・運営用語そのもの
    # (「トイザらス」「ログイン」「送料」等) であり、実データ981件の誤爆
    # (「ランドセル」「ペーパークラフト」型) は確認されなかった。
    contains:
      - トイザらス
      - トイザラス
      - toysrus
      - タカラトミーモール
      - takaratomymall
      - ボーネルンド
      - bornelund
      - 公式通販
      - 公式サイト
      - 公式ショップ
      - オンラインショップ
      - 店舗一覧
      - 営業時間
      - チラシ
      - クーポン
      - 福袋
      - マイページ
      - ログイン
      - 送料
      - 返品
      - 問い合わせ

# ============================================================================
# trailing_modifiers — 末尾の修飾語だけ剥いで主題語を残す (落とさない)
# ============================================================================
trailing_modifiers:
  reputation:
    label: 評判
    suffix:
      - 口コミ
      - 評判
      - レビュー
      - 感想

  price:
    label: 価格
    suffix:
      - 値段
      - 価格
      - 安い
      - セール
      - 最安

  channel:
    label: 販路
    suffix:
      - どこで買える
      - どこに売ってる
      - 売ってる
      - 店舗
      - 中古
      - メルカリ
      - 再販
      - 予約
      - 抽選
      - 定価

  concern:
    label: 懸念
    suffix:
      - 後悔
      - 危険
      - 事故
      - うざい
      - いらない

# ============================================================================
# suspect_volume_threshold — この値以上の Volume は Ubersuggest 側のノイズの
# 疑いがあるとしてフラグを立てる (落とさない)。実測「知育 村」が該当 (1件)。
# ============================================================================
suspect_volume_threshold: 500000
