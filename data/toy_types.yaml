    keywords: [英語, えいご, 外国語, ひらがな, 文字・ことば, 時計, 算数, すうじ, 数字, かずあそび, 九九, 漢字, アルファベット, ドリル, 学習ポスター, インタラクティブチャート, フラッシュカード, そろばん, 地球儀, 知育タブレット, 学習タブレット]

  - key: action
