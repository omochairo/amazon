    keywords: [ぬいぐるみ, フィギュア, 人形, ソフビ, ドール, シルバニア, リカちゃん, トランスフォーマー, プラモデル, ガンダム, ゾイド]

  - key: craft
    label: お絵かき・工作
    keywords: [工作, お絵かき, おえかき, クレヨン, 粘土, ねんど, 手芸, ビーズ, スライム, 塗り絵, ぬりえ, メイキング, シール, ステッカー, スケッチブック, 折り紙, おりがみ]

  - key: music
