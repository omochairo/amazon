# data/toy_types.yaml — おもちゃの「種類」の判定ルール (navi-brain#165 T2)
#
# 関連のおすすめ (🆚 似た商品 / 💴 同じ価格帯 / 🌱 半年〜1年後 / 📚 関連) で、
# 種類が違う商品 (パズルの記事にブラスター等) を出さないために使う。読み手は
# scripts/toy_type.py だけ。
#
# hugo/data/category_taxonomy.yaml (カテゴリのドロップダウン) とは別にしている。
# あちらはタグ名の完全一致で「メニューに出すグループ」を決めるもので、グループを
# 足すとメニューが変わる。こちらは部分一致のキーワードで商品を分ける。
#
# 判定の順番 (scripts/toy_type.py の classify):
#   1. Amazon のカテゴリ名 (data/raw/per_asin/<ASIN>/amazon.json の browse_nodes)
#   2. 記事のタグ
#   3. 商品名
#   最初に種類が 1 つでも見つかった段で決める (後の段は見ない)。
#   1 つの商品に複数の種類が付いてよい (例: ブロック + 乗り物)。
#   どの段でも見つからなければ「種類不明」(空)。
#
# キーワードは小文字にしてから部分一致で見る。広すぎる語 (「学習」「ロボット」
# 「ボール」「メイク」「組み立て」「タブレット」) は、全カテゴリ名の頻度を見て
# 誤爆したので入れていない (例: 「ロボット・ソフビ人形」が科学に、
# 「ベビー用ボール」が外遊びに、「メイキングトイ」がごっこ遊びに、
# 「タブレット用アクセサリ」が学習になる)。

version: 1

# この語を含むカテゴリ名は見ない (売り場・特集・テスト用で、商品の種類を表さない)
ignore_node_substrings:
  - "_2column"
  - "test"
  - "nav_"
  - "特集"
  - "フェア"
  - "クーポン"
  - "new year"
  - "入稿"
  - "cml_"
  - "deals"
  - "_deal"
  - "セール"
  - "バーゲン"
  - "ギフト"
  - "在庫あり"
  - "global"
  - "大賞"
  - "ストア"
  - "amazon"
  - "まとめ買い"
  - "実質無料"
  - "おすすめ"
  - "_9999"
  # 「STEM Toys ~理系脳を育むおもちゃ~」は Amazon の企画売り場で、英語のポスター等にも
  # 付いている (無作為 60 件の確認で誤判定)。科学・プログラミングは個別のカテゴリ名で見る
  - "理系脳"

# 名前全体がこれに一致するカテゴリ名は見ない (上位の大分類で、複数の種類にまたがる)
ignore_node_names:
  - "ブロック・パズル・ゲーム"
  - "アクション・スポーツトイ"

types:
  - key: puzzle
    label: パズル
    keywords: [パズル, ジグソー, はめこみ, 型はめ, 形合わせ, かたはめ, タングラム]

  - key: blocks
    label: ブロック・積み木
    keywords: [ブロック, 積み木, 積木, つみき, レゴ, lego, デュプロ, duplo, laq, ラキュー, マグフォーマー, マグ・フォーマー, ナノブロック]

  - key: vehicles
    label: 乗り物
    keywords: [ミニカー, トミカ, ミニ四駆, スロットカー, プラレール, 電車, 乗り物, のりもの, レースカー, ラジコン, 新幹線, はたらくくるま, 働く車, ダイキャスト, 車両, トラック, 木製レール, レールセット]

  - key: games
    label: ボードゲーム・カードゲーム
    keywords: [ボードゲーム, カードゲーム, アナログゲーム, パーティーゲーム, バランスゲーム, テーブルゲーム, すごろく, かるた, トランプ]

  - key: pretend
    label: ごっこ遊び
    keywords: [ままごと, ごっこ, おみせ, お店屋さん, キッチン, メイクアップ, お世話, お医者さん, 大工さん, なりきり, 変身]

  - key: figures
