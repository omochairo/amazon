# brand_official.yaml — #7958 (#7955 B) たまごっちアダプタの系列対応表
#
# scripts/fetch_official_howto.py のたまごっちアダプタは、商品名にここへ登録した
# キーワードが**部分一致で含まれるとき**だけ、対応する公式あそびかたページの URL を
# 記録する。対応表に無い商品名は記録しない (推測 URL を書かない、#7958 の規律)。
#
# url は fetch 時に毎回 200 を確認してから official_howto.json に書く。ここに
# url を書いただけでは何も起きない (投機的に系列を足しても安全)。
#
# なぜ「バンダイ (JAN)」アダプタと別枠にしたか:
#   たまごっちの商品名には「バンダイ(BANDAI)」ブランドタグが付くため、素直に
#   ブランドだけで振り分けると toy.bandai.co.jp/manuals/ (取扱説明書 PDF) に
#   送られてしまうが、たまごっちパラダイス (JAN 4582770018806) は実際に
#   0 件で返る (2026-09-21 実測)。あそびかたは tamagotchi-official.com 側の
#   専用ページにしかない。系列キーワード一致をバンダイ判定より先に見る。

tamagotchi:
  series:
    # たまごっちパラダイス
    - keywords:
        - "たまごっちパラダイス"
        - "Tamagotchi Paradise"
        - "Tama gotchi Paradise"
      url: "https://tamagotchi-official.com/jp/series/paradise/howto/"
