# data/cluster_plan.yaml — まとめの予定表 (navi-brain#218 C1)
#
# これから作るまとめページ (時期のページ・特集) ごとに、載せたい商品の個別記事を先に揃えるための表。
#   - 01-fetch-products の Amazon 検索に、ここの search を毎回数語入れる (fetch_amazon.py --cluster-slots・レーン "cluster")
#   - 記事を書くレーンは、match に当たる商品を先に選ぶ (candidate_priority.py の cluster 点・article_pick.py の 1 回の上限)
# 読み方は scripts/cluster_plan.py の docstring。
#
# 書き方の約束
#   - match / exclude は商品名とタグ (候補ではブランドも) に当てる正規表現。足す前に、今の記事に当てて
#     関係ない商品が混ざらないかを数える (家族で遊べるゲームでは「すごろく」が版元「すごろくや」に当たった)
#   - 当たる記事が target_articles に届いたら、検索の枠は使わない (点は付け続ける)
#   - publish_by は公開の目標日。120 日以内に入ると点が 1 上がり、検索の枠を先に使う
#   - 作り終えて記事を足す必要が無くなったら until を書くか、行を消す
#   - 検索語は Amazon の Toys の検索で商品が返る語にする (「室内遊び」のような遊び方の語は避ける)

clusters:
  - key: indoor-play-equipment
    label: 体を動かす室内遊具
    publish_by: 2027-05-01
    match: "滑り台|すべり台|スベリ台|トランポリン|ジャングルジム|ボールプール|室内ブランコ|ブランコ|室内遊具|鉄棒|ボルダリング|バランスストーン"
    exclude: "(?i)シルバニア|ドール|人形|フィギュア|ミニチュア|トミカ|プラレール|レール|ビー玉|ピタゴラ|コロコロ|スロープ|gravitrax|グラヴィトラックス"
    search: [室内 滑り台 子供, 子供 トランポリン 室内, ジャングルジム 室内, ボールプール 子供, 室内ブランコ 子供, 室内 鉄棒 子供, バランスストーン 子供]
    target_articles: 20

  - key: water-play
    label: 外の水遊び
    publish_by: 2027-05-15
    match: "プール|水鉄砲|ウォーターガン|水遊び|シャボン玉|スプリンクラー|噴水"
    exclude: "ボールプール|お風呂|おふろ|バス|浴室|おえかき|お絵かき|ペン"
    search: [水遊び おもちゃ, 水鉄砲 子供, ビニールプール 子供, 家庭用プール, シャボン玉 おもちゃ, スプリンクラー 子供]
    target_articles: 15

  - key: craft-science-kits
    label: 工作・実験キット
    publish_by: 2027-06-15
    match: "工作キット|工作セット|実験キット|実験セット|自由研究|科学キット|顕微鏡|電子工作|鉱物|化石|望遠鏡"
    exclude: "カードゲーム|竹ひご|檜棒"
    search: [工作キット 小学生, 実験キット 子供, 自由研究 キット, 顕微鏡 子供, 電子工作 キット 子供, 化石 発掘 キット]
    target_articles: 40

  # 公開日は未定 (K 11-27: 知育玩具の範囲に入れてよいが、記事を増やしてから)
  - key: outdoor-play
    label: 外遊び (乗り物・砂場)
    match: "三輪車|キックボード|ストライダー|バランスバイク|キックバイク|自転車|砂場|砂遊び|フリスビー|縄跳び|なわとび"
    exclude: "(?i)トミカ|ミニカー|プラモ|フィギュア|ミニチュア|シルバニア|人形|ドール|レゴ|lego|マウント|専用スタンド"
    search: [三輪車 子供, キックボード 子供, バランスバイク, 砂場セット 子供, 砂遊び おもちゃ, 子供 なわとび]
    target_articles: 30
