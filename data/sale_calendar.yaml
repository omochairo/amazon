# 毎年ほぼ同じ時期に来るセールの「目安の時期」(#9449)。
#
# これは告知には使わない。使い道は scripts/sale_calendar_reminder.py
# (毎日の 59-sale-calendar-reminder.yml) が立てる「日程を公式で確認して
# hugo/data/sale_events.yaml に登録する」issue だけ。issue が立つのは 2 通り:
#   - 公式・報道のフィードに開催の発表が出たとき (題名から読んだ日程の候補つき)
#   - 発表を拾えないまま、ここに書いた目安の時期が近づいたとき (保険。毎年のセールだけ)
# ここに無いセールも、題名がセールの発表らしければ「adhoc-<開始日>」として拾う。
# 繰り返し来るものはここに足すと、issue の題名と id がそのセールの名前になる。
# サイトに出る日程の SSOT は hugo/data/sale_events.yaml のまま。
#
# 書き方:
#   - id は英小文字・数字・ハイフン。hugo/data/sale_events.yaml に登録するときの
#     イベント id は「<この id>-<開始年>」にする (例: prime-kanshasai-2026)。
#     リマインドはこの id の有無で「登録済みか」を判定する
#   - cycle: monthly は毎月のように来るセール (スマイルSALE)。目安の日が決まらない
#     ので typical_start / remind_days_before は書かず、発表を拾ったときだけ知らせる。
#     イベント id は「<この id>-<開始年>-<開始月 2 桁>」(例: smile-sale-2026-11)
#   - typical_start は例年の開始日の目安 ("MM-DD"。必ずクォートする)。
#     年によって 2 週間ほど前後するので、例年のうち早い方に寄せて書く
#   - remind_days_before は typical_start の何日前から issue を立てるか。
#     公式の発表より前に立てても確認できないので、発表の時期に合わせる
#     (プライムデー・プライム感謝祭は開催の 3〜4 週間前、初売りと
#     ブラックフライデーは 1〜2 週間前に発表される)
#   - 発表の題名では、セール名を「」の中身の完全一致で探す (先頭の "Amazon" と
#     空白は無視)。name と違う名前で発表された年があれば announce_names に足す。
#     部分一致にしないのは、「Amazon プライムデー フェス」のような日付の違う
#     関連の発表を取り違えないため
#   - ここに書く時期は過去の開催時期からの目安で、公式に確認した日程ではない。
#     実際の日程は毎回、公式の告知で確認する
#   - shop は amazon (省略時) / rakuten / yahoo。楽天・Yahoo の発表は名前を決め打ちせずに
#     拾う (navi-brain#206) が、ここにあるセールと名前が合えば id が「<この id>-<年>」になり、
#     目安のリマインドと同じ issue にまとまる。別の id で登録済みでも (62 の自動登録の
#     rakuten-supersale-2026-12-04 など)、同じモール・目安の時期・名前が合えば登録済みとみなす
#   - 62 がページから自動登録するセール (楽天スーパーSALE など) は、remind_days_before を
#     自動登録が済むはずの時期より後 (開始の 1 日前など) にする。先に立てると毎回 issue が立つ
#   - pre_sale: true は例年、本番の前に先行セールがあるセール。本番だけが自動登録されたら、
#     先行セールの有無を確かめる issue を 1 件立てる
#   - url は issue に載せる公式のキャンペーンページ (楽天・Yahoo)。https:// で始める
#
# 検証: scripts/tests/test_sale_calendar_reminder.py
- id: hatsuuri
  name: Amazon 初売り
  typical_start: "01-03"
  remind_days_before: 7
  note: 例年 1 月上旬。発表は 12 月 27 日ごろ
- id: shinseikatsu
  name: Amazon 新生活セール
  announce_names:
    - Amazon スマイルSALE 新生活
  typical_start: "02-28"
  remind_days_before: 21
  note: 例年 2 月末〜3 月上旬
- id: prime-day
  name: Amazon プライムデー
  typical_start: "07-08"
  remind_days_before: 21
  pre_sale: true
  note: 例年 7 月中旬。先行セールが数日前から始まる
- id: prime-kanshasai
  name: Amazon プライム感謝祭
  typical_start: "10-04"
  remind_days_before: 21
  pre_sale: true
  note: 例年 10 月上旬〜中旬。先行セールが数日前から始まる
- id: black-friday
  name: Amazon ブラックフライデー
  typical_start: "11-21"
  remind_days_before: 7
  pre_sale: true
  note: 例年 11 月下旬〜12 月上旬。先行セールが数日前から始まる。発表は 11 月中旬
- id: smile-sale
  name: Amazon スマイルSALE
  cycle: monthly
  note: ほぼ毎月 1 週間ほど。公式のフィードには発表が出ず、報道 (PHILE WEB) とサイト上の告知だけ
