name: Invoke Jules for Article
on:
  workflow_run:
    workflows: ["Jules Publish Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      asin:
        description: "Force a specific ASIN (overrides random pool selection). Caller must have already deleted any existing data/articles/*-<ASIN>.json before dispatching."
        required: false
        default: ""

# 2026-05-17 Step C-1: 1 run = 1 ASIN から 1 run = 最大 8 ASIN へ並列化。
# - concurrency: invoke-jules は外す (jules-lock/<ASIN> branch が atomic 排他を担う)
# - check-open-prs ガードも外す (open PR でも別 ASIN なら lock 取得時点で衝突しない)
# - pick-asin は 8 件 lock 取れるまで loop、後続 step は bash for-loop で 8 ASIN 分回す
# Step C-2 (lock branch) と組み合わせて inter-run race を防ぎつつスループット 8x を狙う。

jobs:
  invoke-jules:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      # 2026-05-15: B 段階対策。事故 PR #185-189 は Jules が `amazon.json` の items[0]
      # (= B0DT15VQF8) を毎回選んでいたことが原因。workflow 側で候補を計算し
      # (articles 既存 + open PR 内 ASIN を除外)、ランダムに 1 件選んで prompt に明示する。
      - name: Pick next ASIN
        id: pick-asin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ASIN: ${{ github.event.inputs.asin }}
        run: |
          set -e
          REPO=${{ github.repository }}
          # 2026-05-31 (#1198): Jules daily PR cap。02-publish → invoke-jules → 8 PR
          # の自己増殖ループで 2026-05-31 に Jules quota を 800 session 級まで溢れた。
          # 当日 google-labs-jules[bot] が起票した PR 数を gh search で取得し、
          # 上限超なら count=0 で early return (downstream は count != '0' gate で skip)。
          # workflow_dispatch (手動 override) は cap を bypass — 緊急時の人手 dispatch を残す。
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DAILY_CAP=30
            TODAY=$(date -u +%Y-%m-%d)
            JULES_PR_TODAY=$(gh pr list -R "$REPO" --state all \
              --search "author:app/google-labs-jules created:$TODAY" \
              --json number --jq 'length' 2>/dev/null || echo 0)
            echo "Jules PRs today: $JULES_PR_TODAY / cap $DAILY_CAP"
            if [ "$JULES_PR_TODAY" -ge "$DAILY_CAP" ]; then
              echo "Daily Jules PR cap reached; skipping pick + downstream."
              echo "count=0" >> "$GITHUB_OUTPUT"
              echo "asins=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          gh pr list --repo $REPO --state open --json title \
            --jq '.[].title' > /tmp/open_titles.txt || echo "" > /tmp/open_titles.txt
          # 既存 lock ブランチ (jules-lock/<ASIN>) を exclusion に追加。
          # 2026-05-17 Step C-2: inter-run race (前 run の Jules セッションが PR 出す前に
          # 次 run が同 ASIN を picking) を防ぐ。lock ブランチは ref 作成が atomic (422 on conflict)。
          gh api "repos/$REPO/git/matching-refs/heads/jules-lock/" \
            --jq '.[] | .ref | sub("refs/heads/jules-lock/"; "")' > /tmp/locked.txt 2>/dev/null || echo "" > /tmp/locked.txt
          python3 - <<'PY'
          import json, re, glob, os, random
          input_asin = os.environ.get('INPUT_ASIN', '').strip()
          _ASIN_RE = re.compile(r'^B0[A-Z0-9]{8}$')
          if input_asin:
              # 2026-05-18: workflow_dispatch.inputs.asin で個別 ASIN を強制指定するケース。
              # ランダム pool 選定をバイパスし、指定 ASIN 1 件のみを shuffled.txt に書く。
              # existing-article / open-PR の除外も skip (再生成用途を想定し、呼び出し側で削除済み前提)。
              # lock 取得は通常ロジックを通すので、既に lock があれば失敗する (atomic 保証は維持)。
              if not _ASIN_RE.match(input_asin):
                  raise SystemExit(f"INPUT_ASIN '{input_asin}' does not match B0[A-Z0-9]{{8}}")
              print(f"Using forced ASIN from workflow_dispatch input: {input_asin}")
              with open('/tmp/shuffled.txt', 'w') as f:
                  f.write(input_asin + '\n')
          else:
              with open('data/raw/amazon.json', encoding='utf-8') as f:
                  raw = json.load(f)
              items = raw.get('items', [])
              # 2026-05-17: candidates は B0[A-Z0-9]{8} 形式 (Amazon 標準 ASIN) のみに絞る。
              # PR #279 で書籍/JAN 形式 ASIN (例 4910762175) が pick されてしまい、
              # 06-jules-lock-cleanup.yml の release-on-merge regex (B0...) にも一致せず
              # lock が schedule TTL まで残る事故が発生した。
              candidates = [
                  i['asin'] for i in items
                  if isinstance(i, dict) and isinstance(i.get('asin'), str)
                  and _ASIN_RE.match(i['asin'])
              ]
              existing = set()
              for path in glob.glob('data/articles/*.json'):
                  base = os.path.basename(path)
                  if base.endswith('.enrichment.json') or base.endswith('.quality.json'):
                      continue
                  m = re.search(r'(B0[A-Z0-9]{8})', base)
                  if m:
                      existing.add(m.group(1))
              for fname in ('/tmp/open_titles.txt', '/tmp/locked.txt'):
                  try:
                      with open(fname, encoding='utf-8') as f:
                          for line in f:
                              for m in re.finditer(r'(B0[A-Z0-9]{8})', line):
                                  existing.add(m.group(1))
                  except FileNotFoundError:
                      pass
              # #810 Phase 1.5: ranking_pool.json = 楽天ランキング由来・未記事化 ASIN の
              # 永続プール (13-ranking-sniper が main にコミット)。keyword × top100 の
              # 構造的上限の外にある売れ筋を記事化するため、keyword 候補に union する。
              # 件数が少なく高価値なので **先頭** に置き (shuffle せず)、毎日数枠ある
              # Jules pick で確実に消化されるようにする。記事化されると existing 除外で消える。
              ranking_pool = []
              try:
                  with open('data/raw/ranking_pool.json', encoding='utf-8') as f:
                      rp = json.load(f)
                  ranking_pool = [
                      a for a in rp.get('asins', [])
                      if isinstance(a, str) and _ASIN_RE.match(a)
                  ]
              except FileNotFoundError:
                  pass
              ranking_set = set(ranking_pool)
              remaining_ranking = [a for a in ranking_pool if a not in existing]
              remaining_kw = [a for a in candidates if a not in existing and a not in ranking_set]
              # GITHUB_RUN_ID で seed してシャッフル。bash 側で 1 件ずつ lock 試行 → 取得成功した時点で確定。
              # ranking 内も shuffle: 生成に失敗し続ける ASIN が毎回 slot 1 を占有して
              # keyword pool を枯渇させる pathological loop を避ける (ranking 優先は維持)。
              rng = random.Random(os.environ.get('GITHUB_RUN_ID', ''))
              rng.shuffle(remaining_ranking)
              rng.shuffle(remaining_kw)
              remaining = remaining_ranking + remaining_kw
              # #1600 Phase 1: 第三者情報量が「fetch 済みで真ゼロ」(band=="zero",
              # = Bajoy/Joyreal 級の D-tier 無素材品) の ASIN を pick から defer する。
              # Jules が google_search 任せで水増し記事 (#1599 sources floor 割れ) を
              # 生成し AWAITING_USER_FEEDBACK で concurrent 枠を占有する (#1353) のを入口で断つ。
              # 安全弁: 全候補が zero でも枯渇させない (kept 空なら defer 無効化)。
              import sys as _sys
              _sys.path.insert(0, 'scripts')
              try:
                  import score_per_asin_info as _sc
                  kept, deferred = [], []
                  for a in remaining:
                      if _sc.score_asin(a).get('band') == 'zero':
                          deferred.append(a)
                      else:
                          kept.append(a)
                  if deferred:
                      print(f"info-zero deferred (#1600): {len(deferred)} "
                            f"e.g. {deferred[:10]}")
                  if kept:
                      remaining = kept
                  elif deferred:
                      print("::warning::all candidates band=zero; "
                            "proceeding without defer to avoid pool starvation")
              except Exception as _e:  # スコア計算失敗は pick を止めない (best-effort)
                  print(f"::warning::info scoring skipped, no defer applied: {_e}")
              print(f"candidates={len(candidates)} ranking_pool={len(ranking_pool)} "
                    f"existing_excluded={len(existing)} ranking_first={len(remaining_ranking)} "
                    f"remaining={len(remaining)}")
              with open('/tmp/shuffled.txt', 'w') as f:
                  for a in remaining:
                      f.write(a + '\n')
          PY
          # lock ブランチ用の empty commit を作る (committer.date を TTL 判定に利用)
          # 2026-05-17 Step C-1: MAX_LOCKS まで lock を取得し、picked.txt に列挙する。
          # 2026-06-01 Issue #967: supply 黒字確認 (remaining=71 >> 8 基準) 後 8 → 12 に拡張
          # (12-rewrite-idle-fill.yml も同値で揃える)
          MAX_LOCKS=12
          MAIN_SHA=$(gh api repos/$REPO/git/refs/heads/main --jq .object.sha)
          MAIN_TREE=$(gh api repos/$REPO/git/commits/$MAIN_SHA --jq .tree.sha)
          : > /tmp/picked.txt
          ACQUIRED=0
          while IFS= read -r asin; do
            [ -z "$asin" ] && continue
            [ "$ACQUIRED" -ge "$MAX_LOCKS" ] && break
            TS=$(date -u +%FT%TZ)
            COMMIT=$(jq -n --arg msg "jules-lock $asin" --arg tree "$MAIN_TREE" --arg parent "$MAIN_SHA" --arg ts "$TS" \
              '{message: $msg, tree: $tree, parents: [$parent], author: {name: "github-actions", email: "actions@github.com", date: $ts}, committer: {name: "github-actions", email: "actions@github.com", date: $ts}}' | \
              gh api -X POST "repos/$REPO/git/commits" --input - --jq .sha 2>/dev/null)
            [ -z "$COMMIT" ] && continue
            if gh api -X POST "repos/$REPO/git/refs" \
                -f ref="refs/heads/jules-lock/$asin" -f sha="$COMMIT" >/dev/null 2>&1; then
              echo "Lock acquired: jules-lock/$asin"
              echo "$asin" >> /tmp/picked.txt
              ACQUIRED=$((ACQUIRED + 1))
            else
              echo "Lock contention on $asin, trying next"
            fi
          done < /tmp/shuffled.txt
          echo "Locks acquired: $ACQUIRED / target $MAX_LOCKS"
          if [ "$ACQUIRED" -eq 0 ]; then
            echo "::warning::No candidate ASINs available (all excluded/locked)"
            echo "count=0" >> $GITHUB_OUTPUT
            echo "asins=" >> $GITHUB_OUTPUT
          else
            ASINS_CSV=$(paste -sd, /tmp/picked.txt)
            echo "count=$ACQUIRED" >> $GITHUB_OUTPUT
            echo "asins=$ASINS_CSV" >> $GITHUB_OUTPUT
            echo "chosen=$ASINS_CSV"
          fi

      # Step 1: ソースを確認 (全 ASIN で共通の source_name)
      - name: List Jules Sources
        if: steps.pick-asin.outputs.count != '0'
        id: list-sources
        run: |
          echo "=== Listing Jules Sources ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            'https://jules.googleapis.com/v1alpha/sources' \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP: $HTTP_CODE"
          echo "$BODY" | head -20
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to list sources (HTTP $HTTP_CODE)"
            exit 1
          fi
          # 2026-05-13: ハイフン形式は NOT_FOUND と判明したのでスラッシュ形式に戻す
          # (List API が返す .name フィールドをそのまま使うのが正解)
          SOURCE_NAME=$(echo "$BODY" | jq -r '.sources[] | select(.githubRepo.owner=="omochairo" and .githubRepo.repo=="amazon") | .name' 2>/dev/null || echo "")
          if [ -z "$SOURCE_NAME" ]; then
            echo "::warning::Source not found, using default"
            SOURCE_NAME="sources/github/omochairo/amazon"
          fi
          echo "source_name=$SOURCE_NAME" >> $GITHUB_OUTPUT
          echo "Source: $SOURCE_NAME"

      # Step 2: セッション作成 (picked.txt の全 ASIN 分ループ)
      - name: Create Jules Sessions
        id: create-sessions
        if: steps.pick-asin.outputs.count != '0'
        env:
          ASINS_CSV: ${{ steps.pick-asin.outputs.asins }}
          SOURCE_NAME: ${{ steps.list-sources.outputs.source_name }}
        run: |
          # 2026-05-17: Jules が date/slug を未来日付でハルシネートする事故
          # (filename 2026-05-25, 実生成 5/14 ≒ +11日先 等 / posts/2026-05-25-b0fx3qbqbf)
          # への対策として、本日 (Asia/Tokyo) を明示的に注入する。
          # Hugo サイトは JST 表示なので date フィールドも +09:00 で揃える。
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_ISO=${TODAY}T10:00:00+09:00
          : > /tmp/session_ids.txt
          OK=0
          FAIL=0
          IFS=',' read -ra ASIN_ARR <<< "$ASINS_CSV"
          for TARGET_ASIN in "${ASIN_ARR[@]}"; do
            [ -z "$TARGET_ASIN" ] && continue
            echo "=== Creating Jules Session (target: $TARGET_ASIN, today: $TODAY) ==="
            # #1600 Phase 1: per_asin の第三者情報量を測り、薄い品では「水増し禁止・
            # 正直優先」を prompt に動的注記する。素材が乏しい ASIN ほど Jules が
            # google_search で出典の弱い記述を盛りがち (#1599) なので、字数より誠実さを
            # 優先させる。quality_gate の floor 自体は変えない (合格基準は不変)。
            INFO_JSON=$(python3 scripts/score_per_asin_info.py "$TARGET_ASIN" 2>/dev/null || echo '{}')
            INFO_BAND=$(echo "$INFO_JSON" | jq -r '.band // "unknown"')
            INFO_NEWS=$(echo "$INFO_JSON" | jq -r '.news_sources // 0')
            INFO_YT=$(echo "$INFO_JSON" | jq -r '.youtube // 0')
            INFO_BK=$(echo "$INFO_JSON" | jq -r '.books // 0')
            echo "info: band=$INFO_BAND news_sources=$INFO_NEWS youtube=$INFO_YT books=$INFO_BK"
            if [ "$INFO_BAND" = "ok" ]; then
              INFO_NOTE="【事前収集ソースの量】: 十分 (媒体${INFO_NEWS} / 動画${INFO_YT} / 書籍${INFO_BK})。per_asin 配下の一次ソースを優先して根拠を固めてください。"
            else
              INFO_NOTE="【事前収集ソースの量】: 乏しい (媒体${INFO_NEWS} / 動画${INFO_YT} / 書籍${INFO_BK})。この商品は第三者情報が少ない品です。
            - 確認できない仕様・効果・受賞歴・口コミを創作して字数を埋めること (水増し) を**禁止**します。検索で裏取りできない記述は書かないでください。
            - 出典の弱い一般論で分量を稼ぐより、確認できた事実だけで簡潔にまとめる方を優先してください (本文 minLength は安全網であって目標値ではありません)。
            - sources には実在し検証可能な URL のみ記載。検索エンジンの結果ページ URL は出典にしないでください。"
            fi
            # 2026-05-13: 12行のハードコードプロンプトを廃止し、jules/PROMPT_TEMPLATE.md
            # を読み込む形に変更（記事品質向上のため出典・競合比較・cross-check ルールを
            # フルプロンプトとして渡す）。
            # 2026-05-15: 対象 ASIN を workflow 側で事前選定して prompt に明示注入する形に変更
            # （事故 PR #185-189 = 全 5 件 B0DT15VQF8 の再発防止）。
            # ※ FAILED_PRECONDITION が再発した場合は memory:
            # feedback_jules_api_failed_precondition.md を参照し、まず API キー再発行を試す。
            INTRO="AGENTS.md を最初に必ず読み、その指示に厳密に従ってください。
            以下は STAGE 1 (記事JSON生成) の詳細プロンプトです。出典・競合比較・cross-check のルールを必ず守ってください。

            【今回生成する記事の対象 ASIN】: ${TARGET_ASIN}
            このセッションで生成する記事は必ずこの ASIN を対象としてください。他の ASIN は選ばないでください。

            ${INFO_NOTE}

            【本日の日付 (必ず使用)】: ${TODAY}
            - 出力ファイル名: data/articles/${TODAY}-${TARGET_ASIN}.json
            - slug フィールド: \"${TODAY}-${TARGET_ASIN}\"
            - date フィールド: \"${TODAY_ISO}\"
            PROMPT_TEMPLATE.md のスキーマ例にある日付 (2026-05-12 等) はあくまで例示なので絶対に流用しないでください。未来日付・過去日付の生成は禁止です。

            絶対守るリポジトリ保護ルール:
            - 新規ファイル追加のみ。既存ファイルの変更・削除は禁止
            - .github/, scripts/, hugo/ への変更は禁止
            - data/articles/ フォルダへの JSON 追加のみ許可（命名: ${TODAY}-${TARGET_ASIN}.json 固定）
            - **最終 PR の差分は data/articles/${TODAY}-${TARGET_ASIN}.json の追加 1 ファイルのみ**。
              ワークスペース内で fix_*.py / tmp_*.py / debug_*.py / scratch_*.json などの一時スクリプト・
              中間ファイルを作って JSON を整形するのは構わないが、それらは **必ず最終コミット前に削除し PR に含めないこと**。
              article JSON 以外がコミットされていると 05-jules-auto-merge の scope ガードが eligible=false にして
              auto-merge を停止する（PR #301 の事故事例）。
            - data/raw/amazon.json から対象 ASIN (${TARGET_ASIN}) のエントリを読み込んで記事を生成。
              **amazon.json に該当 ASIN が無い場合** (= 楽天ランキング由来の新規 ASIN, #810 Phase 1.5)
              は data/raw/per_asin/${TARGET_ASIN}/amazon.json の \`item\` フィールドを商品データとして使う
              (title / price / features / image / availability 等は同じ形)
            - 楽天/Yahoo の価格・URL は **必ず data/raw/rakuten_matched.json および data/raw/yahoo_matched.json** から
              matched_asin == \"${TARGET_ASIN}\" のエントリを参照し、product.prices.rakuten / product.prices.yahoo に
              { price, url } を埋め込む。マッチが無ければ price=0 / url=\"\" / is_search=true で良い。
              data/raw/rakuten.json と data/raw/yahoo_result.json はキーワード検索結果でありASIN単位のマッチではないため
              価格欄には**使わない**こと (sources の補助情報としては可)。
            - data/raw/youtube.json および data/raw/per_asin/${TARGET_ASIN}/ 配下の補助データも活用する
            - data/raw/per_asin/${TARGET_ASIN}/third_party_sources.json が存在する場合 (#1600 Phase 2 で
              事前収集した非販売の第三者候補 URL = レビュー/解説/メディア) は、sources 候補として優先的に
              内容を確認すること。ただし候補に過ぎないので、実際に内容を読んで記述の裏取りに使えた URL のみを
              article の sources に採用する (販売ページ・検索結果ページは出典に含めない)

            === 以下、jules/PROMPT_TEMPLATE.md の内容 ==="
            PROMPT="$INTRO

            $(cat jules/PROMPT_TEMPLATE.md)"

            REQUEST_BODY=$(jq -n \
              --arg prompt "$PROMPT" \
              --arg source "$SOURCE_NAME" \
              '{
                prompt: $prompt,
                sourceContext: {
                  source: $source,
                  githubRepoContext: {
                    startingBranch: "main"
                  }
                },
                automationMode: "AUTO_CREATE_PR",
                title: "記事生成: 商品深掘りガイド"
              }')

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              'https://jules.googleapis.com/v1alpha/sessions' \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
              -d "$REQUEST_BODY")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              # エラー時はステータス/メッセージを必ず出す (FAILED_PRECONDITION=#1353 concurrent 枠枯渇/APIキー失効
              # vs INVALID_ARGUMENT=payload 不正 を運用者が区別できるように)
              ERR_STATUS=$(echo "$BODY" | jq -r '.error.status // empty' 2>/dev/null)
              echo "$BODY" | jq -r '.error.status // .error.message // .' 2>/dev/null || echo "$BODY" | head -c 800
              echo "::warning::Failed to create session for $TARGET_ASIN (HTTP $HTTP_CODE ${ERR_STATUS})"
              # FAILED_PRECONDITION が出たら memory: feedback_jules_api_failed_precondition.md
              # 参照 → 最優先で API キーを再発行 (jules.google.com → Settings → API keys)
              FAIL=$((FAIL + 1))
              # #1353: FAILED_PRECONDITION / RESOURCE_EXHAUSTED / 429 は Jules 枠枯渇
              # (rolling 24h: daily 100 / concurrent 15) か API キー失効で、いずれも ASIN 個別
              # ではなく *グローバル* な条件。残り ASIN を試しても同じ理由で全部 400/429 になり、
              # 無駄な session 作成試行で時間を浪費するだけなので、ここでループを打ち切る
              # (INVALID_ARGUMENT 等の payload 系は個別要因なので continue のまま据え置く)。
              if [ "$ERR_STATUS" = "FAILED_PRECONDITION" ] || [ "$ERR_STATUS" = "RESOURCE_EXHAUSTED" ] || [ "$HTTP_CODE" = "429" ]; then
                echo "::warning::Jules quota/precondition 枠枯渇 ($ERR_STATUS) — 残り ASIN の session 作成をスキップ (#1353)"
                break
              fi
              continue
            fi
            echo "$BODY" | jq -c '{name, id, status}' 2>/dev/null || echo "$BODY" | head -c 500
            SESSION_ID=$(echo "$BODY" | jq -r '.id // empty')
            if [ -z "$SESSION_ID" ]; then
              echo "::warning::No session id returned for $TARGET_ASIN"
              FAIL=$((FAIL + 1))
              continue
            fi
            echo "${TARGET_ASIN}:${SESSION_ID}" >> /tmp/session_ids.txt
            OK=$((OK + 1))
            echo "Session created: $TARGET_ASIN -> $SESSION_ID"
          done
          echo "Sessions: OK=$OK FAIL=$FAIL"
          echo "count_ok=$OK" >> $GITHUB_OUTPUT
          echo "count_fail=$FAIL" >> $GITHUB_OUTPUT
          if [ "$OK" -eq 0 ]; then
            echo "::error::No Jules sessions were created"
            exit 1
          fi

      # Step 3: セッション状態確認 (全 session を順次 poll、最大5分の smoke test)
      # AUTO_CREATE_PR は非同期で完了するため、ここでの完了待ちは目視/早期エラー検知用。
      - name: Wait for Jules completions
        if: steps.create-sessions.outputs.count_ok != '0'
        run: |
          declare -a LINES
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            LINES+=("$line")
          done < /tmp/session_ids.txt
          TOTAL=${#LINES[@]}
          echo "=== Monitoring $TOTAL sessions ==="
          for i in $(seq 1 10); do
            sleep 30
            DONE=0
            for line in "${LINES[@]}"; do
              ASIN="${line%%:*}"
              SESSION_ID="${line#*:}"
              RESPONSE=$(curl -s \
                "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" \
                -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}")
              STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')
              echo "[$i/10] $ASIN ($SESSION_ID): $STATUS"
              if [ "$STATUS" = "COMPLETED" ] || [ "$STATUS" = "FAILED" ]; then
                DONE=$((DONE + 1))
              fi
            done
            if [ "$DONE" -eq "$TOTAL" ]; then
              echo "All $TOTAL sessions reached terminal state"
              break
            fi
          done
          echo "Polling complete (best-effort; AUTO_CREATE_PR continues async)"
