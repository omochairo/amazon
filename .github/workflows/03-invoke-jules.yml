name: Invoke Jules for Article
on:
  workflow_run:
    workflows: ["Jules Publish Pipeline"]
    types: [completed]
  workflow_dispatch:

# 2026-05-13: 連鎖トリガー (Fetch → Publish → Invoke Jules → PR merge → Publish → ...)
# によって短時間に複数の Jules セッションが並列起動し、同じ ASIN を選んで
# 重複 PR (#111 / #112 = 共に B0FHVH6JML) を作る問題に対応。
# cancel-in-progress: false で先行ジョブを待つことで、Jules セッション作成が
# 直列化され、後続セッションは最新 main を読んで別 ASIN を選ぶ。
concurrency:
  group: invoke-jules
  cancel-in-progress: false

jobs:
  # 2026-05-15: Jules セッションの非同期性により workflow_run の concurrency だけでは
  # 重複 ASIN を防げない (5分待機 < 実際の PR 作成 12-50分)。事故例 PR #185-189
  # (全部 B0DT15VQF8) を踏まえ、open 記事 PR が 1 件でもあれば新規セッションを skip する。
  # B 段階 (workflow 側で ASIN 事前選定) の前段ガード。
  check-open-prs:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_invoke: ${{ steps.check.outputs.should_invoke }}
    steps:
      - name: Check for open Jules article PRs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Jules が生成した記事 PR は title に必ず ASIN (B0XXXXXXXX) を含む
          OPEN=$(gh pr list --repo ${{ github.repository }} --state open --json title \
            --jq '[.[] | select(.title | test("B0[A-Z0-9]{8}"; "i"))] | length')
          echo "Open Jules article PR(s): $OPEN"
          if [ "$OPEN" -eq 0 ]; then
            echo "should_invoke=true" >> $GITHUB_OUTPUT
          else
            echo "should_invoke=false" >> $GITHUB_OUTPUT
            echo "::warning::Skipping Jules invocation: $OPEN open article PR(s) exist — merge or close them first to prevent duplicate ASIN selection."
          fi

  invoke-jules:
    needs: check-open-prs
    if: needs.check-open-prs.outputs.should_invoke == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2026-05-15: B 段階対策。事故 PR #185-189 は Jules が `amazon.json` の items[0]
      # (= B0DT15VQF8) を毎回選んでいたことが原因。workflow 側で候補を計算し
      # (articles 既存 + open PR 内 ASIN を除外)、ランダムに 1 件選んで prompt に明示する。
      - name: Pick next ASIN
        id: pick-asin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh pr list --repo ${{ github.repository }} --state open --json title \
            --jq '.[].title' > /tmp/open_titles.txt || echo "" > /tmp/open_titles.txt
          python3 - <<'PY'
          import json, re, glob, os, random
          with open('data/raw/amazon.json', encoding='utf-8') as f:
              raw = json.load(f)
          items = raw.get('items', [])
          candidates = [i['asin'] for i in items if isinstance(i, dict) and i.get('asin')]
          existing = set()
          for path in glob.glob('data/articles/*.json'):
              base = os.path.basename(path)
              if base.endswith('.enrichment.json') or base.endswith('.quality.json'):
                  continue
              m = re.search(r'(B0[A-Z0-9]{8})', base)
              if m:
                  existing.add(m.group(1))
          with open('/tmp/open_titles.txt', encoding='utf-8') as f:
              for line in f:
                  for m in re.finditer(r'(B0[A-Z0-9]{8})', line):
                      existing.add(m.group(1))
          remaining = [a for a in candidates if a not in existing]
          print(f"candidates={len(candidates)} existing_excluded={len(existing)} remaining={len(remaining)}")
          out_path = os.environ['GITHUB_OUTPUT']
          if not remaining:
              with open(out_path, 'a') as f:
                  f.write("asin=\n")
              print("::warning::No candidate ASINs remain — fetch more products or wait")
          else:
              # GITHUB_RUN_ID で seed して並列 run が同じ ASIN を引かないようにする
              rng = random.Random(os.environ.get('GITHUB_RUN_ID', ''))
              chosen = rng.choice(remaining)
              print(f"chosen={chosen}")
              with open(out_path, 'a') as f:
                  f.write(f"asin={chosen}\n")
          PY

      # Step 1: ソースを確認
      - name: List Jules Sources
        if: steps.pick-asin.outputs.asin != ''
        id: list-sources
        run: |
          echo "=== Listing Jules Sources ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            'https://jules.googleapis.com/v1alpha/sources' \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP: $HTTP_CODE"
          echo "$BODY" | head -20
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to list sources (HTTP $HTTP_CODE)"
            exit 1
          fi
          # 2026-05-13: ハイフン形式は NOT_FOUND と判明したのでスラッシュ形式に戻す
          # (List API が返す .name フィールドをそのまま使うのが正解)
          SOURCE_NAME=$(echo "$BODY" | jq -r '.sources[] | select(.githubRepo.owner=="omochairo" and .githubRepo.repo=="amazon") | .name' 2>/dev/null || echo "")
          if [ -z "$SOURCE_NAME" ]; then
            echo "::warning::Source not found, using default"
            SOURCE_NAME="sources/github/omochairo/amazon"
          fi
          echo "source_name=$SOURCE_NAME" >> $GITHUB_OUTPUT
          echo "Source: $SOURCE_NAME"

      # Step 2: セッション作成
      - name: Create Jules Session
        id: create-session
        if: steps.pick-asin.outputs.asin != ''
        env:
          TARGET_ASIN: ${{ steps.pick-asin.outputs.asin }}
        run: |
          echo "=== Creating Jules Session (target: $TARGET_ASIN) ==="
          # 2026-05-13: 12行のハードコードプロンプトを廃止し、jules/PROMPT_TEMPLATE.md
          # を読み込む形に変更（記事品質向上のため出典・競合比較・cross-check ルールを
          # フルプロンプトとして渡す）。
          # 2026-05-15: 対象 ASIN を workflow 側で事前選定して prompt に明示注入する形に変更
          # （事故 PR #185-189 = 全 5 件 B0DT15VQF8 の再発防止）。
          # ※ FAILED_PRECONDITION が再発した場合は memory:
          # feedback_jules_api_failed_precondition.md を参照し、まず API キー再発行を試す。
          INTRO="AGENTS.md を最初に必ず読み、その指示に厳密に従ってください。
          以下は STAGE 1 (記事JSON生成) の詳細プロンプトです。出典・競合比較・cross-check のルールを必ず守ってください。

          【今回生成する記事の対象 ASIN】: ${TARGET_ASIN}
          このセッションで生成する記事は必ずこの ASIN を対象としてください。他の ASIN は選ばないでください。

          絶対守るリポジトリ保護ルール:
          - 新規ファイル追加のみ。既存ファイルの変更・削除は禁止
          - .github/, scripts/, hugo/ への変更は禁止
          - data/articles/ フォルダへの JSON 追加のみ許可（命名: YYYY-MM-DD-${TARGET_ASIN}.json）
          - data/raw/amazon.json から対象 ASIN (${TARGET_ASIN}) のエントリを読み込んで記事を生成
          - 楽天/Yahoo の価格・URL は **必ず data/raw/rakuten_matched.json および data/raw/yahoo_matched.json** から
            matched_asin == "${TARGET_ASIN}" のエントリを参照し、product.prices.rakuten / product.prices.yahoo に
            { price, url } を埋め込む。マッチが無ければ price=0 / url="" / is_search=true で良い。
            data/raw/rakuten.json と data/raw/yahoo_result.json はキーワード検索結果でありASIN単位のマッチではないため
            価格欄には**使わない**こと (sources の補助情報としては可)。
          - data/raw/youtube.json および data/raw/per_asin/${TARGET_ASIN}/ 配下の補助データも活用する

          === 以下、jules/PROMPT_TEMPLATE.md の内容 ==="
          PROMPT="$INTRO

          $(cat jules/PROMPT_TEMPLATE.md)"

          # payload を変数に保存 (失敗時のデバッグ用にログ表示)
          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "${{ steps.list-sources.outputs.source_name }}" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: {
                  startingBranch: "main"
                }
              },
              automationMode: "AUTO_CREATE_PR",
              title: "記事生成: 商品深掘りガイド"
            }')
          echo "=== Request Body (JSON sent to Jules) ==="
          echo "$REQUEST_BODY" | jq .
          echo "=== End Request Body ==="

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
            -d "$REQUEST_BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP: $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to create session (HTTP $HTTP_CODE)"
            # FAILED_PRECONDITION が出たら memory: feedback_jules_api_failed_precondition.md
            # 参照 → 最優先で API キーを再発行 (jules.google.com → Settings → API keys)
            echo "::error::HTTP 400 FAILED_PRECONDITION が出る場合は API キーを再発行してください"
            exit 1
          fi
          SESSION_ID=$(echo "$BODY" | jq -r '.id // empty')
          echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
          echo "Session created: $SESSION_ID"

      # Step 3: セッション状態確認（最大5分待機）
      - name: Wait for Jules completion
        if: steps.create-session.outputs.session_id != ''
        run: |
          SESSION_ID="${{ steps.create-session.outputs.session_id }}"
          echo "=== Monitoring Session: $SESSION_ID ==="
          for i in $(seq 1 10); do
            sleep 30
            RESPONSE=$(curl -s \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" \
              -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}")
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')
            echo "[$i/10] Status: $STATUS"
            if [ "$STATUS" = "COMPLETED" ] || [ "$STATUS" = "FAILED" ]; then
              echo "$RESPONSE" | jq '.outputs // empty' 2>/dev/null
              break
            fi
          done
          echo "Jules session monitoring complete"
