name: SNS Publish (Buffer X + Meta Graph Threads + Bluesky)
# Issue #1420 path A (session 86 で path α → path A に格上げ):
#   - Buffer: X 単発投稿 (`notify_buffer.py --x-only`)
#   - Meta Graph: Threads thread 2 投構成 (`notify_threads.py`)
#   - Bluesky: AT Protocol link card 投稿 (`notify_bluesky.py`、Issue #1598)。
#     secret (BLUESKY_HANDLE / BLUESKY_APP_PASSWORD) 未設定なら inert no-op。
# 配信成功後に published 履歴を main に PR + auto-merge で commit。
#
# X 公式 API 直叩きは pay-per-usage 単価 (URL 含み $0.20/req) でコスト合わず
# Buffer 経由を継続。Threads は Buffer の Threads channel が thread 非対応の
# ため Meta Graph 直叩きで thread 化。Buffer Threads channel は日常投稿
# (商品紹介以外) の手動運用で並走。
#
# cron 1 本 (#2780: 1 日 2 回から夜のゴールデンタイム 1 回に削減。
# Buffer キュー滞留の緩和は shareNow 化で構造的に解消済だが、配信頻度を
# 絞り 1 記事/日を確実に届ける運用に統一):
#   11:00 UTC = 20:00 JST          (夜のゴールデンタイム)
on:
  workflow_dispatch:
    inputs:
      asin:
        description: '強制投稿する ASIN (空なら最新未投稿を自動選択)'
        required: false
        type: string
      dry_run:
        description: 'draft 投入のみで queue に流さない'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 11 * * *'   # 20:00 JST (11:00 UTC) 夜のゴールデンタイム 1 記事/日

# GITHUB_TOKEN の権限を明記する (#5045)。このレーンの書き込み (branch push /
# PR 作成 / auto-merge) は actions/create-github-app-token の App token で
# 行っており、GITHUB_TOKEN は checkout が読むだけ。宣言が無いとリポジトリ既定に
# 引きずられ、既定が write なら不要な書き込み権限を持って走り、read-only に
# 締めれば黙って壊れる。どちらの向きにも動かないよう固定する。
permissions:
  contents: read
# 同じレーンの run を同時に走らせない (#5044)。
#
# 二重投稿の防止は published_at の bookkeeping に依存しているが、その
# bookkeeping は投稿の**あと**に commit -> PR -> auto-merge されて初めて main に
# 反映される。つまり「前の run の bookkeeping PR がまだマージされていない間に
# 次の run が始まる」と、同じ本文が再選定されて二重投稿になる (この窓は
# 30-sns-engagement.yml のコメントが元から書いていたもの)。#4782 は個別事象を
# 潰したが、CI 層の構造ガードが無いままだった。
#
# cancel-in-progress: false が必須。true にすると「投稿は済んだが bookkeeping
# 前」の run を殺すことになり、いちばん避けたい状態 (投稿されたのに
# published_at が付かない = 次スロットが再投稿する) を自分で作る。
concurrency:
  group: sns-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Issue #4765 の水平展開 (#4769 は engagement 側)。配信済み ASIN の書き戻し PR が
      # マージされないと main 上は未配信のままなので、次の cron が同じ記事リンクを
      # 再投稿する。X は shareNow で即時配信、かつ published は set 管理で痕跡が
      # 残らないため、起きても気づけない。選定前に open な sns-publish/* ブランチの
      # 配信済み ASIN を取り込んでおけば、PR がマージされなくても再投稿は起きない。
      - name: Absorb published ASINs from stale publish PRs
        id: absorb
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          STALE=$(gh pr list --state open --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sns-publish/")) | "\(.number) \(.headRefName)"')
          if [ -z "$STALE" ]; then
            echo "No stale sns-publish PRs."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Stale sns-publish PRs:"; echo "$STALE"
          mkdir -p /tmp/absorb
          NUMS=""
          ARGS=""
          while read -r num branch; do
            [ -n "$num" ] || continue
            git fetch --no-tags origin "$branch"
            out="/tmp/absorb/${num}-sns_published.json"
            if git show "FETCH_HEAD:data/sns_published.json" > "$out" 2>/dev/null; then
              ARGS="$ARGS --source $out"
            fi
            NUMS="$NUMS $num"
          done <<< "$STALE"
          python scripts/absorb_sns_published.py --target data/sns_published.json $ARGS
          echo "prs=$(echo $NUMS)" >> "$GITHUB_OUTPUT"

      - name: Pick target ASIN
        id: pick
        run: |
          set -e
          if [ -n "${{ inputs.asin }}" ]; then
            ASIN=$(echo "${{ inputs.asin }}" | tr '[:lower:]' '[:upper:]')
            echo "Manual ASIN override: $ASIN"
          else
            ASIN=$(python scripts/pick_sns_target.py) || {
              echo "::notice::No unpublished article available; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
            echo "Auto-picked ASIN: $ASIN"
          fi
          echo "asin=$ASIN" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Post to Buffer (X single post)
        id: post-x
        if: steps.pick.outputs.skip != 'true'
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          # #2780: shareNow 即時配信で Buffer の予約キュー (無料枠 10 件) を
          # 消費しない → LimitReachedError を構造的に回避 (root cause 側)。
          X_POST_MODE: now
        run: |
          set -e
          ASIN="${{ steps.pick.outputs.asin }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — Buffer draft 投入のみ"
            python scripts/notify_buffer.py "$ASIN" --x-only
          else
            python scripts/notify_buffer.py "$ASIN" --x-only --live
          fi
        # #2780: 万一 Buffer が失敗 (LimitReached 等) しても Threads/Bluesky の
        # 配信と published 履歴の commit を止めない (catch 側の防御)。
        # #4783: outcome は mark ステップに渡り channel_results に残る。他チャネルが
        # 成功していれば mark 進行 (再投稿しない)、全滅なら mark せず run を赤にする。
        continue-on-error: true

      - name: Post to Threads (Meta Graph API thread)
        id: post-threads
        if: steps.pick.outputs.skip != 'true'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          set -e
          ASIN="${{ steps.pick.outputs.asin }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — Threads preview のみ"
            python scripts/notify_threads.py "$ASIN" --dry-run
          else
            python scripts/notify_threads.py "$ASIN"
          fi
        # Threads が失敗しても X は既に投稿済みなので、bookkeeping は進める。
        # #4783: 失敗は channel_results に残る。全チャネル失敗のときだけ mark を
        # 止めて run を赤にする。
        continue-on-error: true

      - name: Post to Bluesky (AT Protocol link card)
        id: post-bluesky
        if: steps.pick.outputs.skip != 'true'
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          set -e
          ASIN="${{ steps.pick.outputs.asin }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — Bluesky preview のみ"
            python scripts/notify_bluesky.py "$ASIN" --dry-run
          else
            # secret 未設定なら notify_bluesky.py が exit 2 (inert no-op)。
            # X/Threads は既に投稿済みなので bookkeeping を止めない。
            python scripts/notify_bluesky.py "$ASIN"
          fi
        # Issue #1598: Bluesky は 3 つ目の補助チャネル。失敗 (secret 未設定の
        # inert 含む) でも X/Threads の配信と mark を止めない。
        # #4783: inert no-op (exit 2) も outcome=failure として記録される。X/Threads の
        # どちらかが成功していれば mark は進むので、運用上の影響はない。
        continue-on-error: true

      - name: Mark ASIN as published + commit via PR
        if: steps.pick.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          ASIN="${{ steps.pick.outputs.asin }}"

          # #4783: 3 つの投稿ステップは continue-on-error なので、全滅しても以前は
          # ここで無条件に mark していた = その ASIN が二度と選定されず SNS 露出が
          # 恒久ゼロになり、run は緑のままでデータにも痕跡が残らなかった。
          # outcome を渡し、1 つも success が無ければ mark させない (exit 2)。
          # state を触らないので次回 cron が同じ ASIN を再試行する。
          MARK_RC=0
          python scripts/pick_sns_target.py --mark "$ASIN" \
            --channel "x=${{ steps.post-x.outcome }}" \
            --channel "threads=${{ steps.post-threads.outcome }}" \
            --channel "bluesky=${{ steps.post-bluesky.outcome }}" || MARK_RC=$?
          if [ "$MARK_RC" -ne 0 ] && [ "$MARK_RC" -ne 2 ]; then
            exit "$MARK_RC"
          fi

          # MARK_RC=2 (全チャネル失敗) でも、absorb ステップが取り込んだ他 run 分の
          # 書き戻しは commit しておく (#4769 の自己修復を落とさない)。
          git add data/sns_published.json
          if git diff --cached --quiet; then
            echo "No change in sns_published.json; skipping commit."
            [ "$MARK_RC" -eq 0 ] || exit 1
            exit 0
          fi

          # MARK_RC=2 のとき差分は absorb 分だけで $ASIN は含まれない。
          # 「配信済みとして記録した」と読める題名を付けない (#4783)。
          if [ "$MARK_RC" -eq 0 ]; then
            SUBJECT="data: mark $ASIN as SNS-published"
            PR_BODY="Automated SNS publish bookkeeping. Buffer (X 単発) + Meta Graph (Threads thread) で \`$ASIN\` を配信し、\`data/sns_published.json\` に履歴追記した記録。#1420"
          else
            SUBJECT="data: absorb SNS-published history (delivery of $ASIN failed on all channels)"
            PR_BODY="全チャネル配信失敗のため \`$ASIN\` は published に記録していません (#4783)。この PR は滞留 PR から取り込んだ他 run 分の書き戻しのみです。\`$ASIN\` は次回 cron で再試行されます。"
          fi

          BRANCH="sns-publish/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "$SUBJECT (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "$SUBJECT" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi

          # 取り込み元の滞留 PR は、この PR が同じ ASIN 履歴を含んでいるので close する
          # (#4765)。放置すると stale-pr-sweeper (#4469) の滞留カウントが積み上がる。
          for n in ${{ steps.absorb.outputs.prs }}; do
            gh pr comment "$n" --body "Superseded by $PR_URL — この PR の配信済み ASIN は取り込み済みです (#4765)。" || true
            gh pr close "$n" --delete-branch || echo "::warning::Could not close stale PR #$n"
          done

          # 全チャネル失敗は run を赤くして気づけるようにする (#4783)。bookkeeping は
          # 上で済ませてあるので、ここで落としても取りこぼしは出ない。
          [ "$MARK_RC" -eq 0 ] || exit 1
