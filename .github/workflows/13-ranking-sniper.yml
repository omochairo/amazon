name: Rakuten Ranking Sniper Backfill
# Issue #810 Phase 1 — 楽天おもちゃランキングの未記事化 item を JAN 経由で
# 新規 Amazon ASIN に解決し (resolve_ranking_asins.py / 案A: Creator API
# searchItems + externalIds 照合)、fetch_amazon --competitors-only で per_asin に
# backfill する。keyword × top100 の構造的上限を突破する別経路の第一歩。
#
# dry_run=true で dispatch すると Option A の解決可否だけをログ確認し PR を作らない
# (creds がローカルに無いため、本番 secret で 1 JAN 解決を実機検証する用)。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve only, write no files / no PR (Option A verification)'
        type: boolean
        default: false
      limit:
        description: 'Max unmatched JANs to resolve this run (1 = single-JAN dry-run)'
        type: string
        default: '30'
  schedule:
    # #810 follow-up: 毎日 04:00 JST = 19:00 UTC。keyword×top100 saturation で
    # amazon.json の fresh 供給が枯れるため、楽天ランキング/サーチ由来の新規 ASIN
    # を日次で ranking_pool に積んで 03-invoke-jules の候補バッファを底上げする。
    - cron: '0 19 * * *'

jobs:
  ranking-sniper:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LIMIT: ${{ github.event.inputs.limit || '30' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch Rakuten Ranking + Search + Match to ASIN
        # #810 Phase 2: --search-pages 5 で Search プール (= ~150 件) を取得し、
        # ランキング 30 件の外の売れ筋 JAN も resolve の対象に供給する。
        run: python scripts/fetch_rakuten.py --out data/raw/ --search-pages 5
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Resolve unmatched ranking JANs → new ASINs (Option A)
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: |
          set -e
          # #810 Phase 2: --search-in で楽天 Search プール (rakuten.json) の JAN も mine する。
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: resolving up to $LIMIT JAN(s), no files written."
            python scripts/resolve_ranking_asins.py --limit "$LIMIT" --search-in data/raw/rakuten.json --dry-run
          else
            python scripts/resolve_ranking_asins.py --limit "$LIMIT" --search-in data/raw/rakuten.json
          fi

      - name: Sniper backfill resolved ASINs into per_asin
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: |
          set -e
          CSV_FILE="data/raw/ranking_sniper_asins.csv"
          ASINS=$(cat "$CSV_FILE" 2>/dev/null || true)
          if [ -z "$ASINS" ]; then
            echo "No resolved ASINs; nothing to backfill."
            exit 0
          fi
          echo "Sniper backfill (competitors-only) for: $ASINS"
          python scripts/fetch_amazon.py --asin "$ASINS" --competitors-only --out data/raw/

      - name: Rematch /ranking/ weekly.json with current per_asin + articles
        # Issue #1149: weekly.json は火曜 weekly cron でしか matched_asin が更新されない
        # ため、sniper backfill / Jules article publish で新しく追加された ASIN が
        # 「楽天ランキング → 自社レビュー」リンクに反映されるまで最大 7 日遅延する。
        # API を叩かず現行 per_asin + article インデックスで再マッチして即時反映する。
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -e
          python scripts/fetch_rakuten.py --rematch-only --out data/raw/ || true

      - name: Append ranking history snapshot
        # Issue #600 Phase A: rematch 済 weekly.json から matched_asin 付き item を
        # hugo/data/ranking/history.json に日次 append (90日 rotation)。チャート/
        # 「楽天N位」バッジ用の時系列ソース。日次 sniper cron に同梱して PR に乗せる。
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          set -e
          python scripts/append_ranking_history.py || true

      - name: Create backfill PR + enable auto-merge
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e

          # data/ は .gitignore 対象外。per_asin snapshot + manifest + csv + ranking_pool を stage。
          # ranking_pool.json は #810 Phase 1.5: 03-invoke-jules pick-asin が読む記事化候補プール。
          git add data/raw/per_asin data/raw/_ranking_resolved_manifest.json data/raw/ranking_sniper_asins.csv data/raw/ranking_pool.json || true

          # Issue #1149: rematch で更新された /ranking/ 用 weekly.json + manifest も同 PR で main 反映。
          # Issue #600: history.json も同 PR で日次更新 (90日 rotation, Chart.js / バッジ用)。
          # hugo/ は .gitignore 対象 → -f が必須 ([[hugo-gitignore-trap]] / [[hugo-output-cron-trio]])。
          git add -f hugo/data/ranking/weekly.json hugo/data/ranking/_match_manifest.json || true
          git add -f hugo/data/ranking/history.json || true
          git add data/raw/rakuten_ranking.json data/raw/_rakuten_ranking_manifest.json || true

          if git diff --cached --quiet; then
            echo "No backfill changes to commit; skipping PR creation."
            exit 0
          fi

          # 既存 open backfill PR があれば閉じる (重複防止)。
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ranking-sniper/")) | .number' | while read -r pr_num; do
            if [ -n "$pr_num" ]; then
              echo "Closing old PR #$pr_num and deleting branch..."
              gh pr close "$pr_num" -d || true
            fi
          done

          BRANCH="ranking-sniper/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data: ranking-sniper per_asin backfill (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data: ranking-sniper per_asin backfill (run ${{ github.run_id }})" \
            --body "Issue #810 Phase 1+1.5: resolved unmatched Rakuten-ranking JANs to new Amazon ASINs (Option A), backfilled data/raw/per_asin via fetch_amazon --competitors-only, and updated data/raw/ranking_pool.json (Phase 1.5 — 03-invoke-jules pick-asin unions this pool so ranking ASINs become articles). See _ranking_resolved_manifest.json for the resolved/unresolved breakdown." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        continue-on-error: true
