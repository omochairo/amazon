name: Wikidata Brand Meta Refresh

# #2093 (epic #1358 B-6 follow-up) — 月次で scripts/fetch_wikidata_brand_meta.py を回し、
# brand_hub.json の全ブランドについて Wikidata から構造化メタ (設立年/本社/公式サイト/
# ロゴ/創業者/国) を再取得して hugo/data/brand_wikidata.json を更新する。
#
# 設計:
# - 毎月 1 日 04:00 JST (= 前日 19:00 UTC)。設立年など静的値が主なので月次で十分。
#   主な更新源は brand_taxonomy 拡張で新規追加されたブランドの取り込み。
# - hugo/ は .gitignore 対象 → git add -f ([[hugo-output-cron-trio]])。
# - main 直 push は GH006 silent reject → PR + auto-merge で反映
#   ([[silent_push_reject_trap]] / 08-wiki-cache.yml と同パターン)。
# - PR は App token 起票 (GITHUB_TOKEN だと anti-recursion で発火しない / [[peter-evans-validate-trap]])。
# - 同名別業種の誤マッチは BRAND_OVERRIDES (script 内 curated) で恒久ガード。

on:
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    - cron: '0 19 1 * *'  # 毎月 1 日 19:00 UTC = 2 日 04:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikidata-brand-meta-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Refresh brand_wikidata.json
        run: python scripts/fetch_wikidata_brand_meta.py

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/wikidata-meta-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          # hugo/ は .gitignore 対象のため -f で強制 stage する。
          git add -f hugo/data/brand_wikidata.json
          if git diff --cached --quiet; then
            echo "No changes to brand_wikidata.json; skipping PR creation."
            exit 0
          fi
          git commit -m "data(brand): auto refresh brand_wikidata.json (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "data(brand): auto refresh brand_wikidata.json" \
            --body "Auto-generated by [38-wikidata-refresh.yml](.github/workflows/38-wikidata-refresh.yml) run ${{ github.run_id }}. Refs #2093." \
            --label todo
          gh pr merge "$BRANCH" --auto --squash
