name: Backfill Competitors per_asin

# fetch_amazon.py --competitors-only を回す専用 workflow。
# 既存記事 ASIN に per_asin/<ASIN>/competitors.json が無いと build_post.py の
# _override_competitive_analysis が走らず、Jules 出力 (= しばしば fabricated
# ASIN) が記事の「似た商品との比較」に残ってしまう。これを埋め戻すために、
# 任意の ASIN リストを sniper で取得し、現 amazon.json pool を競合候補に
# 統合した per_asin/<ASIN>/{snapshot.json,competitors.json} を生成する。
#
# 通常の 01-fetch-products.yml と違い amazon.json は上書きしないので、Jules の
# 通常パイプライン (cron 由来の新規 ASIN プール) には影響しない。

on:
  workflow_dispatch:
    inputs:
      asins:
        description: 'カンマ区切り ASIN (必須・最大 10 件 = PA-API GetItems 1 chunk)'
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Backfill per_asin competitors
        run: |
          python scripts/fetch_amazon.py \
            --asin "${{ github.event.inputs.asins }}" \
            --competitors-only \
            --out data/raw/
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}

      - name: Create PR with backfilled data
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): backfill per_asin competitors for ${{ github.event.inputs.asins }}"
          title: "chore(data): backfill per_asin competitors (${{ github.event.inputs.asins }})"
          body: |
            ## Summary
            Backfill of `data/raw/per_asin/<ASIN>/{snapshot.json,competitors.json}` for the ASINs below.

            **Triggered ASINs**: `${{ github.event.inputs.asins }}`

            ## Why
            `build_post.py::_override_competitive_analysis` replaces Jules-authored `competitive_analysis[]` with API-verified competitors only when `per_asin/<ASIN>/competitors.json` exists. Articles without this file fall back to Jules output (often paired with fabricated ASINs), which renders as text-only cards with no image / Amazon CTA. This PR closes that gap for the listed ASINs.

            ## Impact
            - Touches: `data/raw/per_asin/<ASIN>/` only (does NOT touch `amazon.json` or the live Jules pool)
            - 02-publish re-render will pick up new competitor data on next run
          branch: chore/backfill-competitors-${{ github.run_id }}
          base: main
          add-paths: |
            data/raw/per_asin/**
          delete-branch: true
