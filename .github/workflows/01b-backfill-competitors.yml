name: Backfill Competitors per_asin

# fetch_amazon.py --competitors-only を回す専用 workflow。
# 既存記事 ASIN に per_asin/<ASIN>/competitors.json が無いと build_post.py の
# _override_competitive_analysis が走らず、Jules 出力 (= しばしば fabricated
# ASIN) が記事の「似た商品との比較」に残ってしまう。これを埋め戻すために、
# 任意の ASIN リストを sniper で取得し、現 amazon.json pool を競合候補に
# 統合した per_asin/<ASIN>/{snapshot.json,competitors.json} を生成する。
#
# 通常の 01-fetch-products.yml と違い amazon.json は上書きしないので、Jules の
# 通常パイプライン (cron 由来の新規 ASIN プール) には影響しない。

on:
  workflow_dispatch:
    inputs:
      asins:
        description: 'カンマ区切り ASIN (all=false の時必須)。10 件超 OK (内部で 10 件ずつ chunk)。'
        required: false
        default: ''
      all:
        description: 'data/articles/ 配下の全 ASIN を対象に再生成。--asin より優先。1 dispatch で全件 backfill (PA-API: GetItems N/10 + SearchItems N、TPS=1)'
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 2026-05-19 (session 32): GitHub App token に切替。session 31 で peter-evans/
    # create-pull-request の GITHUB_TOKEN 由来 commit が anti-recursion guard で
    # pull_request event を発火させず、validate (required check) が走らないため
    # auto-merge が永遠に BLOCKED になる罠を踏んだ (PR #419 が DIRTY 衰突で破棄、
    # PR #425 は空コミット push で手動回避)。App token なら通常 PR と同じ扱いで
    # pull_request 経由 validate が発火し、auto-merge も成立する。
    # 01-fetch-products.yml と同じ omochairo-fetch-bot App を使用。
    # permissions: は App 側 scope で決まるので job レベル指定は不要。
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate inputs
        run: |
          if [ "${{ github.event.inputs.all }}" != "true" ] && [ -z "${{ github.event.inputs.asins }}" ]; then
            echo "::error::Either 'all=true' or non-empty 'asins' must be provided."
            exit 1
          fi

      - name: Backfill per_asin competitors
        run: |
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            python scripts/fetch_amazon.py \
              --all-articles \
              --competitors-only \
              --out data/raw/
          else
            python scripts/fetch_amazon.py \
              --asin "${{ github.event.inputs.asins }}" \
              --competitors-only \
              --out data/raw/
          fi
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}

      - name: Create PR with backfilled data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ALL_MODE: ${{ github.event.inputs.all }}
          ASINS: ${{ github.event.inputs.asins }}
        run: |
          set -e
          if git diff --quiet --exit-code -- data/raw/per_asin/ && [ -z "$(git status --porcelain -- data/raw/per_asin/)" ]; then
            echo "No per_asin changes to commit; skipping PR creation."
            exit 0
          fi
          if [ "$ALL_MODE" = "true" ]; then
            TITLE="chore(data): backfill per_asin competitors (--all, all articles)"
            MODE_LINE='`--all-articles` (every ASIN under `data/articles/`)'
          else
            TITLE="chore(data): backfill per_asin competitors (${ASINS})"
            MODE_LINE="\`--asin\` (\`${ASINS}\`)"
          fi
          BRANCH="chore/backfill-competitors-${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/raw/per_asin/
          if git diff --cached --quiet; then
            echo "Nothing staged after git add; skipping."
            exit 0
          fi
          git commit -m "$TITLE"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body "$(cat <<EOF
          ## Summary
          Backfill of \`data/raw/per_asin/<ASIN>/{snapshot.json,competitors.json}\`.

          **Mode**: ${MODE_LINE}

          ## Why
          \`build_post.py::_override_competitive_analysis\` replaces Jules-authored \`competitive_analysis[]\` with API-verified competitors only when \`per_asin/<ASIN>/competitors.json\` exists. Articles without this file fall back to Jules output (often paired with fabricated ASINs), which renders as text-only cards with no image / Amazon CTA. This PR closes that gap.

          ## Impact
          - Touches: \`data/raw/per_asin/<ASIN>/\` only (does NOT touch \`amazon.json\` or the live Jules pool)
          - 02-publish re-render will pick up new competitor data on next run
          EOF
          )" \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
