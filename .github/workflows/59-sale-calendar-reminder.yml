name: Sale Calendar Reminder
# #9449: 毎年来るセール (プライムデー・ブラックフライデー等) の時期が近づいたら、
# 「日程を公式で確認して hugo/data/sale_events.yaml に登録する」issue を 1 件立てる。
#
# セール期間の告知は、人が日程を確認して sale_events.yaml に 1 件追記すれば
# 自動で出て自動で消える。足りなかったのは「追記を思い出す手段」で、忘れると
# そのセールは告知されないまま過ぎる。
#
# - 公式のフィード 2 本 (About Amazon Japan / PR TIMES のアマゾンジャパン) を
#   1 回ずつ読み、開催の発表が出ていたら、題名から読んだ日程を「候補」として
#   issue に載せる (scripts/sale_announcements.py)。Amazon.co.jp 本体は読まない
# - 日程は自動では登録しない。出典での確認と sale_events.yaml への登録は人がやる
# - 発表を拾えなかったときの保険に、目安の時期 (data/sale_calendar.yaml) でも立てる。
#   判定は scripts/sale_calendar_reminder.py
# - 同じセールでは 1 回しか立てない (本文のマーカーで open / closed とも探す)。
#   目安で立てた issue が開いていれば、発表の候補はそこへ 1 回だけコメントする。
#   1 回の run で書くのは 1 件まで
# - 既存 issue の検索に失敗したら、立てずに赤で終わる (重複起票と無言の停止を避ける)
# - フィードを読めなかったら赤で終わる (検知が止まったまま緑にしない)

on:
  schedule:
    # 毎日 15:23 JST。初売りは発表 (12/27 ごろ) から開始まで 7 日しか無く、
    # 週次では間に合わない。発表は 10〜14 時台に出るので、その日のうちに拾う
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      today:
        description: '判定基準日 (YYYY-MM-DD)。空なら JST の今日。検証用'
        required: false
        default: ''
      dry_run:
        description: 'issue を立てず、判定結果と本文だけログに出す'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: sale-calendar-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Remind upcoming sales
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_TODAY: ${{ github.event.inputs.today }}
          # 定時実行 (inputs 無し) は本番動作。手動実行の既定は dry-run
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: |
          args=()
          if [ -n "$INPUT_TODAY" ]; then args+=(--today "$INPUT_TODAY"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/sale_calendar_reminder.py "${args[@]}"
