name: Rewrite Idle Fill

# Issue #812 Phase 1 — fill idle Jules slots with rewrites of low-quality / old-prompt
# articles whenever new-ASIN fetch supply is below the 8-slot capacity.
#
# Flow (Issue #2711 redesign — "replace, don't pre-delete"):
# 0. Cleanup: rewrite_queue.py --cleanup removes the stale old body + marker for
#    any PREVIOUS rewrite whose replacement body has already landed (safe: only
#    deletes when a newer body exists).
# 1. Compute exclude set = open PR titles + jules-lock/<ASIN> branches.
# 2. slack = max(0, 12 - active). Manual `limit` input overrides.
# 3. select_rewrite_targets.py picks `slack` ASINs by (pre-v7 first, slug date asc).
#    2026-08-09 まではここが (quality.total_score asc, missing→top priority) だったが、
#    quality sidecar が 2026-05-28 で生成停止しており、実際には「sidecar 生成が
#    止まった日」で並べていた (最古 233 件が新しい 1,669 件の後ろに回っていた)。
# 4. fetch_amazon.py --asin <CSV> --competitors-only refreshes per_asin/<ASIN>/.
# 5. apply_rewrite_targets.py injects per_asin/<ASIN>/amazon.json items into
#    data/raw/amazon.json items[] AND writes a data/rewrite_queue/<ASIN>.json
#    marker. It NO LONGER deletes the body — the body survives until step 0 of a
#    later cycle removes it, and only once the replacement exists.
# 6. Open PR + enable auto-merge. After merge, 03-invoke-jules (6h cron)
#    picks up the marked ASINs (pick-asin keeps a marked ASIN eligible while its
#    replacement body has not landed). A silently-failed regeneration leaves the
#    old body intact (no 404) and is retried next cycle.
#
# Issue #2711: the destructive pre-delete that lost ~338 bodies to permanent 404
# is gone. build_post.py renders only the newest body per ASIN, so the transient
# "old + new" window never produces a duplicate /products/<ASIN>/ URL.
on:
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    # 02:00 + 14:00 UTC = 11:00 + 23:00 JST, ~2h after each fetch cron
    # (fetch is at 00:00 + 09:00 UTC) so slack reflects latest supply.
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Override target count (default: idle-slot based, max 8). Use 0 to dry-run select only.'
        required: false
        default: ''

# GITHUB_TOKEN の権限を明記する (#5045)。このレーンの書き込み (branch push /
# PR 作成 / auto-merge) は actions/create-github-app-token の App token で
# 行っており、GITHUB_TOKEN は checkout が読むだけ。宣言が無いとリポジトリ既定に
# 引きずられ、既定が write なら不要な書き込み権限を持って走り、read-only に
# 締めれば黙って壊れる。どちらの向きにも動かないよう固定する。
permissions:
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # #5047 段階3 (Group A): fetch-depth を既定 (=1) に戻した。
      # このレーンの git 操作は commit-back だけで、HEAD より先の履歴を読まない
      # (add / commit / checkout -b / push、`git diff --cached` = index vs HEAD、
      # `git diff -- <path>` = worktree vs index、`git status --porcelain`)。
      # 呼び先の scripts/*.py にも git 依存が無いことを確認済み (#46 の教訓)。
      # 履歴を要求する 04 / 05 / 21 / 31 / 36 / 40 / 46 と、別ブランチを読む
      # 20 / 30 は**外さない**。分類は #5047 のコメント参照。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # #2711 step 0: tidy up rewrites from earlier cycles whose replacement body
      # has already landed (remove the now-superseded old body + its marker).
      # Safe by construction: cleanup_completed deletes only when a newer body
      # exists, so this can never orphan a page. Deletions ride along in the PR
      # created below (the commit step stages data/articles + data/rewrite_queue).
      - name: Cleanup completed rewrites
        run: python scripts/rewrite_queue.py --cleanup

      # #5490 step 0b: 生成側 (03-invoke-jules) が band=zero / unfetched で見送る
      # ASIN のマーカーを取り下げる。
      #
      # --cleanup は「新しい本体が着地したとき」だけ消すので、**生成されようが無い
      # ASIN のマーカーは永久に残る**。実測 (2026-08-18) で 11 件が band=zero のまま
      # 滞留し、最古は 56 日・中央値 30 日だった。マーカーが残る限り
      # select_rewrite_targets はキュー先頭でそれを見続け、同じ 12 件の PR を
      # 半日ごとに作り直していた (#5358 と #5428 は対象が完全一致)。
      #
      # 取り下げても本体は消さない。リライトを諦めるだけで記事は今のまま配信され、
      # 素材が埋まって band が上がれば次の選定で普通に選ばれ直す。
      - name: Withdraw markers the generator will never pick up
        run: python scripts/rewrite_queue.py --withdraw-deferred

      - name: Compute idle slack + select rewrite targets
        id: select
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -e
          gh pr list --repo "$REPO" --state open --json title --jq '.[].title' > /tmp/open_titles.txt || echo "" > /tmp/open_titles.txt
          gh api "repos/$REPO/git/matching-refs/heads/jules-lock/" \
            --jq '.[] | .ref | sub("refs/heads/jules-lock/"; "")' > /tmp/locked.txt 2>/dev/null || echo "" > /tmp/locked.txt
          cat /tmp/open_titles.txt /tmp/locked.txt > /tmp/excluded.txt
          ACTIVE=$(grep -oE 'B0[A-Z0-9]{8}' /tmp/excluded.txt | sort -u | wc -l || echo 0)
          # 2026-06-01 Issue #967: supply 黒字確認後 8 → 12 (03-invoke-jules.yml と揃える)
          MAX_LOCKS=12
          SLACK=$((MAX_LOCKS - ACTIVE))
          [ "$SLACK" -lt 0 ] && SLACK=0
          if [ -n "$INPUT_LIMIT" ]; then SLACK="$INPUT_LIMIT"; fi
          # 2026-06-08 (session 117 / #2008): Jules daily quota 共有ゲート。
          # この workflow は ASIN を amazon.json へ注入し 03-invoke-jules (6h cron) が
          # session を作る "03 に次ぐ producer"。03 と同じ rolling-24h 実 quota を尊重し、
          # 残り予算 (cap 80 = 100 から 20 margin) で SLACK を絞る。budget 0 なら count=0 で
          # green skip ([[reference-omochairo-jules-api-limits]] / prevent 側 graceful skip)。
          BUDGET=$(python scripts/jules_quota_gate.py --cap 80 --max "$SLACK" || echo 0)
          echo "Jules quota gate budget: $BUDGET (rolling-24h 作成数ベース)"
          if [ "${BUDGET:-0}" -lt "$SLACK" ]; then SLACK="${BUDGET:-0}"; fi
          [ "$SLACK" -lt 0 ] && SLACK=0
          echo "active=$ACTIVE max=$MAX_LOCKS slack=$SLACK"
          if [ "$SLACK" -le 0 ]; then
            echo "No idle slots; skipping."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #5490: 待ち行列に上限を置く。生成側の消化量 (03-invoke-jules が
          # 1 run あたり REWRITE_PICKS_PER_RUN=2 件・6h 周期 = 約 8 件/日) を
          # 超えて積むと、消化されないマーカーが増え続け、同じ対象を選び直して
          # 同じ PR を作り直すだけになる (実測 2026-08-31: マーカー 172 件・
          # 消化 0 件)。積むのは「1〜2 日で消化できる量」まで。
          BACKLOG=$(python -c "import sys; sys.path.insert(0,'scripts'); import rewrite_queue as rq; print(len(rq.eligible_rewrite_asins('data/articles')))")
          CAP="${REWRITE_QUEUE_CAP:-12}"
          echo "rewrite backlog=$BACKLOG cap=$CAP"
          if [ "$BACKLOG" -ge "$CAP" ]; then
            echo "Backlog at/over cap; not enqueueing more (cleanup already ran)."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROOM=$((CAP - BACKLOG))
          [ "$SLACK" -gt "$ROOM" ] && SLACK="$ROOM"
          echo "slack after backlog cap=$SLACK"
          python scripts/select_rewrite_targets.py \
            --articles-dir data/articles \
            --exclude-file /tmp/excluded.txt \
            --limit "$SLACK" \
            --out /tmp/rewrite_targets.txt
          COUNT=$(grep -cE 'B0[A-Z0-9]{8}' /tmp/rewrite_targets.txt || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            ASINS_CSV=$(paste -sd, /tmp/rewrite_targets.txt)
            echo "asins=$ASINS_CSV" >> "$GITHUB_OUTPUT"
            echo "Selected: $ASINS_CSV"
          fi

      - name: Refresh per_asin data via Creator API
        if: steps.select.outputs.count != '0'
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: |
          python scripts/fetch_amazon.py \
            --asin "${{ steps.select.outputs.asins }}" \
            --competitors-only \
            --out data/raw/

      - name: Inject targets into amazon.json + write rewrite-queue markers
        if: steps.select.outputs.count != '0'
        env:
          ASINS_CSV: ${{ steps.select.outputs.asins }}
        run: python scripts/apply_rewrite_targets.py --asins "$ASINS_CSV"

      # Not gated on select.count: a cleanup-only cycle (step 0 removed a
      # superseded body + marker but found no new idle slots) still needs its
      # tidy-up committed.
      - name: Create PR with auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ASINS_CSV: ${{ steps.select.outputs.asins }}
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit; skipping PR."
            exit 0
          fi
          BRANCH="rewrite-idle/${{ github.run_id }}"
          if [ -n "$ASINS_CSV" ]; then
            TITLE="chore(rewrite): idle-fill rewrite of ${ASINS_CSV} (#812)"
          else
            TITLE="chore(rewrite): cleanup completed rewrites (#2711)"
          fi
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # -A so step-0 cleanup deletions (old bodies + markers) are staged too.
          # price_history: #2953 C案。--competitors-only 経由の write_per_asin_snapshot が
          # 同時に data/price_history/<ASIN>.jsonl へ追記する。
          git add -A data/raw/amazon.json data/raw/per_asin/ data/articles/ data/rewrite_queue/ data/price_history/
          if git diff --cached --quiet; then
            echo "Nothing staged after git add; skipping."
            exit 0
          fi
          git commit -m "$TITLE"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body "$(cat <<EOF
          ## Summary
          Idle-fill rewrite cycle (Issue #812 Phase 1).

          **Targets**: \`${ASINS_CSV}\`

          ## What this PR does (Issue #2711 "replace, don't pre-delete")
          - Refreshes \`data/raw/per_asin/<ASIN>/{amazon.json,competitors.json}\` via Creator API
          - Prepends each target's item record into \`data/raw/amazon.json\` items[] so 03-invoke-jules can pick them
          - Writes a \`data/rewrite_queue/<ASIN>.json\` marker (request), **without deleting the body**
          - Cleanup: removes any old body + marker whose replacement already landed in an earlier cycle

          ## Why
          fetch_amazon new-ASIN supply was low at cron time, leaving Jules slots idle. Selected ASINs are the lowest \`quality.total_score\` / oldest articles (sidecar-missing articles ranked first as old-prompt revisions).

          After merge, 03-invoke-jules (6h cron) re-generates each marked ASIN. The old body survives until its replacement lands, so a failed regeneration never orphans the page into a 404 (the bug behind #2711).
          EOF
          )" \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL" || echo "::warning::Could not enable auto-merge on $PR_URL"
