name: Re-search low confidence cross matches (manual)
# Issue #515 / JAN re-search: 既存の rakuten_matched.json / yahoo_matched.json の
# うち、JAN コードが利用可能で (a) 欠落 / (b) build_post._matched_passes_quality
# 不合格 / (c) text マッチで JAN アップグレード余地 のいずれかに該当する ASIN を
# 強制再検索し、結果を main に PR で起票する manual cleanup workflow。
#
# 設計判断 (memory):
# - cron なし: 普段の 01-fetch-products は API コール節約のため既存マッチを
#   保持する仕様。低信頼再検索はメンテ用途なので手動 trigger 限定にする。
# - App token + 通常の git commit + gh pr create: peter-evans/create-pr では
#   validate (pull_request) が発火しない trap を避ける (feedback_omochairo_peter_evans_validate_trap)。
# - --re-search-low-confidence は scripts/fetch_cross_search.py に実装された
#   新フラグ。新結果が quality 不合格で旧結果が合格なら旧を保持 (no-worse guard)。
on:
  workflow_dispatch:
    inputs:
      max_re_search:
        description: '低信頼再検索を何件までに絞るか (0 = 無制限)。実測 6.8 秒/件'
        required: false
        type: string
        default: '250'
      re_search_offset:
        description: '低信頼候補の先頭を何件飛ばすか。0/500 → 500/500 と刻む'
        required: false
        type: string
        default: '0'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: re-search-low-confidence
  cancel-in-progress: false

jobs:
  re-search:
    runs-on: ubuntu-latest
    # 既定の 6 時間まで走らせない。2026-09-06 の run 34007621267 は 3 か月分の
    # バックログを舐めて 2 時間経っても終わらず手で打ち切った (過去 run は 15〜31 分)。
    #
    # 45 分にしたら今度は timeout で殺された (run 34027983203)。**上限は総実行時間を
    # 縛れない**のが理由: キャップの対象は「低信頼による昇格」だけで、マッチが
    # 存在しない ASIN は上限に関係なく検索される。2026-09-06 実測でその固定費が
    # 279 ASIN (楽天無し 245 / Yahoo 無し 106) あり、6.8 秒/件で約 32 分かかる。
    #
    #   固定費 ~32 分 + 上限 250 件 x 6.8 秒 ~28 分 = 約 60 分
    #
    # 90 分はその 1.5 倍。固定費側は「一度取れば次回から消える」性質で単調に
    # 減るので、そちらを刻む機構は作っていない。
    timeout-minutes: 90
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # #5047 段階3 (Group A): fetch-depth を既定 (=1) に戻した。
      # このレーンの git 操作は commit-back だけで、HEAD より先の履歴を読まない
      # (add / commit / checkout -b / push、`git diff --cached` = index vs HEAD、
      # `git diff -- <path>` = worktree vs index、`git status --porcelain`)。
      # 呼び先の scripts/*.py にも git 依存が無いことを確認済み (#46 の教訓)。
      # 履歴を要求する 04 / 05 / 21 / 31 / 36 / 40 / 46 と、別ブランチを読む
      # 20 / 30 は**外さない**。分類は #5047 のコメント参照。
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 刻んで回す (#5047 follow-up)。上限だけだと no-worse guard で保持された
      # ASIN が毎回同じ先頭 N 件を占め、末尾に永遠に到達しない。offset とセット。
      # 残件は script が "Low-confidence backlog: ... deferred=N" と、次に使う
      # --re-search-offset を ::notice:: でログに出す。
      - name: Re-search low confidence cross matches
        run: |
          # 既定値は **shell 側** で当てる。11-link-report-aggregate は
          # `gh workflow run 10-... --ref main` と input 無しで叩くので、
          # dispatch input の default が効かず inputs.* が空文字で来る経路がある
          # (feedback-gha-dispatch-input-default-vs-env-fallback)。
          # `${{ inputs.x || 500 }}` だと 0 を指定したときの扱いも曖昧になるため、
          # ${VAR:-default} で「空なら既定、0 は 0 のまま」を保証する。
          python scripts/fetch_cross_search.py \
            --re-search-low-confidence \
            --max-re-search "${MAX_RE_SEARCH:-500}" \
            --re-search-offset "${RE_SEARCH_OFFSET:-0}"
        env:
          MAX_RE_SEARCH: ${{ inputs.max_re_search }}
          RE_SEARCH_OFFSET: ${{ inputs.re_search_offset }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}
          VALUECOMMERCE_PID: ${{ secrets.VALUECOMMERCE_PID }}

      - name: Create re-search result PR + enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e

          git add data/raw/rakuten_matched.json data/raw/yahoo_matched.json || true

          if git diff --cached --quiet; then
            echo "No matched.json changes after re-search; skipping PR creation."
            exit 0
          fi

          # 既存 open の自動 re-search PR があれば閉じる (再実行重複防止)。
          echo "Checking for old automated re-search PRs..."
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("re-search-low-confidence/")) | .number' | while read -r pr_num; do
            if [ -n "$pr_num" ]; then
              echo "Closing old PR #$pr_num and deleting branch..."
              gh pr close "$pr_num" -d || true
            fi
          done

          BRANCH="re-search-low-confidence/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data: re-search low confidence cross matches (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data: re-search low confidence cross matches (run ${{ github.run_id }})" \
            --body "Automated low-confidence re-search of \`data/raw/rakuten_matched.json\` and \`data/raw/yahoo_matched.json\` by \`scripts/fetch_cross_search.py --re-search-low-confidence\`. Triggered by manual workflow_dispatch (run ${{ github.run_id }}). Refs #515." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        # #4793: continue-on-error を外した。auto-merge の有効化だけは上の
        # if/else で握りつぶしてあるので、ここに残っていたのは **git push と
        # gh pr create の失敗** を飲む効果だけだった。それが落ちるとその run の
        # データ更新が丸ごと消えるのに、continue-on-error のステップは REST の
        # steps[].conclusion も success を返すため run 一覧でも step 一覧でも
        # 見えない (#4793 項目2 の方針 (c))。01 / 19 で 08-18〜08-24 の連続
        # グリーンを確認したうえで残り 8 本へ広げたもの。
