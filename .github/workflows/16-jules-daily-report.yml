name: Jules Daily Usage Report

# #1200 — 毎日 08:00 JST (= 23:00 UTC 前日) に Jules 消費を集計して Issue #1200
# に append する。run 数 / PR 数 / cap 状況を可視化。
#
# 設計判断:
#   - target date は「cron が予定された UTC 日」(23:00 UTC の枠が属する日)。
#     定時 run は数時間遅れて翌 UTC 日に始まるので、開始時刻の日付をそのまま使うと
#     始まったばかりの日を集計して全項目 0 になる (#9410)。開始時刻から 23 時間
#     引いた日付を使えば、定刻でも 23 時間未満の遅れでも同じ日になる。
#   - workflow_dispatch では --date 指定可能 (任意日のバックフィル)。未指定なら
#     当日 UTC (当日確認用)。
#   - GITHUB_TOKEN で issue write 可能 (permissions: issues: write)。

on:
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    # 23:00 UTC = 08:00 JST 翌朝 (UTC date は前日のまま、JST date は翌朝)。
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD, UTC). Default: today UTC.'
        required: false
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install --quiet requests

      - name: Generate report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          if [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            DATE=$(date -u -d '23 hours ago' +%Y-%m-%d)
          else
            DATE=$(date -u +%Y-%m-%d)
          fi
          echo "Target date: $DATE"
          python scripts/report_jules_usage.py --date "$DATE" > /tmp/report.md
          # #1353: gh PR 推定だけでなく Jules API の実 session state も併記する。
          # daily=rolling 24h 圧 / concurrent=15 枠占有 / スタック session を可視化。
          echo "" >> /tmp/report.md
          echo "---" >> /tmp/report.md
          echo "" >> /tmp/report.md
          python scripts/report_jules_sessions.py >> /tmp/report.md
          echo "--- preview ---"
          cat /tmp/report.md
          echo "--- end ---"

      - name: Post comment to dashboard Issue #1200
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh issue comment 1200 -R "${{ github.repository }}" --body-file /tmp/report.md
