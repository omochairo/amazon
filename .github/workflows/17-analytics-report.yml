name: Analytics Weekly Report (GA4 + GSC)

# Issue #1316 Phase 1+2 — GA4 Data API + GSC Search Analytics API から週次データを
# 取得し、analytics ラベル付き Issue として投稿する read-only 観察 workflow。
#
# 設計判断:
#   - cron: 月曜 09:00 JST (= 日曜 00:00 UTC)。前週のおおよそをカバー
#   - score / narrative / 記事生成パイプラインには一切影響しない
#   - artifact upload のみ。main commit は App token 不要のため避ける
#   - GA4 は SA JSON 認証 ([[omochairo-ga4-gsc-sa-add-bug]] の Admin API 経由で登録済)
#   - GSC は OAuth refresh token 認証 (UI バグで SA が GSC に追加できないため)
#   - GSC secrets 未設定なら GSC step は skip して GA4 のみで報告
#
# 必須 secrets (GA4):
#   - GA4_SA_JSON                Service Account JSON 全文
#   - GA4_PROPERTY_ID            GA4 property の数値 ID
#
# 任意 secrets (GSC, Phase 2 で追加):
#   - GSC_OAUTH_CLIENT_ID        Desktop OAuth Client の Client ID
#   - GSC_OAUTH_CLIENT_SECRET    同 Client Secret
#   - GSC_OAUTH_REFRESH_TOKEN    OAuth Playground 経由で取得した refresh token
#   - GSC_SITE_URL               例: https://navi.omcha.jp/ (URL-prefix) or sc-domain:omcha.jp
#
# WP omcha.jp の GSC 取得は 2026-08-07 に omochairo/omcha-ops (private) の
# 専用 workflow (10-gsc-wp-daily.yml) へ移設した。理由は公開分析の非公開化
# ([[project-omcha-ops]])。本 workflow に WP 節は存在しない。

on:
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    # 月曜 09:00 JST = 日曜 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (default 7)'
        required: false
        default: '7'

permissions:
  contents: read
  issues: write

concurrency:
  group: analytics-weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      # #4793 follow-up: GA4 / GSC の実数値を含む Issue は **private リポジトリ**へ立てる。
      #
      # 本リポジトリは public で、Issue のタイトル・本文は全世界に公開され第三者ミラーに
      # 永久保存される (後から消しても消えない)。CLAUDE.md「共同開発の会話は private 側で
      # やる」が「ここに書かないもの」の筆頭に挙げているのが GSC / GA4 の実数値・順位で、
      # このレーンはそれを毎週自動で public に投稿していた (例: 週次レポートの PV 実数、
      # `[A-1] CTR low: <URL> (imp=..., ctr=...%, pos=...)` というタイトル)。
      #
      # 宛先は amazon-navi-brain。navi の「相談・判断・数値」のレーンとして
      # CLAUDE.md と同リポジトリ Issue #2 で定義済みで、collaborator も 2 名に限定されている。
      #
      # **実数値を含まない Issue はこれまでどおり public に立てる。** A-6
      # (brand_taxonomy 追加候補) と P3 (カタログ未登録ブランド候補) は件数と ASIN だけで
      # GA4 / GSC 由来の指標を持たず、かつ「TODO は Issues に置く」で一次管理する作業項目
      # なので、private に移すと公開側の TODO 一覧から消えて追跡できなくなる。
      ANALYTICS_ISSUE_REPO: omochairo/amazon-navi-brain
    steps:
      # #1329: 週次 GSC スナップショット (by_combo 込み) を main に commit するため
      # App token を生成する。GITHUB_TOKEN 直 push は main 保護で GH006 silent reject
      # になる ([[feedback-omochairo-silent-push-reject]])。push は App token 経由。
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data google-auth google-auth-oauthlib google-api-python-client pyyaml

      - name: Fetch GA4 data
        env:
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          set -e
          DAYS="${INPUT_DAYS:-7}"
          if [ -z "$GA4_SA_JSON" ] || [ -z "$GA4_PROPERTY_ID" ]; then
            echo "::error::GA4_SA_JSON or GA4_PROPERTY_ID secret is not set"
            exit 1
          fi
          python scripts/fetch_ga4.py --days "$DAYS"

      - name: Fetch GSC data (optional)
        id: gsc
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          set +e
          DAYS="${INPUT_DAYS:-7}"
          # #4793: secret 未設定は緑で skip しない。GA4 側 (上のステップ) は既に
          # exit 1 なのに GSC だけ緑 skip だと、token が失効した週から
          # 「GA4 だけのレポート」が黙って出続け、誰も気付かない。fetch 失敗
          # (rc != 0) は別クラスなので下の warning のまま残す — あれは一時的な
          # API 失敗で、GA4 だけのレポートを出すのが正しい縮退。
          if [ -z "$GSC_OAUTH_REFRESH_TOKEN" ] || [ -z "$GSC_SITE_URL" ]; then
            echo "::error::required secret not set — GSC_OAUTH_REFRESH_TOKEN / GSC_SITE_URL"
            exit 1
          fi
          python scripts/fetch_gsc.py --days "$DAYS"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::GSC fetch failed (rc=$rc) — continuing with GA4-only report"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build markdown summary
        id: summary
        run: |
          set -e
          python scripts/format_ga4_report.py --input data/analytics/ga4_weekly.json > /tmp/report.md
          if [ "${{ steps.gsc.outputs.available }}" = "true" ]; then
            echo "" >> /tmp/report.md
            echo "---" >> /tmp/report.md
            echo "" >> /tmp/report.md
            python scripts/format_gsc_report.py --input data/analytics/gsc_weekly.json \
              --label "navi.omcha.jp" >> /tmp/report.md
          fi
          START=$(python -c "import json; print(json.load(open('data/analytics/ga4_weekly.json'))['range']['start'])")
          END=$(python -c "import json; print(json.load(open('data/analytics/ga4_weekly.json'))['range']['end'])")
          echo "range_start=$START" >> "$GITHUB_OUTPUT"
          echo "range_end=$END" >> "$GITHUB_OUTPUT"
          echo "--- preview ---"
          head -60 /tmp/report.md
          echo "--- end ---"

      - name: Detect low-CTR pages (A-1, epic #1356)
        id: low_ctr
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_low_ctr_pages.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/low_ctr_pages.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT low-CTR pages"

      - name: Detect opportunity pages (A-2, epic #1356)
        id: opportunity
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_opportunity_pages.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/opportunity_pages.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT opportunity pages"

      - name: Suggest brand_taxonomy additions (A-6, epic #1356)
        id: brand_suggest
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/suggest_brand_taxonomy_additions.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/brand_taxonomy_suggestions.json'))['candidates']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT brand taxonomy candidates"

      - name: Suggest brand_taxonomy additions from catalog (P3, epic #2126)
        id: catalog_brand
        # 供給側 (カタログ) 起点なので GSC の有無に依存せず常に走らせる。
        continue-on-error: true
        run: |
          set -e
          python scripts/suggest_brand_taxonomy_from_catalog.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/catalog_brand_candidates.json'))['candidates']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT catalog brand candidates"

      - name: Detect query cannibalization (A-3, epic #1356)
        id: cannibal
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_cannibalization.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/cannibalization.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT cannibalization candidates"

      - name: Detect engagement drop (A-4, epic #1356)
        id: engagement_drop
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_engagement_drop.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/engagement_drop.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT engagement-drop pages"

      - name: Detect internal-link orphans (A-5, epic #1356)
        id: orphans
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_orphan_pages.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/orphan_pages.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT orphan pages"

      - name: Classify query intent (A-7, epic #1356)
        id: query_intent
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_query_intent.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/query_intent.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "classified $COUNT pages by query intent"

      # #5941 / amazon-navi-brain#18: 各検出器の **母数** を記録し、2 週続けて
      # 0 なら鳴らす。A-2 / A-3 / A-6 は 4 週連続 0 件だったが、それは「該当が
      # 無い」ではなく「閾値に届く母数が存在しない」状態で、**検出器は正常に走って
      # 正しく 0 を返していた**。上の各 step が出す count だけを見ていると、この
      # 状態は永久に緑のまま気づけない (#5941 の health check は「落ちたか」しか
      # 見ない)。
      #
      # continue-on-error を **付けない**のは意図的。この step は観察レーンの
      # 観察者で、ここが黙って落ちると #5941 と同じ穴をもう 1 つ作ることになる。
      # 検出器の出力が無い/壊れている場合はスクリプト側が null として扱い、
      # 例外にはしない (欠落を 0 と混ぜないため)。
      - name: Record detector eligibility (#5941 / brain#18)
        id: eligibility
        run: python scripts/check_detector_eligibility.py

      # #1329: gsc_weekly.json は by_combo (query×page) を含む。日次 JSONL history
      # (data/analytics/history/, #1357 B-0) は by_query/by_page 分離で combo を落とす
      # ため、14-brand-narrative への GSC クエリ注入 (page_path match) には使えない。
      # 週次窓 (7日) の gsc_weekly.json を data/analytics/gsc_history/<YYYY-Www>.json に
      # スナップショット保存し、App token + PR + auto-merge で main に積む
      # ([[feedback-omochairo-analytics-history-no-bycombo]])。
      # #1980: query_intent.json (A-7 分類結果) も build_post の CTA layout 切替が
      # 読む入力として同じコミットに相乗り (新規 step/PR パターンは作らない)。
      - name: Snapshot GSC weekly (by_combo) for #1329 + query intent for #1980
        if: steps.gsc.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          python - <<'PY'
          import json, pathlib, datetime
          d = json.load(open("data/analytics/gsc_weekly.json", encoding="utf-8"))
          end = (d.get("range") or {}).get("end")
          iso = datetime.date.fromisoformat(end).isocalendar()
          name = f"{iso[0]}-W{iso[1]:02d}"
          out = pathlib.Path("data/analytics/gsc_history") / f"{name}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding="utf-8")
          print("snapshot:", out)
          PY

          git add data/analytics/gsc_history/ || true
          if [ -f data/analytics/query_intent.json ]; then
            git add data/analytics/query_intent.json || true
          fi
          # #5941: 母数の履歴。検出器の出力 JSON 自体は tracked ではないので、
          # 「前回の eligible」の唯一の出どころがこの 1 本になる。ここを commit
          # し損ねると 2 週連続判定が永久に成立しない。
          if [ -f data/analytics/history/detector_eligibility.jsonl ]; then
            git add data/analytics/history/detector_eligibility.jsonl || true
          fi
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit (same week already accumulated?); skipping PR."
            exit 0
          fi

          # 既存 open gsc-snapshot PR があれば閉じる (週次重複防止)
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("gsc-snapshot/")) | .number' | while read -r pr_num; do
            if [ -n "$pr_num" ]; then
              echo "Closing old PR #$pr_num and deleting branch..."
              gh pr close "$pr_num" -d || true
            fi
          done

          BRANCH="gsc-snapshot/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data(analytics): GSC weekly snapshot (by_combo) for #1329 + query_intent for #1980 + detector eligibility for #5941"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(analytics): GSC weekly snapshot (by_combo) for #1329 + query_intent for #1980 + detector eligibility for #5941" \
            --body "Automated weekly snapshot of data/analytics/gsc_weekly.json (includes by_combo = query×page) under data/analytics/gsc_history/<YYYY-Www>.json, plus the current data/analytics/query_intent.json (A-7 classification, #1980 CTA layout switch input). The daily JSONL history (data/analytics/history/, #1357 B-0) splits by_query/by_page and drops the combo, which #1329 (GSC queries → 14-brand-narrative prompt, page_path match) needs. Also appends one row to data/analytics/history/detector_eligibility.jsonl (per-detector eligible/detected counts, #5941) - the detector output JSONs themselves are not tracked, so this file is the only source of the previous run's eligible. Refs #1329, #1980, #5941." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        # #4793: continue-on-error を外した。auto-merge の有効化だけは上の
        # if/else で握りつぶしてあるので、ここに残っていたのは **git push と
        # gh pr create の失敗** を飲む効果だけだった。それが落ちるとその run の
        # データ更新が丸ごと消えるのに、continue-on-error のステップは REST の
        # steps[].conclusion も success を返すため run 一覧でも step 一覧でも
        # 見えない (#4793 項目2 の方針 (c))。01 / 19 で 08-18〜08-24 の連続
        # グリーンを確認したうえで残り 8 本へ広げたもの。

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: analytics-weekly-${{ steps.summary.outputs.range_end }}
          path: |
            data/analytics/ga4_weekly.json
            data/analytics/gsc_weekly.json
            data/analytics/low_ctr_pages.json
            data/analytics/opportunity_pages.json
            data/analytics/brand_taxonomy_suggestions.json
            data/analytics/catalog_brand_candidates.json
            data/analytics/cannibalization.json
            data/analytics/engagement_drop.json
            data/analytics/orphan_pages.json
            data/analytics/query_intent.json
          retention-days: 90
          if-no-files-found: warn

      # 以降の Issue 起票の前に、private 側へ書ける資格情報があることを確かめる。
      #
      # ここを **黙って skip させない**のが要点 (#4793)。skip して緑終了させると、
      # PAT が失効した週から「実数値の Issue が 1 件も立たない」状態が無音で続き、
      # レーンが死んでいることに誰も気づけない。逆に握りつぶさず落とせば、
      # 週次で赤が出るので必ず気づく。
      #
      # データ側 (GSC スナップショットの commit-back) は既に上で完了しているので、
      # ここで落ちても収集済みデータは失われない。落ちるのは起票だけ。
      - name: Preflight — private Issue 先への書き込み資格を確認
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::NAVI_BRAIN_PAT が未設定です。GA4/GSC の実数値を含む Issue は"
            echo "::error::public リポジトリには立てられないため、ここで停止します。"
            echo "::error::PAT には ${ANALYTICS_ISSUE_REPO} への issues:write が必要です。"
            exit 1
          fi
          if ! gh api "repos/${ANALYTICS_ISSUE_REPO}" --jq .full_name >/dev/null; then
            echo "::error::NAVI_BRAIN_PAT で ${ANALYTICS_ISSUE_REPO} にアクセスできません。"
            echo "::error::PAT の失効かスコープ不足です (issues:write が必要)。"
            exit 1
          fi

      # 期限切れの A レーン Issue を、この run の起票より **前** に閉じる (#6415 系)。
      #
      # A レーンの Issue は観測週のスナップショットで、恒久課題ではない。放置すると
      # 各 opener の重複防止マーカーが効き続け、「同 URL の古い Issue が open だから
      # 新しい週の検出は起票しない」状態になる。つまり掃除しないと最新の数値が
      # 二度と上がってこない。先に閉じてから起票することで、まだ検出され続けている
      # URL はこの run の中で最新の数値の Issue に置き換わる。
      #
      # マーカー (`<!-- analytics-expires:YYYY-MM-DD -->`) を持たない Issue には
      # 触らない。人が立てたものを巻き込まないため。
      - name: Close expired analytics Issues (A レーンのスナップショット掃除)
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          REPO: ${{ env.ANALYTICS_ISSUE_REPO }}
        run: |
          set -e
          python -m scripts.close_expired_analytics_issues

      - name: Open rewrite Issues for low-CTR pages
        if: steps.low_ctr.outputs.count != '0' && steps.low_ctr.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          REPO: ${{ env.ANALYTICS_ISSUE_REPO }}
        run: |
          set -e
          python -m scripts.open_low_ctr_issues

      - name: Open opportunity Issues
        if: steps.opportunity.outputs.count != '0' && steps.opportunity.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          REPO: ${{ env.ANALYTICS_ISSUE_REPO }}
        run: |
          set -e
          python -m scripts.open_opportunity_issues

      - name: Open brand_taxonomy suggestion Issue
        if: steps.brand_suggest.outputs.count != '0' && steps.brand_suggest.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_brand_suggestion_issue.py

      - name: Open catalog brand Issue (P3, epic #2126)
        if: steps.catalog_brand.outputs.count != '0' && steps.catalog_brand.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_catalog_brand_issue.py

      - name: Open cannibalization Issues (A-3)
        if: steps.cannibal.outputs.count != '0' && steps.cannibal.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          REPO: ${{ env.ANALYTICS_ISSUE_REPO }}
        run: |
          set -e
          python -m scripts.open_cannibalization_issues

      - name: Open engagement-drop Issues (A-4)
        if: steps.engagement_drop.outputs.count != '0' && steps.engagement_drop.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          REPO: ${{ env.ANALYTICS_ISSUE_REPO }}
        run: |
          set -e
          python -m scripts.open_engagement_drop_issues

      - name: Open orphan-page Issues (A-5)
        if: steps.orphans.outputs.count != '0' && steps.orphans.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          REPO: ${{ env.ANALYTICS_ISSUE_REPO }}
        run: |
          set -e
          python -m scripts.open_orphan_issues

      - name: Open query-intent Issues (A-7)
        if: steps.query_intent.outputs.count != '0' && steps.query_intent.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          REPO: ${{ env.ANALYTICS_ISSUE_REPO }}
        run: |
          set -e
          python -m scripts.open_query_intent_issues

      # 週次レポート本体は PV / 表示回数 / CTR / 掲載順位の実数値そのものなので private へ。
      #
      # per-URL 検出と同じく、これも「その週のスナップショット」なので有効期限を
      # 付ける (marker は close_expired_analytics_issues.py が読む)。TTL は
      # per-URL の 14 日より長い WEEKLY_TTL_DAYS=28 — 数値の突き合わせに参照される
      # ぶん寿命が長いため。期限を決められなかったときは marker が空になり、
      # 従来どおり期限なしで残る。
      - name: Create weekly Issue
        env:
          GH_TOKEN: ${{ secrets.NAVI_BRAIN_PAT }}
          RANGE_START: ${{ steps.summary.outputs.range_start }}
          RANGE_END: ${{ steps.summary.outputs.range_end }}
          GSC_AVAILABLE: ${{ steps.gsc.outputs.available }}
        run: |
          set -e
          if [ "$GSC_AVAILABLE" = "true" ]; then
            TITLE="Analytics weekly report ${RANGE_START} 〜 ${RANGE_END} (GA4+GSC)"
          else
            TITLE="GA4 weekly report ${RANGE_START} 〜 ${RANGE_END}"
          fi
          MARKER=$(python -m scripts._analytics_issue_expiry --end "$RANGE_END" --weekly)
          if [ -n "$MARKER" ]; then
            { echo "$MARKER"; cat /tmp/report.md; } > /tmp/report_stamped.md
            {
              echo
              echo "---"
              echo
              echo "この Issue は ${RANGE_START} 〜 ${RANGE_END} 週のスナップショットで、"
              echo "上の期限を過ぎると \`close_expired_analytics_issues.py\` が自動 close する。"
              echo "翌週の run が同じ形のレポートを立て直すので、取りこぼしにはならない。"
              echo "恒久的に追う論点はこの Issue に足さず、期限マーカーを持たない別 Issue へ切り出すこと。"
            } >> /tmp/report_stamped.md
            mv /tmp/report_stamped.md /tmp/report.md
          fi
          gh issue create \
            -R "$ANALYTICS_ISSUE_REPO" \
            --title "$TITLE" \
            --label "analytics,observation" \
            --body-file /tmp/report.md

      # C-1 (#3988) / 対象 #3333: WP omcha.jp → navi.omcha.jp への文脈リンク追加を
      # 実施してよいかのゲート判定。この workflow は日曜 00:00 UTC に走るが、
      # 判定に使う data/analytics/history/gsc_index_census.jsonl は
      # 22-gsc-index-census.yml (日曜 22:00 UTC) が積む。つまり本 step は常に
      # "前週分" の census を読むことになる (最大 1 週間のラグ)。週次トレンドゲート
      # としてはこのラグは許容範囲 — 直近の 1 行が古くても、trend window
      # (既定直近3行) は依然として週次の推移を表す。
      # 読み取り専用の観察 step。新規 Issue/コメントは作らず、GITHUB_STEP_SUMMARY
      # に判定結果を追記するのみ (GitHub API バースト禁止規律)。
      - name: WP → navi link gate check (C-1, #3988 / 対象 #3333)
        continue-on-error: true
        run: |
          python scripts/check_wp_navi_link_gate.py >> "$GITHUB_STEP_SUMMARY"
      # #5941: 上の検出器 8 本は continue-on-error なので、落ちても run は緑になり、
      # 下流の surfacing step も `count != ''` の条件で静かにスキップされる。つまり
      # **「壊れた (count='')」と「検出 0 件 (count='0')」が区別できない**。
      # 実際 opportunity / brand_suggest / cannibal / engagement_drop は 4 週連続 0 件
      # なので、どれかが落ち始めても表示上は何も変わらない (#5941 に実測)。
      #
      # continue-on-error 自体は外さない。「検出器が 1 つ落ちてもレポート全体は出す」
      # という意図は正しく、orphans が落ちたせいで GA4/GSC の週次レポートごと
      # 出ないのは明らかに損だから。代わりに **レポート投稿の後** に outcome を
      # 集めて run を赤にする。レポートは出たうえで失敗が run 一覧に見える。
      #
      # outcome を見るのは continue-on-error 適用 **前** の結果だから
      # (conclusion のほうは success に潰れる)。#4783 の channel_results と同じ形。
      # skipped は数えない — GSC 無しでゲートされた正常系なので失敗ではない。
      - name: Detector health check (#5941)
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: >-
            low_ctr=${{ steps.low_ctr.outcome }}
            opportunity=${{ steps.opportunity.outcome }}
            brand_suggest=${{ steps.brand_suggest.outcome }}
            catalog_brand=${{ steps.catalog_brand.outcome }}
            cannibal=${{ steps.cannibal.outcome }}
            engagement_drop=${{ steps.engagement_drop.outcome }}
            orphans=${{ steps.orphans.outcome }}
            query_intent=${{ steps.query_intent.outcome }}
        run: |
          set -e
          # id を書き間違えると ${{ steps.X.outcome }} は空文字になり、健全性
          # チェックが「何も見ていない」状態で緑になる。そこだけは明示的に落とす。
          #
          # #5941: 上の空ファイル判定は **1 度も発火しない書き方だった**。id を誤記しても
          # 展開結果は `low_ctr=` という「空でない行」になるので `grep -v` を素通りし、
          # ファイルは非空になる。値が空の行そのものを見る判定を下に足した
          # (2026-08-31 に 5 ケースをローカルで流して実測)。
          echo "$OUTCOMES" | tr ' ' '\n' | grep -v '^$' > /tmp/detector_outcomes.txt || true
          if [ ! -s /tmp/detector_outcomes.txt ]; then
            echo "::error::検出器の outcome が 1 つも取れていません。step id を確認してください。"
            exit 1
          fi
          MISSING=$(grep -E '=$' /tmp/detector_outcomes.txt || true)
          if [ -n "$MISSING" ]; then
            echo "::error::outcome を取れていない検出器があります (step id の誤記か、その step まで到達していない): $(echo $MISSING)"
            exit 1
          fi
          {
            echo "## Detector health (#5941)"
            echo ""
            echo '```'
            cat /tmp/detector_outcomes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/detector_outcomes.txt
          FAILED=$(grep '=failure' /tmp/detector_outcomes.txt || true)
          if [ -n "$FAILED" ]; then
            echo "::error::検出器が失敗しました。週次レポートは投稿済みです: $(echo $FAILED | tr '\n' ' ')"
            exit 1
          fi
          echo "all detectors ok (failure なし)"
