name: Analytics Weekly Report (GA4 + GSC)

# Issue #1316 Phase 1+2 — GA4 Data API + GSC Search Analytics API から週次データを
# 取得し、analytics ラベル付き Issue として投稿する read-only 観察 workflow。
#
# 設計判断:
#   - cron: 月曜 09:00 JST (= 日曜 00:00 UTC)。前週のおおよそをカバー
#   - score / narrative / 記事生成パイプラインには一切影響しない
#   - artifact upload のみ。main commit は App token 不要のため避ける
#   - GA4 は SA JSON 認証 ([[omochairo-ga4-gsc-sa-add-bug]] の Admin API 経由で登録済)
#   - GSC は OAuth refresh token 認証 (UI バグで SA が GSC に追加できないため)
#   - GSC secrets 未設定なら GSC step は skip して GA4 のみで報告
#
# 必須 secrets (GA4):
#   - GA4_SA_JSON                Service Account JSON 全文
#   - GA4_PROPERTY_ID            GA4 property の数値 ID
#
# 任意 secrets (GSC, Phase 2 で追加):
#   - GSC_OAUTH_CLIENT_ID        Desktop OAuth Client の Client ID
#   - GSC_OAUTH_CLIENT_SECRET    同 Client Secret
#   - GSC_OAUTH_REFRESH_TOKEN    OAuth Playground 経由で取得した refresh token
#   - GSC_SITE_URL               例: https://navi.omcha.jp/ (URL-prefix) or sc-domain:omcha.jp
#
# WP omcha.jp の GSC 取得は 2026-08-07 に omochairo/omcha-ops (private) の
# 専用 workflow (10-gsc-wp-daily.yml) へ移設した。理由は公開分析の非公開化
# ([[project-omcha-ops]])。本 workflow に WP 節は存在しない。

on:
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    # 月曜 09:00 JST = 日曜 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (default 7)'
        required: false
        default: '7'

permissions:
  contents: read
  issues: write

concurrency:
  group: analytics-weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # #1329: 週次 GSC スナップショット (by_combo 込み) を main に commit するため
      # App token を生成する。GITHUB_TOKEN 直 push は main 保護で GH006 silent reject
      # になる ([[feedback-omochairo-silent-push-reject]])。push は App token 経由。
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data google-auth google-auth-oauthlib google-api-python-client pyyaml

      - name: Fetch GA4 data
        env:
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          set -e
          DAYS="${INPUT_DAYS:-7}"
          if [ -z "$GA4_SA_JSON" ] || [ -z "$GA4_PROPERTY_ID" ]; then
            echo "::error::GA4_SA_JSON or GA4_PROPERTY_ID secret is not set"
            exit 1
          fi
          python scripts/fetch_ga4.py --days "$DAYS"

      - name: Fetch GSC data (optional)
        id: gsc
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          set +e
          DAYS="${INPUT_DAYS:-7}"
          if [ -z "$GSC_OAUTH_REFRESH_TOKEN" ] || [ -z "$GSC_SITE_URL" ]; then
            echo "::notice::GSC secrets not configured — skipping GSC fetch (Phase 1 only)"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/fetch_gsc.py --days "$DAYS"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::GSC fetch failed (rc=$rc) — continuing with GA4-only report"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build markdown summary
        id: summary
        run: |
          set -e
          python scripts/format_ga4_report.py --input data/analytics/ga4_weekly.json > /tmp/report.md
          if [ "${{ steps.gsc.outputs.available }}" = "true" ]; then
            echo "" >> /tmp/report.md
            echo "---" >> /tmp/report.md
            echo "" >> /tmp/report.md
            python scripts/format_gsc_report.py --input data/analytics/gsc_weekly.json \
              --label "navi.omcha.jp" >> /tmp/report.md
          fi
          START=$(python -c "import json; print(json.load(open('data/analytics/ga4_weekly.json'))['range']['start'])")
          END=$(python -c "import json; print(json.load(open('data/analytics/ga4_weekly.json'))['range']['end'])")
          echo "range_start=$START" >> "$GITHUB_OUTPUT"
          echo "range_end=$END" >> "$GITHUB_OUTPUT"
          echo "--- preview ---"
          head -60 /tmp/report.md
          echo "--- end ---"

      - name: Detect low-CTR pages (A-1, epic #1356)
        id: low_ctr
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_low_ctr_pages.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/low_ctr_pages.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT low-CTR pages"

      - name: Detect opportunity pages (A-2, epic #1356)
        id: opportunity
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_opportunity_pages.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/opportunity_pages.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT opportunity pages"

      - name: Suggest brand_taxonomy additions (A-6, epic #1356)
        id: brand_suggest
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/suggest_brand_taxonomy_additions.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/brand_taxonomy_suggestions.json'))['candidates']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT brand taxonomy candidates"

      - name: Suggest brand_taxonomy additions from catalog (P3, epic #2126)
        id: catalog_brand
        # 供給側 (カタログ) 起点なので GSC の有無に依存せず常に走らせる。
        continue-on-error: true
        run: |
          set -e
          python scripts/suggest_brand_taxonomy_from_catalog.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/catalog_brand_candidates.json'))['candidates']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT catalog brand candidates"

      - name: Detect query cannibalization (A-3, epic #1356)
        id: cannibal
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_cannibalization.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/cannibalization.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT cannibalization candidates"

      - name: Detect engagement drop (A-4, epic #1356)
        id: engagement_drop
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_engagement_drop.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/engagement_drop.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT engagement-drop pages"

      - name: Detect internal-link orphans (A-5, epic #1356)
        id: orphans
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_orphan_pages.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/orphan_pages.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "detected $COUNT orphan pages"

      - name: Classify query intent (A-7, epic #1356)
        id: query_intent
        if: steps.gsc.outputs.available == 'true'
        continue-on-error: true
        run: |
          set -e
          python scripts/detect_query_intent.py
          COUNT=$(python -c "import json; print(len(json.load(open('data/analytics/query_intent.json'))['detected']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "classified $COUNT pages by query intent"

      # #1329: gsc_weekly.json は by_combo (query×page) を含む。日次 JSONL history
      # (data/analytics/history/, #1357 B-0) は by_query/by_page 分離で combo を落とす
      # ため、14-brand-narrative への GSC クエリ注入 (page_path match) には使えない。
      # 週次窓 (7日) の gsc_weekly.json を data/analytics/gsc_history/<YYYY-Www>.json に
      # スナップショット保存し、App token + PR + auto-merge で main に積む
      # ([[feedback-omochairo-analytics-history-no-bycombo]])。
      # #1980: query_intent.json (A-7 分類結果) も build_post の CTA layout 切替が
      # 読む入力として同じコミットに相乗り (新規 step/PR パターンは作らない)。
      - name: Snapshot GSC weekly (by_combo) for #1329 + query intent for #1980
        if: steps.gsc.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          python - <<'PY'
          import json, pathlib, datetime
          d = json.load(open("data/analytics/gsc_weekly.json", encoding="utf-8"))
          end = (d.get("range") or {}).get("end")
          iso = datetime.date.fromisoformat(end).isocalendar()
          name = f"{iso[0]}-W{iso[1]:02d}"
          out = pathlib.Path("data/analytics/gsc_history") / f"{name}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding="utf-8")
          print("snapshot:", out)
          PY

          git add data/analytics/gsc_history/ || true
          if [ -f data/analytics/query_intent.json ]; then
            git add data/analytics/query_intent.json || true
          fi
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit (same week already accumulated?); skipping PR."
            exit 0
          fi

          # 既存 open gsc-snapshot PR があれば閉じる (週次重複防止)
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("gsc-snapshot/")) | .number' | while read -r pr_num; do
            if [ -n "$pr_num" ]; then
              echo "Closing old PR #$pr_num and deleting branch..."
              gh pr close "$pr_num" -d || true
            fi
          done

          BRANCH="gsc-snapshot/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data(analytics): GSC weekly snapshot (by_combo) for #1329 + query_intent for #1980"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(analytics): GSC weekly snapshot (by_combo) for #1329 + query_intent for #1980" \
            --body "Automated weekly snapshot of data/analytics/gsc_weekly.json (includes by_combo = query×page) under data/analytics/gsc_history/<YYYY-Www>.json, plus the current data/analytics/query_intent.json (A-7 classification, #1980 CTA layout switch input). The daily JSONL history (data/analytics/history/, #1357 B-0) splits by_query/by_page and drops the combo, which #1329 (GSC queries → 14-brand-narrative prompt, page_path match) needs. Refs #1329, #1980." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: analytics-weekly-${{ steps.summary.outputs.range_end }}
          path: |
            data/analytics/ga4_weekly.json
            data/analytics/gsc_weekly.json
            data/analytics/low_ctr_pages.json
            data/analytics/opportunity_pages.json
            data/analytics/brand_taxonomy_suggestions.json
            data/analytics/catalog_brand_candidates.json
            data/analytics/cannibalization.json
            data/analytics/engagement_drop.json
            data/analytics/orphan_pages.json
            data/analytics/query_intent.json
          retention-days: 90
          if-no-files-found: warn

      - name: Open rewrite Issues for low-CTR pages
        if: steps.low_ctr.outputs.count != '0' && steps.low_ctr.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_low_ctr_issues.py

      - name: Open opportunity Issues
        if: steps.opportunity.outputs.count != '0' && steps.opportunity.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_opportunity_issues.py

      - name: Open brand_taxonomy suggestion Issue
        if: steps.brand_suggest.outputs.count != '0' && steps.brand_suggest.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_brand_suggestion_issue.py

      - name: Open catalog brand Issue (P3, epic #2126)
        if: steps.catalog_brand.outputs.count != '0' && steps.catalog_brand.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_catalog_brand_issue.py

      - name: Open cannibalization Issues (A-3)
        if: steps.cannibal.outputs.count != '0' && steps.cannibal.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_cannibalization_issues.py

      - name: Open engagement-drop Issues (A-4)
        if: steps.engagement_drop.outputs.count != '0' && steps.engagement_drop.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_engagement_drop_issues.py

      - name: Open orphan-page Issues (A-5)
        if: steps.orphans.outputs.count != '0' && steps.orphans.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_orphan_issues.py

      - name: Open query-intent Issues (A-7)
        if: steps.query_intent.outputs.count != '0' && steps.query_intent.outputs.count != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python scripts/open_query_intent_issues.py

      - name: Create weekly Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RANGE_START: ${{ steps.summary.outputs.range_start }}
          RANGE_END: ${{ steps.summary.outputs.range_end }}
          GSC_AVAILABLE: ${{ steps.gsc.outputs.available }}
        run: |
          set -e
          if [ "$GSC_AVAILABLE" = "true" ]; then
            TITLE="Analytics weekly report ${RANGE_START} 〜 ${RANGE_END} (GA4+GSC)"
          else
            TITLE="GA4 weekly report ${RANGE_START} 〜 ${RANGE_END}"
          fi
          gh issue create \
            -R "${{ github.repository }}" \
            --title "$TITLE" \
            --label "analytics,observation" \
            --body-file /tmp/report.md

      # C-1 (#3988) / 対象 #3333: WP omcha.jp → navi.omcha.jp への文脈リンク追加を
      # 実施してよいかのゲート判定。この workflow は日曜 00:00 UTC に走るが、
      # 判定に使う data/analytics/history/gsc_index_census.jsonl は
      # 22-gsc-index-census.yml (日曜 22:00 UTC) が積む。つまり本 step は常に
      # "前週分" の census を読むことになる (最大 1 週間のラグ)。週次トレンドゲート
      # としてはこのラグは許容範囲 — 直近の 1 行が古くても、trend window
      # (既定直近3行) は依然として週次の推移を表す。
      # 読み取り専用の観察 step。新規 Issue/コメントは作らず、GITHUB_STEP_SUMMARY
      # に判定結果を追記するのみ (GitHub API バースト禁止規律)。
      - name: WP → navi link gate check (C-1, #3988 / 対象 #3333)
        continue-on-error: true
        run: |
          python scripts/check_wp_navi_link_gate.py >> "$GITHUB_STEP_SUMMARY"
