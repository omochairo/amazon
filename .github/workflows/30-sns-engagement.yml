name: SNS Engagement Publish (X + Threads non-link)
# Issue #1495 P1 (session 91):
#   - 毎日 1 本ずつ engagement_queue_x.jsonl / engagement_queue_threads.jsonl から
#     pop して X (Buffer) / Threads (Meta Graph) に non-link 投稿
#   - 20-sns-publish.yml の記事 URL 投稿と時間ズラし (12:30 JST 固定)
#   - queue 補充は 29-jules-engagement-refill.yml が Jules で行う
#
# cron: 03:30 UTC = 12:30 JST (お昼休みのリーチ取り)
on:
  workflow_dispatch:
    inputs:
      channels:
        description: '配信 channel (x / threads / both)'
        required: false
        type: choice
        options: [both, x, threads]
        default: both
      dry_run:
        description: 'preview のみ (API 叩かない / queue 触らない)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 3 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve channels
        id: resolve
        run: |
          CH="${{ inputs.channels }}"
          if [ -z "$CH" ] || [ "$CH" = "both" ]; then CH="x,threads"; fi
          echo "channels=$CH" >> "$GITHUB_OUTPUT"
          echo "Publishing to: $CH"

      - name: Publish engagement post
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          set -e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/notify_engagement.py --channels "${{ steps.resolve.outputs.channels }}" --dry-run
          else
            python scripts/notify_engagement.py --channels "${{ steps.resolve.outputs.channels }}" --live
          fi
        # 片方が失敗してももう片方は配信しておきたいので continue-on-error。
        # 失敗は ::warning:: に残し、queue 更新は notify_engagement.py が成功 channel
        # の分だけ in-place 書き戻すので、次回 cron で同 row を再選定はしない。
        continue-on-error: true

      - name: Commit queue updates via PR
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          git add data/engagement_queue_x.jsonl data/engagement_queue_threads.jsonl
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          BRANCH="sns-engagement-publish/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data: mark engagement drafts as published (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "data: mark engagement drafts published (run ${{ github.run_id }})" \
            --body "Engagement post bookkeeping (#1495). queue_x / queue_threads の published_at + post_id 更新。" \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled."
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi

      - name: Queue health check
        if: always()
        run: |
          set -e
          X_PENDING=$(python -c "import json,pathlib; \
            rows=[json.loads(l) for l in pathlib.Path('data/engagement_queue_x.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]; \
            print(sum(1 for r in rows if not r.get('published_at')))")
          TH_PENDING=$(python -c "import json,pathlib; \
            rows=[json.loads(l) for l in pathlib.Path('data/engagement_queue_threads.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]; \
            print(sum(1 for r in rows if not r.get('published_at')))")
          echo "Queue pending — X: $X_PENDING / Threads: $TH_PENDING"
          if [ "$X_PENDING" -lt 5 ] || [ "$TH_PENDING" -lt 5 ]; then
            echo "::notice::Queue low — schedule Jules refill via 29-jules-engagement-refill.yml"
          fi
