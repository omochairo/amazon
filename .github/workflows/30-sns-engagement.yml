name: SNS Engagement Publish (X + Threads + Bluesky non-link, 8-slot)
# Issue #1495 P1 (session 91) + Issue #1539 (session 94: 8 スロット化):
#   - X (Buffer) / Threads (Meta Graph) に 1 日 6 スロット non-link 投稿
#     (記事 URL 投稿スロット 11:00 / 20:00 JST は 20-sns-publish.yml が担当、変更なし)
#   - 各スロット時刻別に category (news / daily) を切替 (session 95 で順序変更:
#     記事を 07:00 に前出し、news を 11:00 以降へ後ろ倒し + 21:30 予備追加。
#     news は朝の 32→33 Jules パイプライン完了待ちなので午前遅め〜午後に寄せる):
#       07:00 JST  [article — 20-sns-publish.yml]
#       09:30 JST daily#1 | 11:00 JST news#1
#       13:00 JST news#2  | 15:00 JST daily#2
#       17:00 JST news#3  | 19:30 JST daily#3
#       20:00 JST  [article — 20-sns-publish.yml]
#       21:30 JST news#4 (予備 — 取りこぼし救済)
#   → 1 日 9 投稿/ch (news 4 + daily 3 + article 2)、2 ch で engagement は news4+daily3
#   - news スロット: category="news" AND created_at > now-48h で latest-first pick
#   - daily スロット: category="daily" で FIFO (古い順) pick + rotation 多様性ペナルティ
#   - queue 候補 0 件のスロットは穴開けで skip (健全)
#   - queue 補充は 29-jules-engagement-refill.yml (daily) + 33-jules-engagement-news.yml (news)
on:
  workflow_dispatch:
    inputs:
      channels:
        description: '配信 channel (x / threads / both)'
        required: false
        type: choice
        options: [both, x, threads]
        default: both
      category:
        description: 'category 強制 (空欄=now の JST 時刻で自動判定)'
        required: false
        type: choice
        options: ['', news, daily]
        default: ''
      dry_run:
        description: 'preview のみ (API 叩かない / queue 触らない)'
        required: false
        type: boolean
        default: false
  schedule:
    # news スロット (11/13/17/21:30 JST) — 朝の Jules news 生成完了を待てる時刻に配置
    - cron: '0 2 * * *'    # 11:00 JST (02:00 UTC)     news#1
    - cron: '0 4 * * *'    # 13:00 JST (04:00 UTC)     news#2
    - cron: '0 8 * * *'    # 17:00 JST (08:00 UTC)     news#3
    - cron: '30 12 * * *'  # 21:30 JST (12:30 UTC)     news#4 (予備)
    # daily スロット (09:30/15:00/19:30 JST)
    - cron: '30 0 * * *'   # 09:30 JST (00:30 UTC)     daily#1
    - cron: '0 6 * * *'    # 15:00 JST (06:00 UTC)     daily#2
    - cron: '30 10 * * *'  # 19:30 JST (10:30 UTC)     daily#3

# GITHUB_TOKEN の権限を明記する (#5045)。このレーンの書き込み (branch push /
# PR 作成 / auto-merge) は actions/create-github-app-token の App token で
# 行っており、GITHUB_TOKEN は checkout が読むだけ。宣言が無いとリポジトリ既定に
# 引きずられ、既定が write なら不要な書き込み権限を持って走り、read-only に
# 締めれば黙って壊れる。どちらの向きにも動かないよう固定する。
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve channels
        id: resolve
        run: |
          CH="${{ inputs.channels }}"
          if [ -z "$CH" ] || [ "$CH" = "both" ]; then CH="x,threads"; fi
          echo "channels=$CH" >> "$GITHUB_OUTPUT"
          echo "Publishing to: $CH"

      - name: Resolve slot category
        id: slot
        env:
          SCHED: ${{ github.event.schedule }}
          CAT_OVERRIDE: ${{ inputs.category }}
        run: |
          set -e
          # workflow_dispatch で category 指定があれば優先。
          # それ以外は github.event.schedule の cron 文字列から判定。
          # workflow_dispatch (空 category) は JST 時刻から推定する fallback。
          if [ -n "$CAT_OVERRIDE" ]; then
            CAT="$CAT_OVERRIDE"
            SRC="input"
          elif [ -n "$SCHED" ]; then
            case "$SCHED" in
              "0 2 * * *"|"0 4 * * *"|"0 8 * * *"|"30 12 * * *") CAT="news" ;;
              "30 0 * * *"|"0 6 * * *"|"30 10 * * *") CAT="daily" ;;
              *)
                echo "::warning::Unknown schedule '$SCHED', defaulting to daily"
                CAT="daily"
                ;;
            esac
            SRC="schedule($SCHED)"
          else
            # workflow_dispatch で category 未指定: JST 時刻で推定
            JST_HM=$(TZ=Asia/Tokyo date +%H%M)
            case "$JST_HM" in
              1100|1300|1700|2130) CAT="news" ;;
              *) CAT="daily" ;;
            esac
            SRC="JST_HM($JST_HM)"
          fi
          echo "category=$CAT" >> "$GITHUB_OUTPUT"
          echo "Slot category=$CAT (source=$SRC)"

      # Issue #4765: 配信済みマーカーの書き戻し PR がマージされないと、main 上は
      # published_at=null のままなので次スロットが同じ本文を再選定して二重投稿する
      # (2026-08-08 の #4715 滞留で Threads/X/Bluesky に実害)。publish 前に open な
      # sns-engagement-publish/* ブランチのマーカーを取り込んでおけば、PR がマージ
      # されなくても次の run が bookkeeping を引き継ぐので重複が起きない。
      - name: Absorb bookkeeping from stale publish PRs
        id: absorb
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          STALE=$(gh pr list --state open --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sns-engagement-publish/")) | "\(.number) \(.headRefName)"')
          if [ -z "$STALE" ]; then
            echo "No stale publish PRs."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Stale publish PRs:"; echo "$STALE"
          mkdir -p /tmp/absorb
          NUMS=""
          ARGS_X=""; ARGS_TH=""
          while read -r num branch; do
            [ -n "$num" ] || continue
            git fetch --no-tags origin "$branch"
            for q in x threads; do
              out="/tmp/absorb/${num}-${q}.jsonl"
              if git show "FETCH_HEAD:data/engagement_queue_${q}.jsonl" > "$out" 2>/dev/null; then
                if [ "$q" = "x" ]; then ARGS_X="$ARGS_X --source $out"; else ARGS_TH="$ARGS_TH --source $out"; fi
              fi
            done
            NUMS="$NUMS $num"
          done <<< "$STALE"
          python scripts/absorb_engagement_bookkeeping.py \
            --target data/engagement_queue_x.jsonl $ARGS_X
          python scripts/absorb_engagement_bookkeeping.py \
            --target data/engagement_queue_threads.jsonl $ARGS_TH
          echo "prs=$(echo $NUMS)" >> "$GITHUB_OUTPUT"

      - name: Publish engagement post
        id: publish
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          # X 投稿の Buffer mode 切替 (session 95): queue=addToQueue / now=shareNow 即時。
          # repo variable X_POST_MODE を now にするだけで即時配信へ切替 (未設定なら queue)。
          X_POST_MODE: ${{ vars.X_POST_MODE || 'queue' }}
          # Bluesky mirror (session 104): X と同じ engagement テキストを Bluesky にも流す。
          # secret 未設定なら notify_engagement 側で inert no-op (X は止めない)。
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          set -e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/notify_engagement.py \
              --channels "${{ steps.resolve.outputs.channels }}" \
              --category "${{ steps.slot.outputs.category }}" \
              --bluesky-mirror \
              --dry-run
          else
            python scripts/notify_engagement.py \
              --channels "${{ steps.resolve.outputs.channels }}" \
              --category "${{ steps.slot.outputs.category }}" \
              --bluesky-mirror \
              --live
          fi
        # queue 更新は notify_engagement.py が成功 channel の分だけ in-place 書き戻す
        # ので、失敗した channel の row は pending のまま残り再選定される。
        # continue-on-error は「後続の bookkeeping commit を落とさない」ためだけに要る
        # (両 channel の試行自体は notify_engagement.py が 1 プロセス内で完了させる)。
        #
        # #4791: ただし握りつぶしたままだと run が緑になり、実害が見えなくなる。
        # 2026-08-08 は Buffer が重複として拒否して x の daily 投稿が 0/3 になったが、
        # run は success のままだった。continue-on-error のステップは REST の
        # steps[].conclusion も success を返すので、run 一覧でも step 一覧でも見えない。
        # → bookkeeping を済ませたあとの "Surface publish failure" で run を赤にする。
        continue-on-error: true

      - name: Commit queue updates via PR
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          git add data/engagement_queue_x.jsonl data/engagement_queue_threads.jsonl
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
            exit 0
          fi
          BRANCH="sns-engagement-publish/${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data: mark engagement drafts as published (run ${{ github.run_id }} slot=${{ steps.slot.outputs.category }})"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "data: mark engagement drafts published (run ${{ github.run_id }} slot=${{ steps.slot.outputs.category }})" \
            --body "Engagement post bookkeeping (#1495 / #1539). slot=${{ steps.slot.outputs.category }} の published_at + post_id 更新。" \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled."
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi

          # 取り込み元の滞留 PR は、この PR が同じマーカーを含んでいるので close する
          # (#4765)。放置すると後続 run の再投稿で dirty 化してマージ不能になり、
          # stale-pr-sweeper (#4469) の滞留カウントだけが積み上がる。
          for n in ${{ steps.absorb.outputs.prs }}; do
            gh pr comment "$n" --body "Superseded by $PR_URL — この PR の published_at / post_id は取り込み済みです (#4765)。" || true
            gh pr close "$n" --delete-branch || echo "::warning::Could not close stale PR #$n"
          done

      # 閾値は scripts/check_engagement_queue_health.py 一箇所に置く。
      # 旧実装 (在庫の生数 news<2 / daily<5) は直近 30 run 中 28 run で発火しており、
      # 分布の中央付近に閾値があるゲート = 何も選別していなかった (#4791)。
      - name: Queue health check
        if: always()
        run: |
          python3 scripts/check_engagement_queue_health.py

      # #4791: bookkeeping を済ませてから、投稿が落ちていれば run を赤にする。
      # ここを最後に置くのは、成功した channel の published_at commit と
      # 滞留 PR の close (#4765) を先に完了させるため。
      - name: Surface publish failure
        if: always() && steps.publish.outcome == 'failure'
        run: |
          echo "::error::engagement post failed for at least one channel "\
          "(slot=${{ steps.slot.outputs.category }}, channels=${{ steps.resolve.outputs.channels }}). "\
          "失敗した channel の row は pending のまま残るので次回 cron で再試行されます。"
          exit 1
