name: Ensure Tag Slugs
# #2817 Phase 4: 新規タグ/ブランド用語の data/term_slugs.yaml 自動登録。
#
# 設計: 04-validate-article-pr.yml (required check) には一切手を入れない。
# main への push (data/articles/**.json または data/brand_taxonomy.yaml の
# 変更) をトリガーに、この push で追加/変更された記事 JSON の tags +
# brand_taxonomy.yaml の canonical 全件を scripts/ensure_tag_slugs.py でスキャンし、
# 未登録の用語があれば term_slugs.yaml に追記する。反映は他の fetch 系
# workflow (08-wiki-cache.yml 等) と同じ「ブランチ切って PR 作成 → auto-merge」
# パターン。main 直 push は GH006 で silent reject されるため使わない。
#
# App token (create-github-app-token) を使う理由: GITHUB_TOKEN で作成した PR は
# anti-recursion guard により後続の pull_request イベントを発火できず、
# required check `validate` (04-validate-article-pr.yml) が永久 pending になる
# ([[04-validate-paths-inverse-trap]] と同根)。他の同パターン workflow
# (01-fetch-products.yml 等) 踏襲。
on:
  push:
    branches: [main]
    paths:
      - 'data/articles/**.json'
      - 'data/brand_taxonomy.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensure-tag-slugs
  cancel-in-progress: false

jobs:
  ensure-tag-slugs:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List changed article JSON in this push
        id: list
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -e
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO_SHA" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'data/articles/*.json' | grep -v '\.\(quality\|enrichment\|seo\)\.json$' || true)
          else
            # workflow_dispatch や shallow history (force-push 等) では全件フォールバック
            files=$(ls data/articles/*.json 2>/dev/null | grep -v '\.\(quality\|enrichment\|seo\)\.json$' || true)
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure new tag/brand slugs registered
        id: ensure
        run: |
          set -e
          echo "${{ steps.list.outputs.files }}" | python scripts/ensure_tag_slugs.py
          # 2026-07-12 (#2893 follow-up): term_slugs.yaml への登録だけでは taxonomy term
          # ページの .Title/.LinkTitle が日本語正規名にならない (物理スタブ
          # hugo/content/tags/<slug>/_index.md が無いと Hugo は humanize した生スラッグを
          # 表示してしまう既知の癖がある)。generate_term_stubs.py は既存ディレクトリを
          # 上書きしない冪等スクリプトなので、登録の有無にかかわらず常に実行して安全に
          # 追いつかせる。
          python scripts/generate_term_stubs.py
          CHANGED=0
          git diff --quiet -- data/term_slugs.yaml || CHANGED=1
          # hugo/content/ は .gitignore 対象のため、新規スタブは git status --porcelain
          # では見えない (force-add 済みの既存ファイルは変更検知されるが新規untrackedは
          # 通常 diff に出ない)。新規作成有無は generate_term_stubs.py の標準出力の
          # created 件数で判定する方が確実だが、シンプルさ優先でディレクトリ差分を見る。
          if [ -n "$(git ls-files --others --exclude-standard -- hugo/content/tags hugo/content/brands 2>/dev/null)" ]; then
            CHANGED=1
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit, push and auto-merge if changed
        if: steps.ensure.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          BRANCH="tag-slugs/update-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add data/term_slugs.yaml
          # hugo/content/{tags,brands} は .gitignore 対象 (#2817 Phase 2 の一括生成時と
          # 同じく force-add が必須)。
          git add -f hugo/content/tags hugo/content/brands
          git commit -m "data(seo): register new tag/brand slugs + term stubs (#2817 Phase 4, run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "data(seo): register new tag/brand slugs + term stubs (run ${{ github.run_id }})" \
            --body "#2817 Phase 4: [scripts/ensure_tag_slugs.py](../blob/main/scripts/ensure_tag_slugs.py) が検出した新規タグ/ブランド用語の \`data/term_slugs.yaml\` 追記、および [scripts/generate_term_stubs.py](../blob/main/scripts/generate_term_stubs.py) による対応する term ページスタブ (JP表示名) の生成。Auto-generated by [21-ensure-tag-slugs.yml](.github/workflows/21-ensure-tag-slugs.yml) run ${{ github.run_id }}. Refs #2817, #2893."
          gh pr merge "$BRANCH" --auto --squash --delete-branch
