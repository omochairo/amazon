  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-article-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Resolve diff range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: diff current ref against origin/main so the dispatch
            # from 01-fetch-products.yml (data/raw-only branches) only validates the
            # branch's actual changes — not every article on main. fetch-depth: 0 above
            # already pulls full history.
            BASE=$(git rev-parse origin/main 2>/dev/null || git rev-parse main 2>/dev/null || echo "")
            HEAD=$(git rev-parse HEAD)
            if [ -n "$BASE" ] && [ "$BASE" != "$HEAD" ]; then
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "base=$BASE" >> "$GITHUB_OUTPUT"
              echo "head=$HEAD" >> "$GITHUB_OUTPUT"
            else
              # main itself or no base: full sweep
              echo "mode=full" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: List changed article JSON
        id: list
        run: |
          set -e
          if [ "${{ steps.range.outputs.mode }}" = "full" ]; then
            files=$(ls data/articles/*.json 2>/dev/null | grep -v '\.quality\.json$' || true)
          else
            files=$(git diff --name-only --diff-filter=AM \
                      "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
                      -- 'data/articles/*.json' \
                    | grep -v '\.quality\.json$' || true)
          fi
          if [ -z "$files" ]; then
            echo "No article JSON changes detected; nothing to validate."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed article JSON:"
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate against article.schema.json
        if: steps.list.outputs.files != ''
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Validating $f"
            if ! python scripts/validate_json.py --json "$f" --schema data/schema/article.schema.json; then
              fail=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.list.outputs.files }}"
          exit $fail

      # 2026-05-26 (session 61 / Issue #785): Creator API resources dry-run gate.
      # PR #761 が "offersV2.listings.deliveryInfo" を入れて Creator API が全 keyword
      # で 400 を返し fetch_amazon cron が死亡 (PR #783 で hotfix) した再発防止。
      # scripts/fetch_amazon.py / creators_api_client.py / fetch_amazon_dry_run.py を
      # 触る PR で実 API に 1 keyword × 1 item を投げ、HTTP 200 + items[] を確認する。
      # Quota 消費極小 (1 OAuth token + 1 searchItems / PR)。
      - name: Detect Creator API code changes
        id: detect_creators_changes
        if: steps.range.outputs.mode == 'diff'
        run: |
          set -e
          changed=$(git diff --name-only --diff-filter=AM \
                      "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
                      -- 'scripts/fetch_amazon.py' \
                         'scripts/creators_api_client.py' \
                         'scripts/fetch_amazon_dry_run.py' || true)
          if [ -n "$changed" ]; then
            echo "trigger=1" >> "$GITHUB_OUTPUT"
            echo "Files triggering Creator API dry-run gate:"
            echo "$changed"
          else
            echo "trigger=0" >> "$GITHUB_OUTPUT"
            echo "No fetch_amazon / creators_api_client / dry-run script changes; gate skipped."
          fi

      - name: Creator API resources dry-run gate (Issue #785)
        if: steps.detect_creators_changes.outputs.trigger == '1'
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python scripts/fetch_amazon_dry_run.py

      - name: Run quality gate (strict, changed only)
        if: steps.list.outputs.files != ''
        run: |
          set -e
          # quality_gate.py scans the full --src dir, so stage just the changed files
          tmp_src=$(mktemp -d)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            cp "$f" "$tmp_src/"
            # carry any pre-existing rendered markdown so MD-based checks can run
            base=$(basename "$f" .json)
            md="hugo/content/posts/${base}.md"
            [ -f "$md" ] || true
          done <<< "${{ steps.list.outputs.files }}"
          python scripts/quality_gate.py \
            --src "$tmp_src/" \
            --posts hugo/content/posts/ \
            --schema data/schema/article.schema.json \
            --strict
