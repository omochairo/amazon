name: Validate Article PR
# 2026-05-17 — fetch_amazon (01) が作る data/raw のみの auto-PR では `pull_request`
# イベントが発火しない (GITHUB_TOKEN 作成 PR の anti-recursion guard、
# pull_request_target も同じく抑制される)。代わりに 01 から workflow_dispatch で
# `gh workflow run "Validate Article PR" --ref <branch>` を呼ぶ運用にしている。
# 通常の Jules article PR は今まで通り `pull_request` で発火する。
on:
  # 2026-08-02 (#4384): paths フィルタを撤廃した。
  #
  # 以前はここに 224 件の allowlist があり、「validate を発火させたいファイル」を
  # 1 行ずつ登録していた。required check `validate` は paths に一致した PR でしか
  # 起動しないため、**登録を忘れたファイルだけを触る PR は check が永久に pending
  # のまま = マージ不能**になる (inverse-trap)。実際に PR #1133 / #2749 / #3329 /
  # #3676 / #4065 / #4381 / #4382 の 7 回踏んでおり、そのたびに 1 行足すか
  # `--admin` で branch protection をバイパスして凌いでいた。登録漏れは「新しい
  # script / 新しい出力先を足す」たびに再発するので、allowlist を育てる限り
  # 構造的に終わらない。
  #
  # 撤廃して安全な理由: 下の validate job は自分で base..head の差分を見て
  # `data/articles/*.json` が無ければ即 exit 0 し、後続 step も全て `if:` で
  # ガードされている。つまり無関係な PR は今までの vacuous SUCCESS と全く同じ
  # 経路を通る (実測 ~45 秒)。repo は public で Actions 分は無料。
  #
  # 判定を「起動するか」から「起動した上で何をするか」へ移したので、required
  # check は常に報告され、登録漏れという概念自体が無くなる。ここに paths を
  # 足し戻さないこと。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-article-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Resolve diff range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: diff current ref against origin/main so the dispatch
            # from 01-fetch-products.yml (data/raw-only branches) only validates the
            # branch's actual changes — not every article on main. fetch-depth: 0 above
            # already pulls full history.
            BASE=$(git rev-parse origin/main 2>/dev/null || git rev-parse main 2>/dev/null || echo "")
            HEAD=$(git rev-parse HEAD)
            if [ -n "$BASE" ] && [ "$BASE" != "$HEAD" ]; then
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "base=$BASE" >> "$GITHUB_OUTPUT"
              echo "head=$HEAD" >> "$GITHUB_OUTPUT"
            else
              # main itself or no base: full sweep
              echo "mode=full" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: List changed article JSON
        id: list
        run: |
          set -e
          # sidecar (記事本体でない派生 JSON) は article.schema.json の対象外。
          # コードベース正準の除外集合は (enrichment|quality|seo) — 例えば
          # scripts/notify_*.py / analyze_low_confidence_links.py / 03-invoke-jules.yml
          # は 3 種すべてを endswith 除外している。ここは以前 quality のみ除外で
          # .seo.json (#3332 N1/N3 レーンの sidecar) と .enrichment.json を取り
          # こぼし、schema 検証で 'slug' required エラーになって毎晩の data PR を
          # BLOCKED にしていた。新 sidecar 種別を足すときはこの集合も更新する。
          if [ "${{ steps.range.outputs.mode }}" = "full" ]; then
            files=$(ls data/articles/*.json 2>/dev/null | grep -vE '\.(enrichment|quality|seo)\.json$' || true)
          else
            files=$(git diff --name-only --diff-filter=AM \
                      "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
                      -- 'data/articles/*.json' \
                    | grep -vE '\.(enrichment|quality|seo)\.json$' || true)
          fi
          if [ -z "$files" ]; then
            echo "No article JSON changes detected; nothing to validate."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed article JSON:"
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # jules/ プロンプトは private repo (amazon-navi-brain) に分離済み。実行時に overlay checkout。
      #
      # 2026-08-12: この step を「記事 JSON が変更された PR」限定に後ろ倒しした。
      # 以前は steps の 2 番目で無条件に走っており、**secrets が渡らない PR で
      # `Input required and not supplied: token` で job ごと落ちていた**。
      # required check なので、落ちた PR は構造的にマージ不能になる。
      # 実際に #5051 で Dependabot を入れた直後、bump PR 4 本 (#5056〜#5059) が
      # これで一斉にブロックされた (fork からの PR も同じ経路で踏む)。
      #
      # ここを `if: secrets != ''` で条件化する案もあるが、それだと記事 PR が
      # fork から来たときに jules/ 無しで検証が進んでしまう。**記事の有無**で
      # ゲートするほうが、本物の記事 PR の検証を一切弱めずに済む
      # (Dependabot / 依存更新 / docs PR は data/articles/*.json を触らない)。
      #
      # なお 44-unit-tests.yml (#5054) は `secrets != ''` で条件化している。
      # あちらは pytest を回すので jules/ の有無が実際に効くレーンであり、
      # 「jules/ 無しでも 2,354 passed」という実測が根拠になっている。
      # こちらの job が走らせるのは validate_json.py / quality_gate.py /
      # fetch_amazon_dry_run.py の 3 本で、いずれも jules/ を読まない
      # (grep 済み)。将来 jules/ を要する step を足すならこの if: の下に置くこと。
      - name: Checkout prompt brain (private) into jules/
        if: steps.list.outputs.files != ''
        uses: actions/checkout@v7
        with:
          repository: omochairo/amazon-navi-brain
          token: ${{ secrets.NAVI_BRAIN_PAT }}
          path: jules

      - name: Validate against article.schema.json
        if: steps.list.outputs.files != ''
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "File not found (likely deleted or renamed), skipping validation: $f"
              continue
            fi
            echo "::group::Validating $f"
            if ! python scripts/validate_json.py --json "$f" --schema data/schema/article.schema.json; then
              fail=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.list.outputs.files }}"
          exit $fail

      # 2026-05-26 (session 61 / Issue #785): Creator API resources dry-run gate.
      # PR #761 が "offersV2.listings.deliveryInfo" を入れて Creator API が全 keyword
      # で 400 を返し fetch_amazon cron が死亡 (PR #783 で hotfix) した再発防止。
      # scripts/fetch_amazon.py / creators_api_client.py / fetch_amazon_dry_run.py を
      # 触る PR で実 API に 1 keyword × 1 item を投げ、HTTP 200 + items[] を確認する。
      # Quota 消費極小 (1 OAuth token + 1 searchItems / PR)。
      - name: Detect Creator API code changes
        id: detect_creators_changes
        if: steps.range.outputs.mode == 'diff'
        run: |
          set -e
          changed=$(git diff --name-only --diff-filter=AM \
                      "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
                      -- 'scripts/fetch_amazon.py' \
                         'scripts/creators_api_client.py' \
                         'scripts/fetch_amazon_dry_run.py' || true)
          if [ -n "$changed" ]; then
            echo "trigger=1" >> "$GITHUB_OUTPUT"
            echo "Files triggering Creator API dry-run gate:"
            echo "$changed"
          else
            echo "trigger=0" >> "$GITHUB_OUTPUT"
            echo "No fetch_amazon / creators_api_client / dry-run script changes; gate skipped."
          fi

      - name: Creator API resources dry-run gate (Issue #785)
        if: steps.detect_creators_changes.outputs.trigger == '1'
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python scripts/fetch_amazon_dry_run.py

      - name: Run quality gate (strict, changed only)
        if: steps.list.outputs.files != ''
        run: |
          set -e
          # quality_gate.py scans the full --src dir, so stage just the changed files
          tmp_src=$(mktemp -d)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            cp "$f" "$tmp_src/"
          done <<< "${{ steps.list.outputs.files }}"
          python scripts/quality_gate.py \
            --src "$tmp_src/" \
            --posts hugo/content/posts/ \
            --schema data/schema/article.schema.json \
            --strict
