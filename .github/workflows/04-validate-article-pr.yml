name: Validate Article PR
# 2026-05-17 — fetch_amazon (01) が作る data/raw のみの auto-PR では `pull_request`
# イベントが発火しない (GITHUB_TOKEN 作成 PR の anti-recursion guard、
# pull_request_target も同じく抑制される)。代わりに 01 から workflow_dispatch で
# `gh workflow run "Validate Article PR" --ref <branch>` を呼ぶ運用にしている。
# 通常の Jules article PR は今まで通り `pull_request` で発火する。
on:
  pull_request:
    paths:
      - 'data/articles/**.json'
      - 'data/raw/**'
      - 'data/schema/article.schema.json'
      # 2026-05-31: brand 正規化マスター。新規 alias/canonical 追加 PR を
      # validate (build_post smoke test) で必須 check として発火させる。
      - 'data/brand_taxonomy.yaml'
      - 'scripts/validate_json.py'
      - 'scripts/quality_gate.py'
      # β v5.0: テンプレ / build_post / CSS を触る PR も validate を必須 check として
      # 発火させる (workflow_dispatch では branch protection の required check に
      # ならないケースがあるため、pull_request 経由で確実に走らせる)。
      - 'scripts/build_post.py'
      # 2026-05-31: 分析専用 script (analyze_*) を触る PR も validate を経由
      # させる ([[04-validate-paths-trap]] / PR #1133 で踏んだ)。
      # 副作用なしの dry-run analyzer なので vacuous SUCCESS で通過する。
      - 'scripts/analyze_*.py'
      - 'scripts/score_calculator.py'
      - 'scripts/jules_article_engine.py'
      - 'scripts/templates/**'
      - 'hugo/assets/css/**'
      # 2026-05-25 (session 54): JS 共通化 (Issue #745 Phase 1) で
      # hugo/assets/js/** を触る PR も validate を必須 check として発火させる。
      - 'hugo/assets/js/**'
      # Jules プロンプト本体。CA 削除など Jules 出力に影響する変更を含む PR は
      # validate を pull_request 経由で発火させる (記事変更ゼロなら vacuous SUCCESS)
      - 'jules/PROMPT_TEMPLATE.md'
      # 2026-05-19 (session 29): fetch 系の workflow / script を触る PR も validate を
      # required check として発火させる ([[04-validate-paths-trap]] 対策)
      - '.github/workflows/01-fetch-products.yml'
      - 'scripts/fetch_amazon.py'
      - 'scripts/fetch_youtube.py'
      # 2026-05-26 (session 60 PR #786): Creator API クライアント本体を触る PR も
      # validate を required check として発火させる (PR #783 で paths 未登録の trap を
      # 踏み、validate run 起動せず auto-merge eligible でなくなる事例があった)。
      - 'scripts/creators_api_client.py'
      # 2026-05-26 (session 61 / Issue #785): Creator API dry-run gate スクリプト本体。
      # 自身の変更 PR でも validate を発火させ、gate が壊れていないかを確認する。
      - 'scripts/fetch_amazon_dry_run.py'
      # 2026-05-19 (session 32): backfill workflow も paths に追加。自身の bug fix /
      # 設定変更 PR を merge する際に validate (required check) を必ず通すため。
      - '.github/workflows/01b-backfill-competitors.yml'
      - '.github/workflows/02-publish.yml'
      # 2026-05-20 (session 37): news/books 関連の同定ロジックを触る PR も validate を
      # 必須 check として発火させる。
      - 'scripts/fetch_yahoo_news.py'
      - 'scripts/fetch_books.py'
      - 'scripts/filter_raw_per_asin.py'
      # 2026-05-20 (session 38): per-ASIN fetch 巡回の共有モジュール。
      - 'scripts/_fetch_targets.py'
      # 2026-05-24 (session 41): JAN/EAN マッチング (#660) で楽天/Yahoo クロス検索の
      # 同定ロジックを変更するため paths に追加。
      - 'scripts/fetch_cross_search.py'
      # 2026-05-24 (session 41 / Issue #674): omcha.jp 関連記事フェッチを
      # build_post から fetch 層に分離。01-fetch flow に乗る。
      - 'scripts/fetch_omcha_related.py'
      - 'scripts/internal_links.py'
      # 2026-05-24 (session 42 / Issue #600): 楽天ランキング → ASIN マッチング。
      # fetch_rakuten.py の拡張 PR が required check (validate) を取れるよう paths に追加。
      - 'scripts/fetch_rakuten.py'
      # 2026-05-24 (session 42 / Issue #600 PR3): 週次ランキング workflow と
      # 出力先 hugo/data/ranking/* を validate 対象に含める。
      - '.github/workflows/07-rakuten-ranking.yml'
      - 'hugo/data/ranking/**'
      # 2026-05-29 (Issue #810 Phase 1): 楽天ランキング未マッチ JAN → 新規 ASIN 解決
      # (案A) + sniper backfill workflow を validate (required check) 対象に含める。
      - 'scripts/resolve_ranking_asins.py'
      - 'scripts/tests/test_resolve_ranking_asins.py'
      - '.github/workflows/13-ranking-sniper.yml'
      # 2026-05-25 (session 43 / Issue #683 Phase 1): Wikipedia tooltip fetch 層を
      # validate (required check) に通すため paths に追加。
      - 'scripts/fetch_wiki_data.py'
      - 'scripts/tests/test_fetch_wiki_data.py'
      # 2026-05-25 (session 43 / Issue #683 Phase 3): Wikipedia tooltip cron workflow を
      # validate (required check) として発火させる。
      - '.github/workflows/08-wiki-cache.yml'
      - 'hugo/static/wiki_cache.json'
      # 2026-05-25 (session 44 / Issue #682): .gitignore 変更 PR で validate を
      # 発火させ required check を通す。
      - '.gitignore'
      - 'data/README.md'
      # 2026-05-25 (session 45 / PR #688): Wikipedia tooltip マッピング JSON。
      # /hugo gitignore trap で main 未 push だった wiki_mapping.json 追加 PR を
      # required check として走らせる。
      - 'hugo/data/wiki_mapping.json'
      # 2026-05-25 (session 46 / PR #693): hugo layouts / config.toml を触る UI 改善 PR を
      # required check として走らせる ([[04-validate-paths-trap]] 対策)
      - 'hugo/layouts/**'
      - 'hugo/config.toml'
      # 2026-05-25 (session 47 / Issue #590 PR-1): /cospa/ /deals/ 特集集計スクリプトと
      # 単体テストを validate 対象に含める。
      - 'scripts/build_feature_lists.py'
      - 'scripts/tests/test_build_feature_lists.py'
      # 2026-05-25 (session 47 / Issue #590 PR-2): /cospa/ /deals/ Hugo content + layout +
      # placeholder JSON。
      - 'hugo/content/cospa.md'
      - 'hugo/content/deals.md'
      - 'hugo/data/features/**'
      # 2026-05-25 (session 55 / Issue #745 follow-up): 知育スコア用語統一の一環で
      # /about-score/ 説明ページを新設、/privacy/ を併せて更新。両 top-level page を
      # validate (required check) として発火させる。
      - 'hugo/content/about-score.md'
      - 'hugo/content/privacy.md'
      # 2026-05-30 (#731 Part A PoC): /brands/<brand>/_index.md narrative
      # を validate (required check) として発火させる ([[04-validate-paths-trap]])。
      # 全 hugo/content/** を含めると Jules 記事 (/posts/) も拾ってしまうので、
      # brand hub 配下 (/brands/) と次の features/ で目的限定する。
      - 'hugo/content/brands/**'
      # 2026-05-25 (session 47 / Issue #590 PR-3): /cospa/ /deals/ 自動更新 workflow。
      # workflow 本体を触る PR も validate を required check として発火させる。
      - '.github/workflows/09-feature-lists.yml'
      # 2026-05-26 (session 63 / Issue #812): idle-slot rewrite 機構。
      # priority module + apply 層 + workflow 本体を触る PR で validate を発火。
      - 'scripts/select_rewrite_targets.py'
      - 'scripts/apply_rewrite_targets.py'
      - 'scripts/tests/test_select_rewrite_targets.py'
      - 'scripts/tests/test_apply_rewrite_targets.py'
      - '.github/workflows/12-rewrite-idle-fill.yml'
      # 2026-05-30 (Issue #722): link-report 集計 → 10-re-search auto-dispatch loop。
      # aggregate script + unit tests + 週次 workflow を validate (required check) 対象に。
      - 'scripts/aggregate_link_reports.py'
      - 'scripts/tests/test_aggregate_link_reports.py'
      - '.github/workflows/11-link-report-aggregate.yml'
      # 2026-05-30 (Issue #784): 送料無料判定を merchantInfo.name == Amazon 直販
      # に再設計したため unit test を validate (required check) 対象に。
      - 'scripts/tests/test_free_shipping.py'
      # 2026-05-30 (Issue #806): 低確度アフィリエイトリンク監査ツール
      # (scratch 永続化 + Phase 2 JAN backfill の前段) を required check 対象に。
      - 'scripts/analyze_low_confidence_links.py'
      - 'scripts/tests/test_analyze_low_confidence_links.py'
      - 'scripts/backfill_jan_codes.py'
      - 'scripts/tests/test_backfill_jan_codes.py'
      - '.github/workflows/15-backfill-jan-codes.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-article-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Resolve diff range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: diff current ref against origin/main so the dispatch
            # from 01-fetch-products.yml (data/raw-only branches) only validates the
            # branch's actual changes — not every article on main. fetch-depth: 0 above
            # already pulls full history.
            BASE=$(git rev-parse origin/main 2>/dev/null || git rev-parse main 2>/dev/null || echo "")
            HEAD=$(git rev-parse HEAD)
            if [ -n "$BASE" ] && [ "$BASE" != "$HEAD" ]; then
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "base=$BASE" >> "$GITHUB_OUTPUT"
              echo "head=$HEAD" >> "$GITHUB_OUTPUT"
            else
              # main itself or no base: full sweep
              echo "mode=full" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: List changed article JSON
        id: list
        run: |
          set -e
          if [ "${{ steps.range.outputs.mode }}" = "full" ]; then
            files=$(ls data/articles/*.json 2>/dev/null | grep -v '\.quality\.json$' || true)
          else
            files=$(git diff --name-only --diff-filter=AM \
                      "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
                      -- 'data/articles/*.json' \
                    | grep -v '\.quality\.json$' || true)
          fi
          if [ -z "$files" ]; then
            echo "No article JSON changes detected; nothing to validate."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed article JSON:"
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate against article.schema.json
        if: steps.list.outputs.files != ''
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Validating $f"
            if ! python scripts/validate_json.py --json "$f" --schema data/schema/article.schema.json; then
              fail=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.list.outputs.files }}"
          exit $fail

      # 2026-05-26 (session 61 / Issue #785): Creator API resources dry-run gate.
      # PR #761 が "offersV2.listings.deliveryInfo" を入れて Creator API が全 keyword
      # で 400 を返し fetch_amazon cron が死亡 (PR #783 で hotfix) した再発防止。
      # scripts/fetch_amazon.py / creators_api_client.py / fetch_amazon_dry_run.py を
      # 触る PR で実 API に 1 keyword × 1 item を投げ、HTTP 200 + items[] を確認する。
      # Quota 消費極小 (1 OAuth token + 1 searchItems / PR)。
      - name: Detect Creator API code changes
        id: detect_creators_changes
        if: steps.range.outputs.mode == 'diff'
        run: |
          set -e
          changed=$(git diff --name-only --diff-filter=AM \
                      "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
                      -- 'scripts/fetch_amazon.py' \
                         'scripts/creators_api_client.py' \
                         'scripts/fetch_amazon_dry_run.py' || true)
          if [ -n "$changed" ]; then
            echo "trigger=1" >> "$GITHUB_OUTPUT"
            echo "Files triggering Creator API dry-run gate:"
            echo "$changed"
          else
            echo "trigger=0" >> "$GITHUB_OUTPUT"
            echo "No fetch_amazon / creators_api_client / dry-run script changes; gate skipped."
          fi

      - name: Creator API resources dry-run gate (Issue #785)
        if: steps.detect_creators_changes.outputs.trigger == '1'
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python scripts/fetch_amazon_dry_run.py

      - name: Run quality gate (strict, changed only)
        if: steps.list.outputs.files != ''
        run: |
          set -e
          # quality_gate.py scans the full --src dir, so stage just the changed files
          tmp_src=$(mktemp -d)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp "$f" "$tmp_src/"
            # carry any pre-existing rendered markdown so MD-based checks can run
            base=$(basename "$f" .json)
            md="hugo/content/posts/${base}.md"
            [ -f "$md" ] || true
          done <<< "${{ steps.list.outputs.files }}"
          python scripts/quality_gate.py \
            --src "$tmp_src/" \
            --posts hugo/content/posts/ \
            --schema data/schema/article.schema.json \
            --strict
