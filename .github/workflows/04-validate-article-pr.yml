name: Validate Article PR
# 2026-05-17 — fetch_amazon (01) が作る data/raw のみの auto-PR では `pull_request`
# イベントが発火しない (GITHUB_TOKEN 作成 PR の anti-recursion guard、
# pull_request_target も同じく抑制される)。代わりに 01 から workflow_dispatch で
# `gh workflow run "Validate Article PR" --ref <branch>` を呼ぶ運用にしている。
# 通常の Jules article PR は今まで通り `pull_request` で発火する。
on:
  pull_request:
    paths:
      - 'data/articles/**.json'
      - 'data/raw/**'
      - 'data/schema/article.schema.json'
      # 2026-05-31: brand 正規化マスター。新規 alias/canonical 追加 PR を
      # validate (build_post smoke test) で必須 check として発火させる。
      - 'data/brand_taxonomy.yaml'
      - 'scripts/validate_json.py'
      - 'scripts/quality_gate.py'
      # β v5.0: テンプレ / build_post / CSS を触る PR も validate を必須 check として
      # 発火させる (workflow_dispatch では branch protection の required check に
      # ならないケースがあるため、pull_request 経由で確実に走らせる)。
      - 'scripts/build_post.py'
      # Issue #1494: OG image (1200x630) 生成 helper。build_post から呼ばれる。
      # 本体変更時 validate を required check として発火させる ([[04-validate-paths-trap]])。
      - 'scripts/build_og_image.py'
      # 2026-05-31 (Issue #677): build_manifest.json 出力の smoke test と
      # score_calculator media-exposure counter test を validate (required check) に。
      - 'scripts/tests/test_build_post_manifest.py'
      - 'scripts/tests/test_build_post_reviewer.py'
      - 'scripts/tests/test_score_calculator.py'
      # 2026-05-31: 分析専用 script (analyze_*) を触る PR も validate を経由
      # させる ([[04-validate-paths-trap]] / PR #1133 で踏んだ)。
      # 副作用なしの dry-run analyzer なので vacuous SUCCESS で通過する。
      - 'scripts/analyze_*.py'
      - 'scripts/score_calculator.py'
      - 'scripts/jules_article_engine.py'
      - 'scripts/templates/**'
      - 'hugo/assets/css/**'
      # 2026-05-25 (session 54): JS 共通化 (Issue #745 Phase 1) で
      # hugo/assets/js/** を触る PR も validate を必須 check として発火させる。
      - 'hugo/assets/js/**'
      # 2026-06-01 (Issue #1263): SEO/E-E-A-T/PWA メタデータ強化で config.toml /
      # layouts (head.html / extend_head.html) / static (site.webmanifest / favicon.ico)
      # を触る PR も validate を必須 check として発火させる ([[04-validate-paths-trap]])。
      - 'hugo/config.toml'
      - 'hugo/layouts/**'
      - 'hugo/static/**'
      # 2026-06-01 (session 74): taxonomy term の _index.md (例: brands/_index.md)
      # を触る PR も validate を required check として発火させる
      # ([[04-validate-paths-trap]])。
      - 'hugo/content/**'
      # Jules プロンプト本体。CA 削除など Jules 出力に影響する変更を含む PR は
      # validate を pull_request 経由で発火させる (記事変更ゼロなら vacuous SUCCESS)
      - 'jules/PROMPT_TEMPLATE.md'
      # 2026-06-08 (session 113): Jules 規律本体。提出フロー/データ偽装禁止など
      # Jules 挙動に影響する変更を含む PR も validate を発火させる。paths 未登録だと
      # inverse trap で validate 不発火→auto-merge 永久 BLOCKED ([[04-validate-paths-inverse-trap]])。
      - 'AGENTS.md'
      # 2026-05-19 (session 29): fetch 系の workflow / script を触る PR も validate を
      # required check として発火させる ([[04-validate-paths-trap]] 対策)
      - '.github/workflows/01-fetch-products.yml'
      # 2026-05-31 (#731 Part A): brand narrative cron workflow を触る PR も
      # validate を required check として発火させる (vacuous SUCCESS)。
      - '.github/workflows/14-brand-narrative.yml'
      # 2026-05-31 (#1198): Jules daily cap 等で 03-invoke-jules を触る PR も
      # validate を required check として発火させる (vacuous SUCCESS)。
      - '.github/workflows/03-invoke-jules.yml'
      # 2026-05-31 (#1200): Jules daily report workflow / script を触る PR も
      # validate を required check として発火させる (vacuous SUCCESS)。
      - '.github/workflows/16-jules-daily-report.yml'
      - 'scripts/report_jules_usage.py'
      # 2026-06-04 (#1353): Jules session live 集計 script (PR #1602 で追加)。
      # paths 未登録だと inverse trap で validate 不発火→auto-merge 永久 BLOCKED
      # になるため登録 ([[04-validate-paths-inverse-trap]])。記事変更ゼロで vacuous SUCCESS。
      - 'scripts/report_jules_sessions.py'
      # 2026-06-04 (#1600 Phase 1): per_asin 第三者情報量スコア。03-invoke-jules の
      # ASIN 選定 defer + prompt 注記で使う。paths 未登録だと inverse trap で
      # validate 不発火→auto-merge 永久 BLOCKED になるため登録 ([[04-validate-paths-inverse-trap]])。
      - 'scripts/score_per_asin_info.py'
      - 'scripts/tests/test_score_per_asin_info.py'
      # 2026-06-04 (#1600 Phase 2): Google CSE で非販売第三者ソースを pre-fetch する
      # script + test + cron workflow。paths 未登録だと inverse trap で validate 不発火。
      - 'scripts/fetch_third_party_sources.py'
      - 'scripts/tests/test_fetch_third_party_sources.py'
      - '.github/workflows/34-third-party-sources.yml'
      - 'scripts/fetch_amazon.py'
      - 'scripts/fetch_youtube.py'
      # 2026-05-26 (session 60 PR #786): Creator API クライアント本体を触る PR も
      # validate を required check として発火させる (PR #783 で paths 未登録の trap を
      # 踏み、validate run 起動せず auto-merge eligible でなくなる事例があった)。
      - 'scripts/creators_api_client.py'
      # 2026-05-26 (session 61 / Issue #785): Creator API dry-run gate スクリプト本体。
      # 自身の変更 PR でも validate を発火させ、gate が壊れていないかを確認する。
      - 'scripts/fetch_amazon_dry_run.py'
      # 2026-05-19 (session 32): backfill workflow も paths に追加。自身の bug fix /
      # 設定変更 PR を merge する際に validate (required check) を必ず通すため。
      - '.github/workflows/01b-backfill-competitors.yml'
      - '.github/workflows/02-publish.yml'
      # 2026-05-20 (session 37): news/books 関連の同定ロジックを触る PR も validate を
      # 必須 check として発火させる。
      - 'scripts/fetch_yahoo_news.py'
      - 'scripts/fetch_books.py'
      # 2026-05-31 (Issue #503 / #560): books query 戦略 + NG フィルタの unit test
      # も validate (required check) 対象に。
      - 'scripts/tests/test_fetch_books_query.py'
      - 'scripts/filter_raw_per_asin.py'
      # 2026-05-20 (session 38): per-ASIN fetch 巡回の共有モジュール。
      - 'scripts/_fetch_targets.py'
      # 2026-05-24 (session 41): JAN/EAN マッチング (#660) で楽天/Yahoo クロス検索の
      # 同定ロジックを変更するため paths に追加。
      - 'scripts/fetch_cross_search.py'
      # 2026-05-24 (session 41 / Issue #674): omcha.jp 関連記事フェッチを
      # build_post から fetch 層に分離。01-fetch flow に乗る。
