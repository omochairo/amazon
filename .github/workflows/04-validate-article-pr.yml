name: Validate Article PR
# 2026-05-17 — fetch_amazon (01) が作る data/raw のみの auto-PR では `pull_request`
# イベントが発火しない (GITHUB_TOKEN 作成 PR の anti-recursion guard、
# pull_request_target も同じく抑制される)。代わりに 01 から workflow_dispatch で
# `gh workflow run "Validate Article PR" --ref <branch>` を呼ぶ運用にしている。
# 通常の Jules article PR は今まで通り `pull_request` で発火する。
on:
  pull_request:
    paths:
      - 'data/articles/**.json'
      - 'data/raw/**'
      - 'data/schema/article.schema.json'
      - 'scripts/validate_json.py'
      - 'scripts/quality_gate.py'
      # β v5.0: テンプレ / build_post / CSS を触る PR も validate を必須 check として
      # 発火させる (workflow_dispatch では branch protection の required check に
      # ならないケースがあるため、pull_request 経由で確実に走らせる)。
      - 'scripts/build_post.py'
      - 'scripts/templates/**'
      - 'hugo/assets/css/**'
      # Jules プロンプト本体。CA 削除など Jules 出力に影響する変更を含む PR は
      # validate を pull_request 経由で発火させる (記事変更ゼロなら vacuous SUCCESS)
      - 'jules/PROMPT_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-article-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Resolve diff range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: diff current ref against origin/main so the dispatch
            # from 01-fetch-products.yml (data/raw-only branches) only validates the
            # branch's actual changes — not every article on main. fetch-depth: 0 above
            # already pulls full history.
            BASE=$(git rev-parse origin/main 2>/dev/null || git rev-parse main 2>/dev/null || echo "")
            HEAD=$(git rev-parse HEAD)
            if [ -n "$BASE" ] && [ "$BASE" != "$HEAD" ]; then
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "base=$BASE" >> "$GITHUB_OUTPUT"
              echo "head=$HEAD" >> "$GITHUB_OUTPUT"
            else
              # main itself or no base: full sweep
              echo "mode=full" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: List changed article JSON
        id: list
        run: |
          set -e
          if [ "${{ steps.range.outputs.mode }}" = "full" ]; then
            files=$(ls data/articles/*.json 2>/dev/null | grep -v '\.quality\.json$' || true)
          else
            files=$(git diff --name-only --diff-filter=AM \
                      "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}" \
                      -- 'data/articles/*.json' \
                    | grep -v '\.quality\.json$' || true)
          fi
          if [ -z "$files" ]; then
            echo "No article JSON changes detected; nothing to validate."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed article JSON:"
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate against article.schema.json
        if: steps.list.outputs.files != ''
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Validating $f"
            if ! python scripts/validate_json.py --json "$f" --schema data/schema/article.schema.json; then
              fail=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.list.outputs.files }}"
          exit $fail

      - name: Run quality gate (strict, changed only)
        if: steps.list.outputs.files != ''
        run: |
          set -e
          # quality_gate.py scans the full --src dir, so stage just the changed files
          tmp_src=$(mktemp -d)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp "$f" "$tmp_src/"
            # carry any pre-existing rendered markdown so MD-based checks can run
            base=$(basename "$f" .json)
            md="hugo/content/posts/${base}.md"
            [ -f "$md" ] || true
          done <<< "${{ steps.list.outputs.files }}"
          python scripts/quality_gate.py \
            --src "$tmp_src/" \
            --posts hugo/content/posts/ \
            --schema data/schema/article.schema.json \
            --strict
