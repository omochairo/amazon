name: GSC Index Census (URL Inspection API)

# 柱0 #2701 P4 (効果測定) — sitemap の products/ を URL Inspection API で全数調査し、
# index 実態 (coverageState 別) を data/analytics/gsc_index_census.json に記録する。
#
# なぜ必要か:
#   #2701 P1〜P3 (sitemap から noindex 1832 件を除外) の効果は、GSC 管理画面の
#   Coverage レポートを人間が目視するしか手段がないとされ 3 週間以上判定不能だった。
#   URL Inspection API は URL 単位で coverageState を返すため、curated な products/
#   が実際に index されたかを機械的に測れる。集計版 Coverage レポートの完全な代替では
#   ないが、#2701 が測りたい「送信済み sitemap のうち何件 index されたか」には答えられる。
#
# 設計判断:
#   - cron: 週次 (日次だと変化が観測できずクォータを焼くだけ)
#   - URL Inspection API のクォータは 2000/日/プロパティ。products は現状 1532 件で
#     全数調査が 1 日枠に収まる。--limit 1800 で安全マージンを取る
#   - 副作用ゼロの read-only fetch + commit-back のみ (fetch_gsc.py と同じ観察フェーズ)
#   - commit-back は App token + PR + auto-merge (main protection 回避。
#     18-analytics-daily.yml と同パターン)
#   - secrets 未設定なら skip して空 run で終了 (壊さない)
#   - #3372: 手動 workflow_dispatch は前回成功 run からクォータリセットウィンドウを
#     跨いだか pre-flight で確認し、跨いでいなければ install 前にブロックする
#     (force=true で override 可)。加えてスクリプト側に circuit breaker があり、
#     ガードをすり抜けても連続 429 で早期打ち切りする (二段構え)
#
# 必須 secrets:
#   - APP_ID, APP_PRIVATE_KEY   (commit-back 用 App token)
#   - GSC_OAUTH_CLIENT_ID / GSC_OAUTH_CLIENT_SECRET / GSC_OAUTH_REFRESH_TOKEN
#   - GSC_SITE_URL

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '検査する URL 数の上限 (0=無制限。クォータ 2000/日に注意)'
        required: false
        default: '1800'
      force:
        description: '前回成功 run からクォータリセットウィンドウ (Pacific深夜≈UTC07:00) を跨いでいなくても強制実行する (#3372)'
        required: false
        default: 'false'
  schedule:
    # 毎週月曜 07:00 JST = 22:00 UTC (日曜)。18-analytics-daily (21:00 UTC) と 1h ずらす
    - cron: '0 22 * * 0'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gsc-index-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    # 2026-07-16 実測: URL Inspection API は 1 URL 6-7 秒。逐次では 1500 件で 3 時間近くかかり
    # 60 分 timeout で落ちた (run 29499392320)。並列化 (--workers) して ~15-20 分想定だが、
    # API のレート次第で伸びるため timeout は実測の 3 倍以上を確保しておく
    timeout-minutes: 120
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      # #3372: 直近の成功 run からクォータリセットウィンドウ (Pacific深夜≈UTC07:00) を
      # 跨いでいない手動再実行を検知してブロックする。stdlib のみで完結するため
      # google-* の pip install より前に置き、ブロック時は無駄な install も省く
      - name: Pre-flight quota window guard
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "::notice::force=true — skipping quota window guard (#3372)"
            exit 0
          fi
          python scripts/inspect_gsc_index.py --preflight-check --out data/analytics/gsc_index_census.json

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Inspect index coverage
        id: census
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          set +e
          # #4793: secret 未設定は緑で skip しない。週次レーンなので、失効に
          # 気付くまでの空白がそのまま census の欠測になる。inspect 失敗
          # (rc != 0) は一時的な API 失敗なので下の warning のまま残す。
          if [ -z "$GSC_OAUTH_REFRESH_TOKEN" ] || [ -z "$GSC_SITE_URL" ]; then
            echo "::error::required secret not set — GSC_OAUTH_REFRESH_TOKEN / GSC_SITE_URL"
            exit 1
          fi
          python scripts/inspect_gsc_index.py --limit "${{ github.event.inputs.limit || '1800' }}"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::GSC index census failed (rc=$rc)"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Summarize to job log
        if: steps.census.outputs.available == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("data/analytics/gsc_index_census.json").read_text(encoding="utf-8"))
          t = d["totals"]
          cb = d.get("circuit_breaker", {})
          print("## GSC Index Census (#2701 P4)\n")
          if cb.get("tripped"):
              print(f"> ⚠️ **circuit breaker が発動し、途中で打ち切りました** (連続クォータエラー閾値={cb.get('threshold')}件)。データは部分的です (#3372)\n")
          print(f"- 対象: `{d['prefix']}` / sitemap {t['sitemap_urls']} 件中 {t['inspected']} 件を検査")
          rate = (t["indexed"] / t["inspected"] * 100) if t["inspected"] else 0.0
          print(f"- **index 済み: {t['indexed']} / {t['inspected']} ({rate:.1f}%)**")
          print(f"- 未 index: {t['not_indexed']} / エラー: {t['errors']}\n")
          print("### coverageState 別\n")
          print("| coverageState | 件数 |\n|---|---:|")
          for k, v in d["by_coverage_state"].items():
              print(f"| {k} | {v} |")
          # #5085: リッチリザルトの現況。richResultsResult は元から同じ API
          # レスポンスに入っており、拾うのに追加の呼び出しは発生しない。
          rv = d.get("by_rich_verdict") or {}
          if rv:
              print("")
              print("### リッチリザルト (#5085)")
              print("")
              print("- verdict: " + " / ".join(f"{k}={v}" for k, v in rv.items()))
              rt = d.get("by_rich_type") or {}
              print("- 検出された種別: " + (
                  " / ".join(f"{k}={v}" for k, v in rt.items()) or "**なし**"))
              issues = d.get("rich_issues") or {}
              if issues:
                  print("")
                  print("| 課題 | 件数 |")
                  print("|---|---:|")
                  for k, v in issues.items():
                      print(f"| {k} | {v} |")
              else:
                  print("- 課題: なし")
          PY

      # B-3 (#3988): census は毎週上書きされる単一スナップショットのため、
      # #3331/#3333 の効果判定に使える時系列を history/ に別途蓄積する
      - name: Append census to history
        if: steps.census.outputs.available == 'true'
        run: |
          python -m scripts.append_census_history

      - name: Create census PR + auto-merge
        if: steps.census.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e

          # checkout -b の前に変更有無を判定する (staged 状態で checkout -b すると
          # 一部ファイルが失われることがあるため、branch 作成前は git add しない)
          if ! git status --porcelain -- data/analytics/gsc_index_census.json data/analytics/history/gsc_index_census.jsonl data/analytics/history/census_url_states.json | grep -q .; then
            echo "No census changes to commit; skipping PR."
            exit 0
          fi

          # 既存 open census PR があれば閉じる (週次重複防止)
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("gsc-index-census/")) | .number' | while read -r pr_num; do
            if [ -n "$pr_num" ]; then
              echo "Closing old PR #$pr_num and deleting branch..."
              gh pr close "$pr_num" -d || true
            fi
          done

          BRANCH="gsc-index-census/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/analytics/gsc_index_census.json
          # history 側は append がスキップされた場合 (census に fetched_at が無い等) に
          # 未作成でありうる。その 1 ファイルの欠如で census 本体のコミットまで
          # 落とさないよう、こちらだけ寛容に add する
          git add data/analytics/history/gsc_index_census.jsonl 2>/dev/null || true
          # census_url_states.json (#2687): コホート遷移計算用の前回スナップショット。
          # これを add し忘れると新規データが自動 PR に載らず、次回 run の遷移計算が
          # 永久に初回状態のまま (previous_date=None) になってしまう
          git add data/analytics/history/census_url_states.json 2>/dev/null || true
          git commit -m "data(analytics): GSC index census (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data(analytics): GSC index census (run ${{ github.run_id }})" \
            --body "URL Inspection API による products/ の index 実態の週次全数調査。#2701 P4 (効果測定) の判定材料。read-only fetch のみで記事本文・URL 構造は不変。Refs #2701." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        # #4793: continue-on-error を外した。auto-merge の有効化だけは上の
        # if/else で握りつぶしてあるので、ここに残っていたのは **git push と
        # gh pr create の失敗** を飲む効果だけだった。それが落ちるとその run の
        # データ更新が丸ごと消えるのに、continue-on-error のステップは REST の
        # steps[].conclusion も success を返すため run 一覧でも step 一覧でも
        # 見えない (#4793 項目2 の方針 (c))。01 / 19 で 08-18〜08-24 の連続
        # グリーンを確認したうえで残り 8 本へ広げたもの。
