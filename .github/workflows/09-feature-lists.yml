name: Feature Lists (fallback commit lane / 通常は配信ビルドが毎回再生成)
# Issue #590 PR-3: /cospa/ 月次 + /deals/ 週次 の特集ページに自動生成データを反映する
# 専用 workflow。scripts/build_feature_lists.py で data/articles/*.json と
# data/raw/per_asin/<ASIN>/amazon.json を集計し、hugo/data/features/{cospa,deals}.json
# と data/features/_build_manifest.json を更新する PR を App token で起票して
# auto-merge する。
#
# 構成: 単一 job で常に cospa と deals の両方を再生成する (build_feature_lists.py が
# 両方を一気に出力するため)。cron は cospa 用 (月次) と deals 用 (週次) の 2 種類を
# 並べる。実際の hugo build は data に変化があった日だけ走るので、毎週 cospa を
# 再計算しても無駄にはならない。
#
# trap 対応 (memory):
# - hugo/ は .gitignore 対象のため git add -f で強制 stage
# - main 保護下の git-auto-commit-action は GH006 silent reject になるので使わず
#   App token + 通常の git commit + gh pr create で PR を経由させる
# - APP token は actions/create-github-app-token で発行 (peter-evans/create-pr では
#   validate が発火しない trap を避ける)
# 2026-07-26 (#4007): cron を撤去した。/deals/ /cospa/ と hub は
# .gitlab-ci.yml の pages job (配信ビルド) が build_feature_lists.py /
# build_category_hubs.py を毎回走らせるビルド時派生になったため、cron で
# 週次/月次に commit する必要がなくなった (cron の方が遅く、ページが入力
# データより古くなる原因だった)。
# この workflow は commit 済み fallback の更新と data/features/_build_manifest.json
# (pool サイズ・drop 理由の観測用 / #677) の採取のために手動起動で残す。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: feature-lists
  cancel-in-progress: false

jobs:
  publish-features:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build feature lists (cospa + deals)
        run: |
          python scripts/build_feature_lists.py \
            --articles-dir data/articles \
            --per-asin-dir data/raw/per_asin \
            --raw-root data/raw \
            --out-hugo hugo/data/features \
            --out-manifest data/features/_build_manifest.json \
            --top-n 20

      - name: Build category hubs (#2687 柱1 — テーマ別 + 年齢別)
        run: |
          # --themes / --age-hubs は既定で全件生成 (テーマ english/programming/math
          # + 年齢 age-0/1/2/3/4/6)。
          python scripts/build_category_hubs.py \
            --articles-dir data/articles \
            --out-hugo hugo/data/features \
            --raw-root data/raw \
            --top-n 24

      - name: Create feature lists update PR + enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e

          # /hugo は gitignore 対象のため -f で強制 stage する。
          git add -f hugo/data/features/cospa.json hugo/data/features/deals.json || true
          # #2687 柱1: テーマ別 category hub データ。
          git add -f hugo/data/features/english.json \
                     hugo/data/features/programming.json \
                     hugo/data/features/math.json || true
          # #2687 柱1: 年齢別 category hub データ (lineup 全ラインナップ節を含む)。
          git add -f hugo/data/features/age-0.json \
                     hugo/data/features/age-1.json \
                     hugo/data/features/age-2.json \
                     hugo/data/features/age-3.json \
                     hugo/data/features/age-4.json \
                     hugo/data/features/age-6.json || true
          # #2687 柱1 Slice C: info hub 相互リンクの単一 source of truth。
          git add -f hugo/data/features/hub_index.json || true
          git add data/features/_build_manifest.json || true

          if git diff --cached --quiet; then
            echo "No feature list changes to commit; skipping PR creation."
            exit 0
          fi

          # 既存 open の自動 feature-lists PR があれば閉じる (週次重複防止)。
          echo "Checking for old automated feature-lists PRs..."
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("feature-lists/")) | .number' | while read -r pr_num; do
            if [ -n "$pr_num" ]; then
              echo "Closing old PR #$pr_num and deleting branch..."
              gh pr close "$pr_num" -d || true
            fi
          done

          BRANCH="feature-lists/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "data: refresh /cospa/ + /deals/ feature lists (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "data: refresh /cospa/ + /deals/ feature lists (run ${{ github.run_id }})" \
            --body "Automated refresh of \`hugo/data/features/cospa.json\` and \`hugo/data/features/deals.json\` by \`scripts/build_feature_lists.py\` (workflow run ${{ github.run_id }}). 通常は配信ビルド (.gitlab-ci.yml pages job) が毎デプロイ再生成するため、これは commit 済み fallback の更新と _build_manifest.json 採取用の手動レーン。Refs #590 #4007." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        # #4793: continue-on-error を外した。auto-merge の有効化だけは上の
        # if/else で握りつぶしてあるので、ここに残っていたのは **git push と
        # gh pr create の失敗** を飲む効果だけだった。それが落ちるとその run の
        # データ更新が丸ごと消えるのに、continue-on-error のステップは REST の
        # steps[].conclusion も success を返すため run 一覧でも step 一覧でも
        # 見えない (#4793 項目2 の方針 (c))。01 / 19 で 08-18〜08-24 の連続
        # グリーンを確認したうえで残り 8 本へ広げたもの。
