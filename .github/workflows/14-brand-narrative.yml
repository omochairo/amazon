name: Generate Brand Narrative

# #731 epic — automate Part A narrative coverage for the 28 long-tail brands
# (manual narratives for レゴ / タカラトミー are protected by auto_generated:false
# in their _index.md frontmatter).
#
# Flow:
# 1. scripts/select_brand_narrative_target.py picks 1 brand (no _index.md yet,
#    or oldest auto_generated:true). Exits 2 = nothing to do.
# 2. Build Jules prompt from jules/BRAND_NARRATIVE_PROMPT.md + selector vars.
# 3. Jules session with AUTO_CREATE_PR — the session creates the PR itself,
#    same plumbing as 03-invoke-jules.
# 4. NO auto-merge. The user reviews each narrative PR before it goes live
#    (Jules hallucination on unfamiliar brands would otherwise reach prod).
#
# Cadence: weekly on Monday, 03:00 UTC (= 12:00 JST). Accelerated from monthly
# in session 109 (#731 closeout): 16/38 active brands already have live
# narratives generated this way and quality has proven consistent, so the slow
# monthly trickle is no longer warranted. ~22 eligible brands remain → ~5.5
# months to full coverage at 1 PR/week. NO auto-merge is retained — each PR is
# still reviewed by hand before going live.

on:
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      brand:
        description: 'Force a specific brand name (overrides selector). Must already be in hugo/data/brand_hub.json with count>=3.'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      # jules/ プロンプトは private repo (amazon-navi-brain) に分離済み。実行時に overlay checkout。
      - name: Checkout prompt brain (private) into jules/
        uses: actions/checkout@v6
        with:
          repository: omochairo/amazon-navi-brain
          token: ${{ secrets.NAVI_BRAIN_PAT }}
          path: jules

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # brand_normalizer.py が yaml を import する。requirements.txt には居ないので
      # 単独 install (この workflow 以外は brand_normalizer を経由しない)。
      - name: Install pyyaml
        run: pip install pyyaml

      # hugo/data/brand_hub.json は /hugo gitignore で repo に居ない。
      # 両 path (cron selector / dispatch override) が読むので runtime で生成する。
      - name: Build brand_hub.json
        run: python scripts/build_brand_hub_stats.py

      - name: Select target brand
        id: select
        env:
          INPUT_BRAND: ${{ github.event.inputs.brand }}
        run: |
          set -e
          if [ -n "$INPUT_BRAND" ]; then
            # Workflow_dispatch override: bypass selector, pull stats directly.
            python - <<PY > /tmp/brand.json
          import json, sys
          with open('hugo/data/brand_hub.json', encoding='utf-8') as f:
              hub = json.load(f)
          name = "${INPUT_BRAND}"
          stats = hub.get('brands', {}).get(name)
          if not stats or stats.get('count', 0) < 3:
              print(f"::error::brand '{name}' not in brand_hub.json or count<3", file=sys.stderr)
              sys.exit(1)
          top3 = stats.get('top_3_series', [])
          out = {
              'brand': name,
              'count': stats['count'],
              'tier': stats.get('tier', '?'),
              'avg_ivs_100': stats.get('avg_ivs_100', 0),
              'avg_age_min_months': stats.get('avg_age_min_months', 0),
              'lowest_price': stats.get('lowest_price', 0),
              'top_3_series_csv': ', '.join(top3),
              'representative_asin': stats.get('representative_asin', ''),
              'representative_image': stats.get('representative_image', ''),
              'is_refresh': False,
              'previous_last_generated_at': None,
          }
          json.dump(out, sys.stdout, ensure_ascii=False)
          PY
          else
            # Cron path: let the selector pick (exits 2 if nothing eligible).
            if ! python scripts/select_brand_narrative_target.py > /tmp/brand.json; then
              echo "selector returned no eligible brand; nothing to do."
              echo "count=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "count=1" >> "$GITHUB_OUTPUT"
          BRAND=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['brand'])")
          echo "brand=$BRAND" >> "$GITHUB_OUTPUT"
          echo "Picked: $BRAND"
          cat /tmp/brand.json

      # #1329 Phase 3B: 蓄積 GSC 週次スナップショット (data/analytics/gsc_history/,
      # #1329 infra) から選定 brand が実際に検索されている語を抽出し、後段の
      # Jules prompt に「読者が実際に検索している語」として注入する材料を作る。
      # build_brand_query_context.py は read-only・write IO なし。歩留まりは
      # 低いブランドが大半 (実測 11/286, issuecomment-4940324426) だが
      # global_seo_hints は毎回非空になりやすいため常時実行する。失敗・データ
      # 欠如時は fallback:true として後段で graceful に扱う (workflow は落とさない)。
      - name: Build GSC query context (#1329 Phase 3B)
        if: steps.select.outputs.count == '1'
        id: query_context
        continue-on-error: true
        run: |
          BRAND=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['brand'])")
          python scripts/build_brand_query_context.py --brand "$BRAND" --out /tmp/query_context.json || true
          if [ -f /tmp/query_context.json ]; then
            cat /tmp/query_context.json
          else
            echo "build_brand_query_context.py failed or produced no output; prompt injection will be skipped."
          fi

      # 2026-06-08 (session 116 / #2008): Jules daily quota 共有ゲート。
      # この weekly cron は 1 run=1 session を作るが、quota 枯渇 (rolling-24h 100/100)
      # 時に従来は Create Jules session が HTTP 400 FAILED_PRECONDITION で hard-fail し、
      # 想定内の枠枯渇なのに workflow が赤通知 (noisy fail, session 112-114 持ち越し) になっていた。
      # jules_quota_gate.py で live API の rolling-24h 作成数 (cap 80 = 100 から 20 margin)
      # を確認し、残り予算 0 なら downstream を skip して green 終了する (prevent 側 graceful skip)。
      # 03-invoke-jules と同じ共有予算を尊重するため cap は揃える ([[reference-omochairo-jules-api-limits]])。
      - name: Jules quota gate
        if: steps.select.outputs.count == '1'
        id: gate
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -e
          BUDGET=$(python scripts/jules_quota_gate.py --cap 80 --max 1 || echo 0)
          echo "Jules quota gate budget: $BUDGET (rolling-24h 作成数ベース)"
          if [ "${BUDGET:-0}" -le 0 ]; then
            echo "Jules daily quota gate: budget 0; skipping narrative session (枠枯渇は想定内、green 終了)."
            echo "proceed=0" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: List Jules Sources
        if: steps.select.outputs.count == '1' && steps.gate.outputs.proceed == '1'
        id: list-sources
        run: |
          set -e
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            'https://jules.googleapis.com/v1alpha/sources' \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to list sources (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          SOURCE_NAME=$(echo "$BODY" | jq -r '.sources[] | select(.githubRepo.owner=="omochairo" and .githubRepo.repo=="amazon") | .name' 2>/dev/null || echo "")
          if [ -z "$SOURCE_NAME" ]; then
            SOURCE_NAME="sources/github/omochairo/amazon"
          fi
          echo "source_name=$SOURCE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Jules session
        if: steps.select.outputs.count == '1' && steps.gate.outputs.proceed == '1'
        id: create-session
        env:
          SOURCE_NAME: ${{ steps.list-sources.outputs.source_name }}
        run: |
          set -e
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          TODAY_ISO=${TODAY}T10:00:00+09:00
          BRAND=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['brand'])")
          # #2817 Phase 2: hugo/content/brands/ は英語スラッグ物理ディレクトリに
          # 移行済み。出力パスはスラッグを使う (表示名/frontmatter title は引き続き
          # JP の ${BRAND} を使う — content/tags,brands の title front matter が
          # JP 表示を担うので Jules 側の生成内容は変更不要)。brand.json から直接
          # 読む (シェル変数展開で JP 文字列を python リテラルに埋め込む経路は
          # クォート崩れのリスクがあるため避ける)。
          BRAND_SLUG=$(python -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          from term_slug import TermSlugMap
          brand = json.load(open('/tmp/brand.json', encoding='utf-8'))['brand']
          print(TermSlugMap().get_or_create(brand))
          ")
          COUNT=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['count'])")
          TIER=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['tier'])")
          AVG_IVS=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['avg_ivs_100'])")
          AVG_AGE=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['avg_age_min_months'])")
          LOWEST=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['lowest_price'])")
          TOP3=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['top_3_series_csv'])")
          IS_REFRESH=$(python -c "import json; print(json.load(open('/tmp/brand.json', encoding='utf-8'))['is_refresh'])")

          # #1329 Phase 3B: query_context.json (前ステップ, 失敗時は未生成) から
          # 「読者が実際に検索している語」セクションを組む。ファイル不在・fallback:true・
          # 汎用擬似ブランド (brand_taxonomy.yaml の exclude_from_taxonomy: true、例
          # 「ノーブランド」) はブランド個別クエリを注入せず global_seo_hints のみ
          # (それも空なら空文字列 = プロンプト不変)。捏造禁止ルールを必ず同梱する。
          QUERY_CONTEXT=$(python - <<'PY'
          import json, pathlib
          import yaml

          section = ""
          qc_path = pathlib.Path("/tmp/query_context.json")
          if qc_path.exists():
              try:
                  qc = json.loads(qc_path.read_text(encoding="utf-8"))
              except Exception:
                  qc = {}
              brand = qc.get("brand", "")
              is_generic = False
              try:
                  tax = yaml.safe_load(open("data/brand_taxonomy.yaml", encoding="utf-8"))
                  for b in tax.get("brands", []):
                      if b.get("canonical") == brand:
                          is_generic = bool(b.get("exclude_from_taxonomy"))
                          break
              except Exception:
                  pass
              lines = []
              queries = qc.get("queries") or []
              if queries and not qc.get("fallback") and not is_generic:
                  lines.append(f"- {brand} 指名で検索されている語 (直近{qc.get('weeks_covered', 0)}週, GSC実データ):")
                  for q in queries:
                      lines.append(f"  - 「{q['query']}」(impressions計 {q['impressions_sum']})")
              hints = qc.get("global_seo_hints") or {}
              age = hints.get("age_keywords_seen") or []
              intent = hints.get("intent_keywords_seen") or []
              if age:
                  lines.append(f"- サイト全体で観測される年齢層キーワード: {', '.join(age)}")
              if intent:
                  lines.append(f"- サイト全体で観測される購入意図キーワード: {', '.join(intent)}")
              if lines:
                  section = "\n【読者が実際に検索している語 (GSC実データ、言い回しの参考のみ)】\n"
                  section += "\n".join(lines)
                  section += "\n※ 上記は検索データの参考情報。データに無い年齢層・数値・事実を新たに創作してはならない(捏造禁止)。自然に盛り込めそうな箇所があれば言い回しの参考にする程度に留める。\n"
          print(section)
          PY
          )

          # Build prompt: AGENTS.md preamble + variable injection + template body.
          INTRO=$(cat <<EOF
          AGENTS.md を最初に必ず読み、その指示に厳密に従ってください。
          以下は #731 ブランドハブ narrative 生成タスクです。jules/BRAND_NARRATIVE_PROMPT.md
          をフル読み込みし、そこに書かれた scope / hallucination 防止 / frontmatter ルールを
          すべて守ってください。

          【今回生成する brand】: ${BRAND}
          【出力ファイル (新規作成のみ)】: hugo/content/brands/${BRAND_SLUG}/_index.md
          【本日の日付 (frontmatter last_generated_at に使用)】: ${TODAY_ISO}
          【データ (これ以外の事実は書かない)】:
            - count = ${COUNT}
            - tier = ${TIER}
            - avg_ivs_100 = ${AVG_IVS}
            - avg_age_min_months = ${AVG_AGE}
            - lowest_price = ${LOWEST}
            - top_3_series = ${TOP3}
          【既存ファイル状態】: is_refresh=${IS_REFRESH}
            - false (新規) なら作成、true (再生成) ならファイルを置き換え

          絶対守るリポジトリ保護ルール:
          - 新規ファイル追加 (または当該 _index.md の置き換え) のみ。他ファイルは触らない
          - .github/, scripts/, hugo/layouts/, data/ への変更は禁止
          - hugo/content/brands/${BRAND_SLUG}/_index.md 以外の hugo/content/ 配下も触らない
          - **最終 PR の差分は hugo/content/brands/${BRAND_SLUG}/_index.md の 1 ファイルのみ**
          - 作業中に作った fix_*.py / tmp_*.json 等は最終コミット前に必ず削除
          - frontmatter には title: "${BRAND}" / auto_generated: true / last_generated_at: "${TODAY_ISO}" を必ず含める
          ${QUERY_CONTEXT}
          === 以下、jules/BRAND_NARRATIVE_PROMPT.md の内容 ===
          EOF
          )
          PROMPT="$INTRO

          $(cat jules/BRAND_NARRATIVE_PROMPT.md)"

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_NAME" \
            --arg title "[wf14] narrative: ${BRAND} (#731)" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: {
                  startingBranch: "main"
                }
              },
              automationMode: "AUTO_CREATE_PR",
              title: $title
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
            -d "$REQUEST_BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP: $HTTP_CODE"
          # Non-200: dump raw body. jq projection は error 系 body で nulls を返して
          # 真因を隠す (HTTP 400 で {"error":{"message":...}} が見えなかった事例)。
          if [ "$HTTP_CODE" != "200" ]; then
            echo "--- raw response body ---"
            echo "$BODY"
            echo "--------------------------"
            echo "::error::Failed to create Jules session (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "$BODY" | jq -c '{name, id, status}' 2>/dev/null || echo "$BODY" | head -c 500
          SESSION_ID=$(echo "$BODY" | jq -r '.id // empty')
          if [ -z "$SESSION_ID" ]; then
            echo "::error::No session id returned"
            exit 1
          fi
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "Session: $SESSION_ID (brand=$BRAND)"

      - name: Wait for completion (best-effort)
        if: steps.create-session.outputs.session_id != ''
        env:
          SESSION_ID: ${{ steps.create-session.outputs.session_id }}
        run: |
          for i in $(seq 1 10); do
            sleep 30
            RESPONSE=$(curl -s \
              "https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID" \
              -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}")
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "unknown"')
            echo "[$i/10] status: $STATUS"
            if [ "$STATUS" = "COMPLETED" ] || [ "$STATUS" = "FAILED" ]; then
              exit 0
            fi
          done
          echo "Polling complete; Jules continues async."
