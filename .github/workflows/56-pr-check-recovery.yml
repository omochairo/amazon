name: PR Check Recovery

# #6609: pull_request イベントが GitHub 側で配送されず、required check
# (`validate` / `unit-tests`) が 1 件も付かないまま PR が永久 pending になる事故
# (#6606 実例) への自動復旧。トリガー定義側 (paths/branches フィルタ) に原因は無く、
# GitHub 側の配送問題 (再現条件未特定)。
#
# 2026-09-10: 当初の2段構え (workflow_dispatch 再実行 → 15分待って close→reopen) を
# close→reopen 一本化に変更 (詳細は scripts/recover_pending_pr_checks.py の
# docstring)。PR #6885 (#6933) で「workflow_dispatch run は required check を
# 満たさない」ことが実地で確定し、旧段1が常に何も解決しない無駄打ちだったため。
#
# cron を 3〜5 分にしないこと (#6609 の母艦指示): 15 分間隔なら 1 日 96 run で足りる。
# 実被害は「4 日 open のまま」なので、最悪 20〜30 分での復旧で十分。

on:
  schedule:
    # 2026-09-08 に一度停止し、同日中に復旧させた。停止の理由は
    # `gh pr list --json ...commits` が GraphQL のノード上限 (500,000) を
    # 静的コスト解析で必ず超えたこと (open PR が 0 件でも失敗する)。
    # #6810 で一覧から commits を外し、head commit の時刻は
    # `evaluate_pr` が実際に見る条件でだけ PR 単位に取る形へ直した。
    # 復旧前に dry_run=true (run 34230587664) が候補検出まで通ることを確認済み。
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '実際には close-reopen しない (ログのみ)'
        required: false
        default: 'false'

permissions:
  contents: read
  pull-requests: write
  # 2026-09-08: dry_run 初回実行が `gh pr list --json ...statusCheckRollup` で exit 1。
  # permissions を明示すると列挙外は none になるため、statusCheckRollup が読む
  # check-run / commit status に権限が無かった。
  checks: read
  statuses: read

concurrency:
  group: pr-check-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Recover pending PR checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/recover_pending_pr_checks.py --dry-run
          else
            python scripts/recover_pending_pr_checks.py
          fi
