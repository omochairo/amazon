name: Pre-fetch Third-Party Sources
# #1600 Phase 2: per_asin の第三者ソース (非販売のレビュー/解説/メディア URL) を
# Tavily Search API で pre-fetch し、data/raw/per_asin/<ASIN>/
# third_party_sources.json に書き出して PR + auto-merge する。
# Jules は記事生成時にこの候補 URL を裏取りソースとして活用できる (#1599 sources floor 対策)。
#
# backend は当初 Google CSE だったが 2026-01-20 仕様変更 (新規エンジンのウェブ全体検索廃止)
# で Tavily に切替 (session 102)。Tavily は Actions 共有 IP からも安定して叩ける。
# secret (TAVILY_API_KEY) 未設定時は script が inert に no-op するため
# 差分ゼロ → PR 作成は skip される (安全に空振り)。無料枠 1000/月 ≈ 33/日。
#
# レーンは 2 本ある。母集合が違うだけで、収集・保存の処理は共通:
#   1. 新規候補 (--pool --bands zero,thin / 30 件/日) — まだ記事になっていない ASIN
#   2. 既存記事 (--from-gsc / 20 件/日) — GSC の直近 4 週 imp>=10 かつ第三者ソース未保有
# 日次の枠は共有させない。2 が 1 の枠を食い尽くすと新規候補レーンが黙って飢える。
#
# ただし**月次の枠は共有する** (`--monthly-budget`, 既定 900)。日次上限だけだと
# 30 + 20 = 50/日 = 1,500/月 が名目上の上限になり、無料枠 1,000/月 を月末前に
# 使い切る。レーンは別プロセスなので、共有記録
# `data/raw/per_asin/_tavily_usage.json` に**実 API 呼び出し回数**を刻み
# (呼ぶ直前に 1 回ぶん)、残枠に合わせて日次上限を切り下げる。成功件数で数えると
# API を叩いてから落ちた呼び出しが上限に載らず、credit だけ消える。
# 到達したら 0 件で正常終了し、80% 超と 429 到達は `::warning::` で run に出す
# (#4793: 緑のまま収集数だけ静かに減る形にしない)。
#
# App token で PR 起票 (GITHUB_TOKEN だと anti-recursion guard で validate 不発火、
# main 直 push は GH006 silent reject になるため PR + auto-merge 経路を採る)。
on:
  workflow_dispatch:
    inputs:
      bands:
        description: '対象 band (カンマ区切り, 既定 zero,thin)'
        required: false
        default: 'zero,thin'
      max_queries:
        description: '新規候補レーンの日次上限 (Tavily 無料=1000/月≈33/日)'
        required: false
        default: '30'
      gsc_max_queries:
        description: '既存記事レーン (--from-gsc) の日次上限。0 で無効'
        required: false
        default: '20'
      gsc_min_impressions:
        description: '既存記事レーンの imp しきい値 (直近 4 週)'
        required: false
        default: '10'
      monthly_budget:
        description: '今月ぶんの取得上限 (2 レーン共有, Tavily 無料=1000/月)。0 で無効'
        required: false
        default: '900'
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    # 毎日 21:30 UTC (06:30 JST) — 朝の記事生成スロットの前に候補を仕込む
    - cron: '30 21 * * *'

# GITHUB_TOKEN の権限を明記する (#5045)。このレーンの書き込み (branch push /
# PR 作成 / auto-merge) は actions/create-github-app-token の App token で
# 行っており、GITHUB_TOKEN は checkout が読むだけ。宣言が無いとリポジトリ既定に
# 引きずられ、既定が write なら不要な書き込み権限を持って走り、read-only に
# 締めれば黙って壊れる。どちらの向きにも動かないよう固定する。
permissions:
  contents: read

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # レーン1: 新規候補 (まだ記事になっていない ASIN)。従来どおり。
      - name: Pre-fetch third-party sources (new candidates)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python scripts/fetch_third_party_sources.py \
            --pool \
            --bands "${{ github.event.inputs.bands || 'zero,thin' }}" \
            --max-queries "${{ github.event.inputs.max_queries || '30' }}" \
            --monthly-budget "${{ github.event.inputs.monthly_budget || '900' }}"

      # レーン2: 既存記事 (リライト対象)。母集合は GSC の需要で、band では絞らない。
      # レーン1 とは別プロセス・別 --max-queries で回す。枠を共有させると、母集合が
      # 桁違いに大きい既存記事が先に食い尽くして新規候補レーンが黙って飢える。
      #
      # --max-age-days を 90 にしているのは、Tavily が非販売 host を 2 件返せない ASIN が
      # 母集合に残り続けるため。既定の 30 日だと同じ空振りを毎月引き直すことになる。
      # 90 日でも四半期ごとに全件引き直すので、script 側の --empty-max-age-days
      # (既定 180 日 / 連続空振り回数だけ倍) で再問い合わせを後ろへ倒している。
      - name: Pre-fetch third-party sources (existing articles, GSC demand)
        if: ${{ (github.event.inputs.gsc_max_queries || '20') != '0' }}
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python scripts/fetch_third_party_sources.py \
            --from-gsc \
            --gsc-min-impressions "${{ github.event.inputs.gsc_min_impressions || '10' }}" \
            --max-age-days 90 \
            --max-queries "${{ github.event.inputs.gsc_max_queries || '20' }}" \
            --monthly-budget "${{ github.event.inputs.monthly_budget || '900' }}"

      - name: Create PR + enable auto-merge
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          if [ -z "$(git status --porcelain -- 'data/raw/per_asin')" ]; then
            echo "No third_party_sources changes (likely inert: secrets unset); skipping PR."
            exit 0
          fi
          # 古い同種 PR を掃除
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("third-party-sources/")) | .number' \
            | while read -r pr_num; do
            [ -n "$pr_num" ] && gh pr close "$pr_num" -d || true
          done
          BRANCH="third-party-sources/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/raw/per_asin
          if git diff --cached --quiet; then
            echo "Nothing staged; skipping."
            exit 0
          fi
          git commit -m "data: pre-fetch third-party sources (#1600 run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "data: third-party source pre-fetch (#1600, run ${{ github.run_id }})" \
            --body "Automated #1600 Phase 2 pre-fetch. data/raw/per_asin/**/third_party_sources.json と Tavily 消費カウンタ _tavily_usage.json のみ — no article changes." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        # #4793: continue-on-error を外した。auto-merge の有効化だけは上の
        # if/else で握りつぶしてあるので、ここに残っていたのは **git push と
        # gh pr create の失敗** を飲む効果だけだった。それが落ちるとその run の
        # データ更新が丸ごと消えるのに、continue-on-error のステップは REST の
        # steps[].conclusion も success を返すため run 一覧でも step 一覧でも
        # 見えない (#4793 項目2 の方針 (c))。01 / 19 で 08-18〜08-24 の連続
        # グリーンを確認したうえで残り 8 本へ広げたもの。
