name: Wiki Cache Refresh
# 週次で hugo/data/wiki_mapping.json を読み、Wikipedia REST API から要約を取得して
# hugo/static/wiki_cache.json を更新する。Issue #683 Phase 3。
#
# 設計:
# - 月曜 03:00 JST (= 日曜 18:00 UTC)
# - 1 req/sec × 487 entries ≈ 8 分 (初回 backfill)
# - 2 回目以降は 30 日 TTL 内なので API 呼び出しは差分のみ
# - 失敗は continue-on-error にせず通知 (silent_push_reject_trap 教訓)

on:
  # cron re-registered 2026-07-08 after unsuspension
  schedule:
    - cron: '0 18 * * 0'  # Sun 18:00 UTC = Mon 03:00 JST
  workflow_dispatch:
    inputs:
      limit:
        description: '1 ラン当たりの API 呼び出し上限 (空 = 全件)'
        required: false
        default: ''
      ttl_days:
        description: 'cache TTL 日数 (default 30)'
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: wiki-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build wiki_cache.json
        run: |
          set -e
          ARGS="--mapping hugo/data/wiki_mapping.json --out hugo/static/wiki_cache.json --ttl-days ${{ github.event.inputs.ttl_days || '30' }} --sleep 1.0"
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/fetch_wiki_data.py $ARGS

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/wiki-cache-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          # hugo/ は .gitignore 対象のため -f で強制 stage する (07-rakuten-ranking.yml と同パターン)。
          git add -f hugo/static/wiki_cache.json
          if git diff --cached --quiet; then
            echo "No changes to wiki_cache.json; skipping PR creation."
            exit 0
          fi
          git commit -m "data(wiki): auto refresh wiki_cache.json (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          # PR ベースで反映 (main 直 push は GH006 で silent reject される教訓 #silent_push_reject_trap)
          gh pr create --base main --head "$BRANCH" \
            --title "data(wiki): auto refresh wiki_cache.json" \
            --body "Auto-generated by [08-wiki-cache.yml](.github/workflows/08-wiki-cache.yml) run ${{ github.run_id }}. Refs #683." \
            --label todo
          gh pr merge "$BRANCH" --auto --squash
