name: Jules PR Auto-Merge
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'data/articles/**.json'
      - 'hugo/content/brands/**/_index.md'

permissions:
  contents: write
  pull-requests: write
  # 2026-05-18: workflow_dispatch event 作成 (Wait for merge and dispatch GitLab mirror step) のため必須。
  # 不足すると PR MERGED 検知後の `gh workflow run "Mirror main to GitLab"` が
  # HTTP 403 "Resource not accessible by integration" で失敗する。
  # 同 token 制約は 01-fetch-products.yml の PR #287 で経験済。
  actions: write

concurrency:
  group: jules-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Inspect changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # Triple-dot: diff from merge-base of BASE and HEAD to HEAD.
          # Excludes changes landed on main after this branch diverged so the
          # scope guard sees only what *this PR* added/modified.
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          # Safety: every changed file must be under data/articles/, data/raw/per_asin/,
          # or hugo/content/brands/*/_index.md (brand narrative Markdown).
          out_of_scope=$(echo "$changed" | grep -v -E '^(data/articles/|data/raw/per_asin/|hugo/content/brands/[^/]+/_index\.md$)' || true)
          if [ -n "$out_of_scope" ]; then
            echo "PR touches files outside auto-merge scope; skipping auto-merge."
            echo "out_of_scope<<EOF" >> "$GITHUB_OUTPUT"
            echo "$out_of_scope" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Eligibility: PR must add/modify at least one of
          #   (a) data/articles/YYYY-MM-DD-B0XXXXXXXX.json (Jules article PR)
          #   (b) hugo/content/brands/*/_index.md          (brand narrative PR, e.g. PR #1355)
          added_article=$(git diff --name-only --diff-filter=AM "$BASE_SHA"..."$HEAD_SHA" \
                    -- 'data/articles/*.json' \
                  | grep -v '\.quality\.json$' \
                  | grep -E 'data/articles/[0-9]{4}-[0-9]{2}-[0-9]{2}-B0[A-Z0-9]{8}\.json$' || true)
          added_brand=$(git diff --name-only --diff-filter=AM "$BASE_SHA"..."$HEAD_SHA" \
                    -- 'hugo/content/brands/*/_index.md' || true)
          if [ -z "$added_article" ] && [ -z "$added_brand" ]; then
            echo "No Jules-shaped article JSON or brand _index.md added; skipping auto-merge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$added_article" ]; then
            echo "Jules-eligible article JSON(s):"
            echo "$added_article"
          fi
          if [ -n "$added_brand" ]; then
            echo "Brand narrative _index.md:"
            echo "$added_brand"
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      # 2026-08-04 (#4469): スコープガード自体は正しい (任意のファイルを触る PR を
      # 無条件 auto-merge するほうが危険) が、skip が exit 0 = check pass 表示のまま
      # 無言だったため PR #4280 が 4 日間放置され記事 1 本の公開が遅れた。
      # ここでは判定を変えず「手動マージが要る」ことを PR 上に残すだけにする。
      # ラベルは 45-stale-pr-sweeper.yml の滞留レポートで理由表示に使う。
      # なお eligible=false のもう一方の分岐 (記事形の JSON が無い = sidecar のみの PR 等)
      # は他レーンの通常フローなので、ここでは out_of_scope のときだけ印を付ける。
      - name: Mark out-of-scope PR as needing manual merge
        if: steps.scope.outputs.eligible == 'false' && steps.scope.outputs.out_of_scope != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OUT_OF_SCOPE: ${{ steps.scope.outputs.out_of_scope }}
        run: |
          files=$(echo "$OUT_OF_SCOPE" | tr '\n' ' ')
          echo "::warning::auto-merge skipped (out of scope). Manual merge required. Out-of-scope files: ${files}"
          # ラベル付与に失敗しても auto-merge の判定には影響しないので非致命。
          gh pr edit "$PR_URL" --add-label auto-merge-skipped \
            || echo "::warning::could not add 'auto-merge-skipped' label (does the label exist?)"

      - name: Enable native auto-merge (squash)
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -e
          # gh requires branch protection / rulesets with a required check to honor --auto.
          # See PR description for the one-time `gh api` setup snippet.
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge (squash + delete-branch) enabled on $PR_URL."
          else
            echo "::warning::Could not enable auto-merge. This usually means branch protection or repo-level 'Allow auto-merge' is not configured. PR will need manual merge until setup is complete."
          fi

      # 2026-05-17 Step C-3: auto-merge を有効化した時点で jules-lock/<ASIN> を即時解放する。
      # 06-jules-lock-cleanup.yml の pull_request:closed トリガは
      # GITHUB_TOKEN 起因の merge では発火しない (GitHub Actions の既知制約) ため、
      # 05 側で能動的に削除する。失敗しても 06 schedule (30 分毎・TTL 1h) で回収されるので非致命。
      # 安全性: この時点で Jules PR が open 状態で存在し、03-invoke-jules.yml の pick-asin が
      # /tmp/open_titles.txt でも ASIN を除外するため、lock を消しても同 ASIN の再 pick は起きない。
      - name: Release jules-lock branch
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # ASIN は PR タイトル → head branch 名 (小文字混在可) の順で抽出
          ASIN=$(echo "$PR_TITLE" | grep -oE 'B0[A-Z0-9]{8}' | head -1 || true)
          if [ -z "$ASIN" ]; then
            ASIN=$(echo "$HEAD_REF" | grep -oiE 'b0[a-z0-9]{8}' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          fi
          if [ -z "$ASIN" ]; then
            echo "No ASIN found in PR title or head ref; skipping lock release"
            exit 0
          fi
          if gh api -X DELETE "repos/$REPO/git/refs/heads/jules-lock/$ASIN" 2>/dev/null; then
            echo "Released lock: jules-lock/$ASIN"
          else
            echo "No lock to release for $ASIN (already cleaned up or never existed)"
          fi

      # 2026-05-18: GITHUB_TOKEN による auto-merge は push event cascade を発火しない
      # (GHA 既知制約 — 無限ループ防止のため) ため、merge 後の main push を
      # トリガとする下流ワークフローが自動起動しない。
      # 対策: ここで PR が実際に MERGED になるまで polling し、検知したら
      # workflow_dispatch で下流を明示起動する。workflow_dispatch は GHA cascade
      # 制約の数少ない例外として GITHUB_TOKEN 経由でも下流を起動できる。
      #
      # 2026-07-10 (#2821 wave2): 旧実装は "Jules Publish Pipeline" (02-publish) を
      # dispatch していたが、02 は GitLab 移行で恒久 disable (GitHub Pages 廃止、
      # 配信は GitLab Pages / navi.omcha.jp。docs/failover-to-gitlab.md L44)。
      # disabled workflow を dispatch すると "could not find any workflows named ..."
      # で run 全体が fail し、auto-merge 自体は成功しているのに 05 が赤く見える
      # (履歴汚染 + real failure のマスク要因)。
      # 正しい下流は 40-mirror-to-gitlab: merge 済み main を GitLab へ push し、
      # GitLab の pages ジョブが build_post.py + hugo で再ビルド・配信する。
      # これを dispatch すれば「merge 後の即時 publish」という本来意図を GitLab
      # アーキテクチャ上で復元できる (未 dispatch でも次の cascade push で相乗り
      # mirror されるが、それだと数時間遅延する)。
      - name: Wait for merge and dispatch GitLab mirror
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # validate (~30s) + auto-merge (~10s) で通常 30-60s。6 分 (15s × 24) で十分なゆとり。
          MAX_ATTEMPTS=24
          attempt=0
          while [ $attempt -lt $MAX_ATTEMPTS ]; do
            state=$(gh pr view "$PR_NUMBER" -R "$REPO" --json state --jq '.state' || echo "UNKNOWN")
            echo "Attempt $((attempt+1))/$MAX_ATTEMPTS: PR #$PR_NUMBER state=$state"
            if [ "$state" = "MERGED" ]; then
              echo "PR merged. Dispatching GitLab mirror to publish."
              gh workflow run "Mirror main to GitLab" -R "$REPO" --ref main
              # 2026-07-12 (#2893 follow-up): この merge も GITHUB_TOKEN 起因のため
              # 21-ensure-tag-slugs.yml の push トリガーが発火しない (同じ既知制約)。
              # dispatch しないと新記事の tags が data/term_slugs.yaml に永久未登録の
              # まま溜まり、カテゴリ探索バー・商品カードタグ・おもちゃ診断のタグ一致等が
              # 日本語表示できずスラッグのまま出る (#2893 で発覚)。workflow_dispatch は
              # 全記事再スキャンだが ensure_tag_slugs.py は冪等なので毎 merge 起動でも安全。
              gh workflow run "Ensure Tag Slugs" -R "$REPO" --ref main
              echo "Dispatched."
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "PR closed without merge. Skipping mirror dispatch."
              exit 0
            fi
            attempt=$((attempt+1))
            sleep 15
          done
          echo "::warning::PR #$PR_NUMBER did not reach MERGED within timeout. GitLab mirror must be dispatched manually: gh workflow run \"Mirror main to GitLab\" --ref main"
