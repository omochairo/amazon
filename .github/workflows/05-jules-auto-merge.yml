name: Jules PR Auto-Merge
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'data/articles/**.json'

permissions:
  contents: write
  pull-requests: write
  # 2026-05-18: workflow_dispatch event 作成 (Wait for merge and dispatch publish step) のため必須。
  # 不足すると PR MERGED 検知後の `gh workflow run "Jules Publish Pipeline"` が
  # HTTP 403 "Resource not accessible by integration" で失敗する。
  # 同 token 制約は 01-fetch-products.yml の PR #287 で経験済。
  actions: write

concurrency:
  group: jules-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inspect changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # Triple-dot: diff from merge-base of BASE and HEAD to HEAD.
          # Excludes changes landed on main after this branch diverged so the
          # scope guard sees only what *this PR* added/modified.
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          # Safety: every changed file must be under data/articles/ or data/raw/per_asin/
          out_of_scope=$(echo "$changed" | grep -v -E '^(data/articles/|data/raw/per_asin/)' || true)
          if [ -n "$out_of_scope" ]; then
            echo "PR touches files outside data/articles/ or data/raw/per_asin/; skipping auto-merge."
            echo "out_of_scope<<EOF" >> "$GITHUB_OUTPUT"
            echo "$out_of_scope" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Must add or modify at least one data/articles/B0XXXXXXXX.json
          added=$(git diff --name-only --diff-filter=AM "$BASE_SHA"..."$HEAD_SHA" \
                    -- 'data/articles/*.json' \
                  | grep -v '\.quality\.json$' \
                  | grep -E 'data/articles/[0-9]{4}-[0-9]{2}-[0-9]{2}-B0[A-Z0-9]{8}\.json$' || true)
          if [ -z "$added" ]; then
            echo "No Jules-shaped article JSON added; skipping auto-merge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Jules-eligible article JSON(s):"
          echo "$added"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Enable native auto-merge (squash)
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -e
          # gh requires branch protection / rulesets with a required check to honor --auto.
          # See PR description for the one-time `gh api` setup snippet.
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge (squash + delete-branch) enabled on $PR_URL."
          else
            echo "::warning::Could not enable auto-merge. This usually means branch protection or repo-level 'Allow auto-merge' is not configured. PR will need manual merge until setup is complete."
          fi

      # 2026-05-17 Step C-3: auto-merge を有効化した時点で jules-lock/<ASIN> を即時解放する。
      # 06-jules-lock-cleanup.yml の pull_request:closed トリガは
      # GITHUB_TOKEN 起因の merge では発火しない (GitHub Actions の既知制約) ため、
      # 05 側で能動的に削除する。失敗しても 06 schedule (30 分毎・TTL 1h) で回収されるので非致命。
      # 安全性: この時点で Jules PR が open 状態で存在し、03-invoke-jules.yml の pick-asin が
      # /tmp/open_titles.txt でも ASIN を除外するため、lock を消しても同 ASIN の再 pick は起きない。
      - name: Release jules-lock branch
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # ASIN は PR タイトル → head branch 名 (小文字混在可) の順で抽出
          ASIN=$(echo "$PR_TITLE" | grep -oE 'B0[A-Z0-9]{8}' | head -1 || true)
          if [ -z "$ASIN" ]; then
            ASIN=$(echo "$HEAD_REF" | grep -oiE 'b0[a-z0-9]{8}' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          fi
          if [ -z "$ASIN" ]; then
            echo "No ASIN found in PR title or head ref; skipping lock release"
            exit 0
          fi
          if gh api -X DELETE "repos/$REPO/git/refs/heads/jules-lock/$ASIN" 2>/dev/null; then
            echo "Released lock: jules-lock/$ASIN"
          else
            echo "No lock to release for $ASIN (already cleaned up or never existed)"
          fi

      # 2026-05-18: GITHUB_TOKEN による auto-merge は push event cascade を発火しない
      # (GHA 既知制約 — 無限ループ防止のため) ため、02-publish.yml の
      # `push: paths: data/articles/**` トリガが起動しない。
      # 対策: ここで PR が実際に MERGED になるまで polling し、
      # 検知したら workflow_dispatch で publish を明示起動する。
      # workflow_dispatch は GHA cascade 制約の数少ない例外として GITHUB_TOKEN
      # 経由でも下流ワークフローを起動できる。
      - name: Wait for merge and dispatch publish
        if: steps.scope.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # validate (~30s) + auto-merge (~10s) で通常 30-60s。6 分 (15s × 24) で十分なゆとり。
          MAX_ATTEMPTS=24
          attempt=0
          while [ $attempt -lt $MAX_ATTEMPTS ]; do
            state=$(gh pr view "$PR_NUMBER" -R "$REPO" --json state --jq '.state' || echo "UNKNOWN")
            echo "Attempt $((attempt+1))/$MAX_ATTEMPTS: PR #$PR_NUMBER state=$state"
            if [ "$state" = "MERGED" ]; then
              echo "PR merged. Dispatching Jules Publish Pipeline."
              gh workflow run "Jules Publish Pipeline" -R "$REPO" --ref main
              echo "Dispatched."
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "PR closed without merge. Skipping publish dispatch."
              exit 0
            fi
            attempt=$((attempt+1))
            sleep 15
          done
          echo "::warning::PR #$PR_NUMBER did not reach MERGED within timeout. Publish must be dispatched manually: gh workflow run \"Jules Publish Pipeline\" --ref main"
