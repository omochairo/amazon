name: Unit Tests

# #4007 follow-up 3: scripts/tests/ の unit test (1700+ ケース) はこれまで CI で
# 実行されておらず、ローカル実行のみだった。
#
# なぜ既存の `validate` job (04-validate-article-pr.yml) に相乗りさせず独立
# workflow にしたか:
#   1. (2026-08-02 #4384 で解消済み) 当時 04-validate-article-pr.yml の `paths`
#      allowlist が 224 件まで肥大し、script-only PR で登録漏れがあると required
#      check `validate` が不発 → auto-merge 永久 pending になる inverse-trap を
#      繰り返し踏んでいた。#4384 で paths を撤廃したのでこの理由はもう成立しない。
#      分離の根拠は下の 2 のみ。
#   2. `validate` は記事 JSON の schema 検証 + quality gate + (対象ファイル
#      変更時のみ) Creator API dry-run という「記事 PR 用」の性質を持つ。
#      scripts/ 全体の unit test はその関心事と別物であり、独立させたほうが
#      失敗時の切り分けが速い。
#
# required check への昇格 (#4069):
#   観察レーンとして始めた workflow で、branch protection の required check には
#   まだ入れていない。いきなり必須化すると、未検出のフレーク/環境差異があった
#   場合に全 PR がブロックされるため、まず数週間グリーンで安定することを見る
#   という条件を置いた。
#
#   2026-08-20 実測 (paths 撤廃の 08-02 から 18 日・全期間 run 1,235 本) で
#   観察 3 項目はすべて満たした:
#
#   1. 安定性 … success 1,218 (98.6%) / failure 15 (1.2%) / cancelled 2。
#      **フレークは 0**。同一ブランチを再実行して結果が割れた例が無く、
#      failure 15 本はすべて実際のコード状態に起因する (内訳は下の「残る
#      唯一のリスク」参照)。
#   2. 取りこぼし … pull_request 側の paths は撤廃済みなので構造的に発生しない。
#      直近 merged PR 150 本 (App bot 87 / omochairo 46 / iromama 17) の
#      **150/150 に unit-tests の check が付いている**。PR を作る 25 workflow は
#      すべて GitHub App token を使っており、GITHUB_TOKEN 由来の PR が
#      pull_request workflow を起こさない罠 (= required check が永久 pending)
#      には当たらない。
#   3. run 時間 … 直近 30 run で 82〜109 秒 (中央値 92 秒)。テストが
#      1,812 → 2,805 ケースに増えた分で伸びているが許容範囲。
#
#   fork PR の懸念は解消済み: 下の overlay checkout は 2026-08-12 から
#   `if: env.HAS_BRAIN_PAT == 'true'` で条件付きになっており、secrets が
#   渡らない fork PR でも job は完走する。
#
#   残る唯一のリスク — 実データを読むテストが data PR で赤くなる経路:
#     failure 15 本の内訳は 08-04 に 11 本 (test_report_census_404 のコード
#     バグで main が約 3.5 時間壊れた窓)、08-10 に 2 本、08-13 に 1 本、
#     07-27 に 1 本 (この workflow 自身の開発中ブランチ)。
#
#     このうち **08-10 の 2 本だけが性質が違う**。
#     test_check_history_freshness.py::test_real_history_all_lanes_registered が
#     実 data/analytics/history/ を読んでおり、quality_census.jsonl が初めて
#     書かれた時点で「レーン未登録」として赤くなった。無関係な 2 ブランチが
#     同時に落ちている = **コード PR ではなく data の増加が原因**。
#
#     required 化すると、この型の窓では全 PR (bot の data PR を含む) が止まる。
#     ただし (a) 24 日で 1 回・同日の他 131 run は success なので窓は短く、
#     (b) 修正 = レーン登録のコード変更なので**修正 PR 自体は緑になり**
#     デッドロックしない。実データを読むテストは他にも約 20 本あるが、
#     この経路で赤くなった実績はこの 1 件だけ。
#
#     詰まったときの正しい直し方は「テストを無効化する」ではなく
#     「レーンを登録する / 実データの前提を直す」。詰まりが長引く場合の
#     エスケープハッチは admin による bypass merge しかないので、
#     required 化は owner (admin 権限保持者) の判断で行うこと。
#
#   昇格の手順 (2026-08-20 に write 権限で実行を試みて 404。**admin 権限が要る**):
#
#     ENDPOINT=repos/omochairo/amazon/branches/main/protection/required_status_checks
#     gh api -X PATCH "$ENDPOINT" --input - <<'JSON'
#     {"checks":[{"context":"validate","app_id":15368},
#                {"context":"unit-tests","app_id":15368}]}
#     JSON
#
#   - context 名は job id の `unit-tests` (job に name: を付けていないため)
#   - このエンドポイントは checks を**置換**する。現在の required check は
#     `validate` 1 本 (app_id 15368 = GitHub Actions) なので、消さないよう併記する
#   - app_id を指定すると「GitHub Actions が報告した validate / unit-tests」しか
#     required を満たせなくなる。省略すると任意の App が同名 context を報告できる
#   - strict (= merge 前に main へ追従させる) は指定しなければ現状維持
#
#   現状の確認は admin でなくてもできる。protection エンドポイントは write では
#   404 (権限不足でも 404 が返るので「保護が無い」と読まないこと) だが、
#   branches エンドポイントは required_status_checks を返す:
#
#     gh api repos/omochairo/amazon/branches/main -q '.protection.required_status_checks'
#
#   enforcement_level は non_admins。下記の data 起因で詰まった窓が長引いた
#   場合は、admin による bypass merge がエスケープハッチになる。

on:
  # 2026-08-02 (#4069 ステップ1): pull_request 側の paths を撤廃した。
  #
  # 撤廃前は `scripts/**` にしか反応しなかったため、この workflow を required
  # check に昇格させると **`scripts/` を触らない PR が全て永久 pending =
  # マージ不能**になる。PR 流量の大半は cron が作る `data/**` のみの PR
  # (記事生成 / price watch / engagement drafts / fetch update、25〜47 件/日)
  # なので、昇格した瞬間にコンテンツパイプライン全体が止まる。#4384 で
  # `validate` から paths を撤廃したのと同じ inverse-trap で、昇格の前提条件。
  #
  # pytest をガードせず全 PR で無条件に走らせるのは意図的。「どのファイルが
  # テストに影響するか」を判定する条件を書いた瞬間、#4384 で消したばかりの
  # allowlist を小さく作り直すことになる。実際その穴は既にあり、
  # requirements.txt の bump や data/schema の変更はテスト結果を動かしうるのに
  # `scripts/**` に一致しない (test_rakuten_ranking_match.py は実 data/raw を
  # 読む)。無条件実行なら穴ごと消える。
  #
  # コストは 1 PR あたり ~52 秒 (ほぼ pip install の時間。pytest 本体は
  # 1,812 ケースで 8 秒台)。public repo なので Actions 分は無料で、
  # 下の concurrency が in-progress を打ち切る。
  #
  # なお push 側の paths は残している。pull_request 側で全 PR がテストを
  # 通っているため、main への push で再実行する価値があるのは scripts/ が
  # 動いたときだけ。
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      # #4069: fork からの PR には secrets が渡らない。secrets コンテキストは
      # if: で直接評価できないので、job の env に真偽値として写して下の step で
      # 参照する。
      HAS_BRAIN_PAT: ${{ secrets.NAVI_BRAIN_PAT != '' }}
    steps:
      # #5047: fetch-depth を既定 (=1) に戻した。この job は pytest を回すだけで、
      # git 履歴を読む操作 (git log / rev-list / merge-base) も push も無いので
      # 全履歴を引く理由が無い。リポジトリは約 190MB (data/raw だけで 49,000
      # ファイル超) で、記事・価格・SEO データが毎日積み上がるため単調増加する。
      # ここは全 PR で無条件に走る = 流量が最大なので、fetch-depth 見直しの
      # パイロットとして最も効果と安全性の比が良い。
      #
      # 他 22 workflow の fetch-depth: 0 は据え置き。大半が commit-back して
      # push するのでレーンごとに base の取り方が違い、一律置換は危険。
      # 特に 40-mirror-to-gitlab は GitLab へ HEAD:main を丸ごと転送するので
      # 全履歴が必須 (外すと非 fast-forward reject になり、フェイルオーバー
      # 痕跡の判定と区別が付かなくなる)。恒久的に対象外。
      - uses: actions/checkout@v7

      # jules/ プロンプトは private repo (amazon-navi-brain) に分離済み。
      # 04-validate-article-pr.yml と同じ overlay checkout を行う。
      #
      # #4069: fork からの PR では secrets.NAVI_BRAIN_PAT が空になり、この step が
      # 落ちて job ごと失敗する。required check に昇格させると **fork PR が構造的に
      # マージ不能**になるため、昇格の前提としてここを条件付きにする。
      #
      # skip して安全な根拠 (2026-08-12 実測): jules/ が無い状態で
      # `python -m pytest scripts/tests -q` は 2,354 passed / 2 skipped で完走する。
      # build_jules_prompt の PROMPT_TEMPLATE.md 読み込みは fail-soft で、テストは
      # そこに依存していない。将来 jules/ 必須のテストを足すなら、この step を
      # 戻すのではなく **そのテスト側で skip 条件を持つ**こと (ここを無条件必須に
      # 戻すと fork PR のマージ不能が復活する)。
      #
      # continue-on-error は使わない。#4793 のとおり、握りつぶすと失効した token が
      # 緑のまま放置される。条件で「そもそも走らせない」ほうが状態が明示的。
      - name: Checkout prompt brain (private) into jules/
        if: env.HAS_BRAIN_PAT == 'true'
        uses: actions/checkout@v7
        with:
          repository: omochairo/amazon-navi-brain
          token: ${{ secrets.NAVI_BRAIN_PAT }}
          path: jules

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # #5043: この workflow は全 PR で無条件に走り (PR 流量は記事 PR だけで
          # 25〜47 件/日)、実行時間 ~52 秒のほぼ全部が下の pip install。
          # requirements.txt の hash をキーに wheel をキャッシュする。
          # キャッシュ miss / 復元失敗は fail にならないので、入れて壊れる方向が無い。
          # 他の 38 箇所の setup-python にも同じ効果があるが、まずここだけで
          # 実測してから広げる。
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt
        # requirements.txt はプロダクション実行依存 (fetch/build 系) のみを
        # 管理しており pytest を含まない。CI 専用の test runner なのでここで
        # 個別に入れる (requirements.txt に足すと本番実行環境にも
        # 不要な test 依存が付く)。

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest scripts/tests -q

      # hugo/static/sw.js (Service Worker) は Python から検証できないため node の
      # 標準 test runner で回す。ubuntu-latest には node が同梱されており
      # setup-node も依存インストールも要らない (実行 0.1 秒台)。
      # ここを別 workflow に切らないのは #4069 と同じ理由 — required check 昇格の
      # 判断対象を増やすと、また「どの PR で発火するか」の allowlist を作り直す
      # ことになるため。
      - name: Run service worker tests
        run: node --test "tests/js/*.test.mjs"
