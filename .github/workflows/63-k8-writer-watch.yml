name: K8 Writer Lane Watch

# navi-brain#170 C1: K8 の記事レーン (scripts/writer_lane.py・タスク \k8\navi_writer) が
# 黙って止まったことに気付くための見張り。
#
# レーンの数字 (本数・合格率・不合格の理由・枠切れ) は private の navi-brain の記録用 issue に
# K8 自身が毎回書く。ただし K8 そのものが止まる (電源・ネット断・ログオフ) と、その書き込みも
# 来ないので気付けない。ここは K8 の外 (GitHub Actions) から「`[k8-writer]` の記事 PR が
# 48 時間出ていない」を見て run を赤にする (失敗の通知が届く)。public なので数字は書かない。
#
# 48 時間にしているのは、枠切れや出典不足で 1 日 0 本になることは普通にあるため。
# 2 日続けて 0 本なら、K8 の停止・agy の枠切れの連続・不合格の連続のどれかを疑う。
# 記事 PR が 1 件も見つからないときも赤にする (題の形式が変わると見張りが黙って死ぬため)。

on:
  schedule:
    # 03:20 UTC = 12:20 JST。レーンは 02:30 JST に回る
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the latest k8-writer article PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAX_AGE_HOURS: '48'
        run: |
          set -euo pipefail
          # 検索は「k8-writer」を k8 と writer に分けて当てるので、題に K8 と writer を含む
          # 別の PR (レーン本体の修正など) にも当たる。記事 PR の題の先頭で絞る
          latest=$(gh pr list -R "$REPO" --state all \
            --search '"記事生成" k8-writer in:title sort:created-desc' --limit 30 \
            --json createdAt,title \
            --jq '[.[] | select(.title | startswith("[k8-writer] 記事生成"))] | .[0].createdAt // ""')
          if [ -z "$latest" ]; then
            # レーンは 2026-11-15 から PR を出している。0 件は「試運転前」ではなく、題の形式が
            # 変わって絞り込みに当たらなくなったか、検索が壊れたかのどちらか。緑で抜けると
            # 見張りが永久に何もしなくなるので赤にする
            echo "::error::'[k8-writer] 記事生成' で始まる PR が直近の検索結果に 1 件も無い。記事 PR の題の形式 (scripts/writer_lane.py) が変わっていないか確かめる"
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$latest" +%s) ) / 3600 ))
          echo "latest k8-writer article PR: created ${latest} (${age}h ago)"
          if [ "$age" -ge "$MAX_AGE_HOURS" ]; then
            echo "::error::K8 の記事レーンの PR が ${age} 時間出ていない。K8 の停止・agy の枠切れ・不合格の連続を疑う (理由は navi-brain の記録用 issue と K8 の C:\\Users\\AIsys\\k8jobs\\navi-writer\\lane.log)"
            exit 1
          fi
