name: Jules Engagement Refill (X mama / Threads papa)
# Issue #1495 P1 (session 91) + Issue #1539 (session 94: 週 2 化):
#   - 月曜 03:00 UTC = 12:00 JST: X (いろママ) 用 daily drafts 7-10 本生成
#   - 火曜 03:00 UTC = 12:00 JST: Threads (いろパパ) 用 daily drafts 7-10 本生成
#   - 木曜 03:00 UTC = 12:00 JST: X (いろママ) 用 2 回目補充
#   - 金曜 03:00 UTC = 12:00 JST: Threads (いろパパ) 用 2 回目補充
#   - 各 channel 週 14-20 本目安。8 slot publisher (#1539) で daily スロット 3/日 × 7 日
#     = 21 件/週 のうち、queue 枯渇による穴開けが週 1-2 回以下になる想定。
#   - Jules が data/engagement_queue_{x,threads}.jsonl に append-only で PR を作る
#   - PR の auto-merge は 31-engagement-auto-merge.yml が担う
#
# 30-sns-engagement.yml の最初の daily スロット (09:30 JST) より早く投入したいので
# Jules 補充は 12:00 JST 開始 → 同日中の publish には間に合わないことが多い (Jules
# session は 30 分〜数時間)。実際は「翌日以降に確実に間に合う」運用。
on:
  workflow_dispatch:
    inputs:
      channel:
        description: '補充 channel'
        required: true
        type: choice
        options: [x, threads]
        default: x
  schedule:
    - cron: '0 3 * * 1'  # Mon -> X (iromama) #1 of week
    - cron: '0 3 * * 2'  # Tue -> Threads (iropapa) #1 of week
    - cron: '0 3 * * 4'  # Thu -> X (iromama) #2 of week
    - cron: '0 3 * * 5'  # Fri -> Threads (iropapa) #2 of week

# GITHUB_TOKEN の権限を明記する (#5045)。このレーンは Jules への dispatch と
# 生成物の受け取りだけで、GITHUB_TOKEN による書き込みは無い (private repo の
# overlay checkout は secrets.NAVI_BRAIN_PAT が担う)。宣言が無いとリポジトリ既定に
# 引きずられ、既定が write なら不要な書き込み権限を持って走る。
permissions:
  contents: read
# 同じレーンの run を同時に走らせない (#5044)。
#
# queue 補充は「今の queue 残量を見て不足分を Jules に発注する」ので、run が
# 重なると両方が同じ不足を見て二重に発注する (発注は非冪等で、Jules の quota と
# 重複ドラフトを消費する)。cancel-in-progress: false にして、走っている発注を
# 途中で殺さずに直列化する。
concurrency:
  group: jules-engagement-refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - name: Decide channel
        id: pick
        run: |
          set -e
          if [ -n "${{ inputs.channel }}" ]; then
            CHANNEL="${{ inputs.channel }}"
          else
            DOW=$(date -u +%u)  # Mon=1 Tue=2 Thu=4 Fri=5 (UTC 03:00 = JST 12:00 同日)
            case "$DOW" in
              1|4) CHANNEL="x" ;;        # Mon/Thu -> X (iromama)
              2|5) CHANNEL="threads" ;;  # Tue/Fri -> Threads (iropapa)
              *)
                echo "::error::cron fired on unexpected DOW=$DOW"
                exit 1
                ;;
            esac
          fi
          if [ "$CHANNEL" = "x" ]; then
            PROMPT_FILE="jules/PROMPT_ENGAGEMENT_X_IROMAMA_DAILY.md"
            QUEUE_FILE="data/engagement_queue_x.jsonl"
            PERSONA="iromama"
          else
            PROMPT_FILE="jules/PROMPT_ENGAGEMENT_THREADS_IROPAPA_DAILY.md"
            QUEUE_FILE="data/engagement_queue_threads.jsonl"
            PERSONA="iropapa"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prompt_file=$PROMPT_FILE" >> "$GITHUB_OUTPUT"
          echo "queue_file=$QUEUE_FILE" >> "$GITHUB_OUTPUT"
          echo "persona=$PERSONA" >> "$GITHUB_OUTPUT"
          echo "Channel=$CHANNEL persona=$PERSONA prompt=$PROMPT_FILE queue=$QUEUE_FILE"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      # jules/ プロンプトは private repo (amazon-navi-brain) に分離済み。実行時に overlay checkout。
      - name: Checkout prompt brain (private) into jules/
        uses: actions/checkout@v6
        with:
          repository: omochairo/amazon-navi-brain
          token: ${{ secrets.NAVI_BRAIN_PAT }}
          path: jules

      # 2026-06-08 (session 117 / #2008): Jules daily quota 共有ゲート。
      # この daily cron は 1 run=1 session を作る。quota 枯渇 (rolling-24h 100/100) 時に
      # 従来は Create Jules session が HTTP 400 FAILED_PRECONDITION で hard-fail し、
      # 想定内の枠枯渇なのに workflow が赤通知 (noisy fail) になっていた。
      # jules_quota_gate.py で live API の rolling-24h 作成数 (cap 80 = 100 から 20 margin)
      # を確認し、残り予算 0 なら downstream を skip して green 終了する (prevent 側 graceful
      # skip)。03-invoke-jules と同じ共有予算を尊重 ([[reference-omochairo-jules-api-limits]])。
      - name: Jules quota gate
        id: gate
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -e
          BUDGET=$(python scripts/jules_quota_gate.py --cap 80 --max 1 || echo 0)
          echo "Jules quota gate budget: $BUDGET (rolling-24h 作成数ベース)"
          if [ "${BUDGET:-0}" -le 0 ]; then
            echo "Jules daily quota gate: budget 0; skipping engagement refill session (枠枯渇は想定内、green 終了)."
            echo "proceed=0" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: List Jules sources
        if: steps.gate.outputs.proceed == '1'
        id: list-sources
        run: |
          set -e
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            'https://jules.googleapis.com/v1alpha/sources' \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::List sources HTTP $HTTP_CODE"
            exit 1
          fi
          SOURCE_NAME=$(echo "$BODY" | jq -r '.sources[] | select(.githubRepo.owner=="omochairo" and .githubRepo.repo=="amazon") | .name' || echo "")
          if [ -z "$SOURCE_NAME" ]; then SOURCE_NAME="sources/github/omochairo/amazon"; fi
          echo "source_name=$SOURCE_NAME" >> "$GITHUB_OUTPUT"
          echo "Source: $SOURCE_NAME"

      - name: Create Jules session
        if: steps.gate.outputs.proceed == '1'
        env:
          CHANNEL: ${{ steps.pick.outputs.channel }}
          PERSONA: ${{ steps.pick.outputs.persona }}
          PROMPT_FILE: ${{ steps.pick.outputs.prompt_file }}
          QUEUE_FILE: ${{ steps.pick.outputs.queue_file }}
          SOURCE_NAME: ${{ steps.list-sources.outputs.source_name }}
        run: |
          set -e
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          INTRO="AGENTS.md を最初に必ず読み、その指示に厳密に従ってください。

          【今回のタスク】: SNS engagement 投稿 draft を 7〜10 本生成し、
          ${QUEUE_FILE} に append-only で追加する。
          (週 2 回補充。本日が同 channel の 2 回目補充なら、既存 queue を踏まえて
           モチーフ被りを最小化する。本数は 7 本でも可。)

          【本日 (Asia/Tokyo)】: ${TODAY}
          - 各 draft の created_at は本日の現在時刻 (+09:00)
          - id 連番は本日付 + 001 から 010

          【絶対守るリポジトリ保護ルール】:
          - 最終 PR 差分は ${QUEUE_FILE} の追記 1 ファイルのみ
          - 既存行は 1 文字も変更しない (append のみ)
          - 他ファイル変更禁止 (.github/, scripts/, hugo/ 全て NG)
          - 31-engagement-auto-merge.yml の scope guard が他ファイル混入を検知して
            auto-merge を止めるので、混入させると人手介入が必要になる

          === 以下、${PROMPT_FILE} の内容 ==="
          PROMPT="$INTRO

          $(cat "$PROMPT_FILE")"

          REQUEST_BODY=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_NAME" \
            --arg title "[wf29] engagement: ${CHANNEL} ${PERSONA} daily drafts (${TODAY})" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: { startingBranch: "main" }
              },
              automationMode: "AUTO_CREATE_PR",
              title: $title
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
            -d "$REQUEST_BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP: $HTTP_CODE"
          echo "$BODY" | jq -c '{name, id, status}' 2>/dev/null || echo "$BODY" | head -c 500
          if [ "$HTTP_CODE" != "200" ]; then
            # FAILED_PRECONDITION → memory: feedback_jules_api_failed_precondition.md
            echo "::error::Create session HTTP $HTTP_CODE"
            exit 1
          fi
          SESSION_ID=$(echo "$BODY" | jq -r '.id // empty')
          if [ -z "$SESSION_ID" ]; then
            echo "::error::No session id returned"
            exit 1
          fi
          echo "Session created: $SESSION_ID (channel=$CHANNEL persona=$PERSONA)"

      - name: Note on completion
        if: steps.gate.outputs.proceed == '1'
        run: |
          echo "::notice::Jules session dispatched (AUTO_CREATE_PR). 完了後 31-engagement-auto-merge.yml が PR を auto-merge する。"
          echo "::notice::配信は翌日以降の 09:30 / 15:00 / 19:30 JST daily スロット (30-sns-engagement.yml #1539) から消化される。"
