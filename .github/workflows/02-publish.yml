name: Jules Publish Pipeline
on:
  push:
    paths:
      - 'data/raw/**'
      - 'data/articles/**'
      - 'hugo/content/**'
      - 'scripts/**'
      - 'AGENTS.md'
  workflow_run:
    workflows: ["Fetch Amazon Products"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: "publish"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # workflow_run の場合は成功時のみ実行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 2026-05-13: v3 旧エンジン (jules_article_engine.py) の自動実行を停止。
      # data/raw/ に居るが data/articles/ に v4 JSON が無い ASIN について、
      # 「【価格比較】〜｜どこで買うのが一番おトク？」型の低品質 v3 記事が
      # 自動生成・公開されていた問題に対応。v4 記事 (Jules 生成 PR) のみ公開する。
      # v3 を再有効化したい場合はこのコメントを参照し、ブロックを復活させること。

      - name: Layer 3 - Render Markdown
        run: python scripts/build_post.py

      - name: Debug Output
        run: |
          echo "=== Articles ==="
          ls -la data/articles/ || echo "No articles dir"
          echo "=== Hugo Posts ==="
          ls -la hugo/content/posts/ || echo "No posts dir"

      - name: Commit Generated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: AI-generated article update"
          file_pattern: "data/articles/ hugo/content/posts/"
          branch: main
        continue-on-error: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.0'
          extended: true

      - name: Build Hugo Site
        run: |
          cd hugo && hugo --minify --buildFuture --destination ../public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
