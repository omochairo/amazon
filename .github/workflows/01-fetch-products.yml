name: Fetch Amazon Products
on:
  workflow_dispatch:
    inputs:
      asins:
        description: 'カンマ区切りASIN'
        required: false
      keyword:
        description: '検索キーワード'
        required: false
  schedule:
    # 1日2回: 朝9時(JST=0:00 UTC) と 夕方18時(JST=9:00 UTC)
    - cron: '0 0 * * *'
    - cron: '0 9 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch Amazon Data
        run: |
          python scripts/fetch_amazon.py \
            --asin "${{ github.event.inputs.asins }}" \
            --keyword "${{ github.event.inputs.keyword }}" \
            --out data/raw/
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}

      - name: Fetch Trends
        if: ${{ always() }}
        run: python scripts/fetch_trends.py --out data/raw/

      - name: Fetch Rakuten Data
        if: ${{ always() }}
        run: python scripts/fetch_rakuten.py --out data/raw/
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Fetch YouTube Data
        if: ${{ always() }}
        run: python scripts/fetch_youtube.py --out data/raw/
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Fetch Yahoo News
        if: ${{ always() }}
        run: python scripts/fetch_yahoo_news.py --out data/raw/

      - name: Fetch Yahoo Shopping Data
        if: ${{ always() }}
        run: python scripts/fetch_yahoo.py "${{ github.event.inputs.keyword }}"
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}
          VALUECOMMERCE_PID: ${{ secrets.VALUECOMMERCE_PID }}

      - name: Fetch Books Data
        if: ${{ always() }}
        run: python scripts/fetch_books.py "${{ github.event.inputs.keyword }}"
        env:
          GOOGLEBOOKS_API_KEY: ${{ secrets.GOOGLEBOOKS_API_KEY }}

      - name: Cross-Search (Amazon→楽天/Yahoo個別検索)
        if: ${{ always() }}
        run: python scripts/fetch_cross_search.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}
          VALUECOMMERCE_PID: ${{ secrets.VALUECOMMERCE_PID }}

      - name: Fetch Reviews (楽天/Yahoo レビュー本文)
        if: ${{ always() }}
        run: python scripts/fetch_reviews.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}

      - name: Detect Signals (Layer 2)
        if: ${{ always() }}
        run: python scripts/signal_detector.py

      # 2026-05-17: branch protection の required `validate` check が main 直接 push を
      # 拒否する (PR #256 以降の Step A 設計)。stefanzweifel/git-auto-commit-action@v5
      # では GH006 で永続失敗していたので、ここで feature branch + PR + auto-merge に切替。
      # 04-validate-article-pr.yml は data/raw/** 変更でも走り、 article 差分が無ければ
      # validate ジョブは skip-on-empty で success 終了 → required check 通過。
      # PR は GITHUB_TOKEN で作成されるが、04 が `pull_request_target` を listen しているので
      # validate は確実に発火する。05-jules-auto-merge.yml は article 差分専用なので発火しない
      # → 本ステップ内で直接 auto-merge を有効化する。
      - name: Create data update PR + enable auto-merge
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # data/ 配下に差分が無ければ何もしない
          if git diff --quiet --exit-code -- data/ && [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes to commit; skipping PR creation."
            exit 0
          fi
          BRANCH="fetch-data/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing staged after git add; skipping."
            exit 0
          fi
          git commit -m "data: automated product data update (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "data: automated fetch update (run ${{ github.run_id }})" \
            --body "Automated fetch_amazon data refresh. data/raw/ updates only — no article changes." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"
          # GITHUB_TOKEN で作成された PR は `pull_request` / `pull_request_target` を
          # 発火させない (anti-recursion guard) ため、validate を workflow_dispatch で
          # 明示的に kick する。workflow_dispatch はガードの例外。
          # validate job の check_run は branch HEAD commit に付くので branch protection
          # の required `validate` を満たせる。
          if gh workflow run "Validate Article PR" --ref "$BRANCH"; then
            echo "Dispatched Validate Article PR on $BRANCH"
          else
            echo "::warning::Failed to dispatch Validate Article PR"
          fi
          # branch protection の required check (validate) が pass し次第 squash + delete-branch
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL — manual admin override may be required."
          fi
        continue-on-error: true
