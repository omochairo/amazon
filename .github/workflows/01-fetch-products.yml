name: Fetch Amazon Products
on:
  workflow_dispatch:
    inputs:
      asins:
        description: 'カンマ区切りASIN'
        required: false
      keyword:
        description: '検索キーワード'
        required: false
  schedule:
    # 1日2回: 朝9時(JST=0:00 UTC) と 夕方18時(JST=9:00 UTC)
    - cron: '0 0 * * *'
    - cron: '0 9 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # 2026-05-19 (session 29): GitHub App token に切替。GITHUB_TOKEN で作成した PR は
    # anti-recursion guard で pull_request event が発火せず validate (required check) が
    # 通らなかった (#382 #384 #386 の auto-merge stuck 事例)。App token なら通常 PR と
    # 同じ扱いで pull_request 経由 validate が発火する。permissions: は App 側 scope に
    # よって決まるので job レベル permissions は不要 (GITHUB_TOKEN を使わなくなったため)。
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Fetch Amazon Data
        run: |
          python scripts/fetch_amazon.py \
            --asin "${{ github.event.inputs.asins }}" \
            --keyword "${{ github.event.inputs.keyword }}" \
            --out data/raw/
        env:
          AMAZON_CREATORS_APPLICATION_ID: ${{ secrets.AMAZON_CREATORS_APPLICATION_ID }}
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}

      - name: Fetch Trends
        if: ${{ always() }}
        run: python scripts/fetch_trends.py --out data/raw/

      - name: Fetch Rakuten Data
        if: ${{ always() }}
        run: python scripts/fetch_rakuten.py --out data/raw/
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: Fetch YouTube Data
        if: ${{ always() }}
        run: python scripts/fetch_youtube.py --out data/raw/
        env:
          # 4 つの key は別 Google Cloud project の YouTube Data API v3 key。
          # fetch_youtube.py が quotaExceeded を検出するたびに次の slot に
          # フォールバックする (合計 ~40,000 units/day = manual dispatch 9 回/day 余裕)。
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY2: ${{ secrets.YOUTUBE_API_KEY2 }}
          YOUTUBE_API_KEY3: ${{ secrets.YOUTUBE_API_KEY3 }}
          YOUTUBE_API_KEY4: ${{ secrets.YOUTUBE_API_KEY4 }}

      - name: Fetch Yahoo News
        if: ${{ always() }}
        run: python scripts/fetch_yahoo_news.py --out data/raw/

      - name: Fetch Yahoo Shopping Data
        if: ${{ always() }}
        run: python scripts/fetch_yahoo.py "${{ github.event.inputs.keyword }}"
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}
          VALUECOMMERCE_PID: ${{ secrets.VALUECOMMERCE_PID }}

      - name: Fetch Books Data
        if: ${{ always() }}
        run: python scripts/fetch_books.py "${{ github.event.inputs.keyword }}"
        env:
          GOOGLEBOOKS_API_KEY: ${{ secrets.GOOGLEBOOKS_API_KEY }}

      - name: Cross-Search (Amazon→楽天/Yahoo個別検索)
        if: ${{ always() }}
        run: python scripts/fetch_cross_search.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          VALUECOMMERCE_SID: ${{ secrets.VALUECOMMERCE_SID }}
          VALUECOMMERCE_PID: ${{ secrets.VALUECOMMERCE_PID }}

      - name: Fetch Reviews (楽天/Yahoo レビュー本文)
        if: ${{ always() }}
        run: python scripts/fetch_reviews.py
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}

      - name: Detect Signals (Layer 2)
        if: ${{ always() }}
        run: python scripts/signal_detector.py

      # 2026-05-19 (session 34): per-ASIN フィルタを fetch PR に同梱する。
      # 旧設計では 02-publish.yml が filter_raw_per_asin.py を走らせた後に
      # stefanzweifel/git-auto-commit-action で main に直 push していたが、
      # main は branch protection で保護されており GH006 reject (silent fail with
      # continue-on-error: true)。結果として per_asin/<ASIN>/{youtube,news,books}.json
      # は永久にコミットされず、Jules が PROMPT_TEMPLATE.md §6.6 の指示通り
      # per_asin/<ASIN>/ を見に行っても空 → youtube_embeds/news/books が常に [] になる
      # 事故が発生していた (B0GJX8ZWCK 等で観測)。
      # ここで生成すれば既存の "Create data update PR + auto-merge" にバンドルされ、
      # validate を通して main にマージできる。
      - name: Filter raw per ASIN (Layer 2.5)
        if: ${{ always() }}
        run: python scripts/filter_raw_per_asin.py

      # 2026-05-19 (session 29): App token で PR 起票するため anti-recursion guard 対象外。
      # pull_request event が通常通り発火し、04-validate-article-pr.yml が required check
      # `validate` を満たす SUCCESS で返す → auto-merge SQUASH 即発火。
      # 旧設計の `gh workflow run "Validate Article PR"` による workflow_dispatch kick は
      # 不要になったため削除 (workflow_dispatch run は required check に算入されない問題が
      # auto-merge stuck の根本原因だった)。
      - name: Create data update PR + enable auto-merge
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          if git diff --quiet --exit-code -- data/ && [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes to commit; skipping PR creation."
            exit 0
          fi

          # Close any existing open fetch-data PRs to avoid conflicts and stale runs
          echo "Checking for old automated fetch PRs..."
          gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("fetch-data/")) | .number' | while read -r pr_num; do
            if [ -n "$pr_num" ]; then
              echo "Closing old PR #$pr_num and deleting branch..."
              gh pr close "$pr_num" -d || true
            fi
          done

          BRANCH="fetch-data/${{ github.run_id }}"
          git config user.name "omochairo-fetch-bot[bot]"
          git config user.email "omochairo-fetch-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing staged after git add; skipping."
            exit 0
          fi
          git commit -m "data: automated product data update (run ${{ github.run_id }})"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "data: automated fetch update (run ${{ github.run_id }})" \
            --body "Automated fetch_amazon data refresh. data/raw/ updates only — no article changes." \
            --base main \
            --head "$BRANCH")
          echo "Created: $PR_URL"
          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Auto-merge enabled on $PR_URL"
          else
            echo "::warning::Could not enable auto-merge on $PR_URL"
          fi
        continue-on-error: true
